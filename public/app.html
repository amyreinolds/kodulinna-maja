document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");
  if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case "view": mineVaade(el.dataset.view);save();render();break;
    case "uut": dlgUut();break;
    case "koik-loetud":
      margiKoikLoetuks();save();render();dlgUut();
      toast("Kõik on nüüd loetud.");break;
    case "uut-mine":{
      const x=uudisNimekiri[Number(el.dataset.i)];
      if(x){x.mine();closeDlg();save();render();}
      break;
    }
    case "add":
      if(view==="vestlus")dlgThread();
      else if(view==="yritused"||view==="kalender")dlgEvent(null);
      else if(view==="info")dlgInfo(null);
      else if(view==="kontakt")dlgPerson(null);
      else if(view==="myyk")dlgMyyk(null);
      else if(view==="tootajad")dlgToo(null);
      else pickFiles();
      break;
    case "kopeeri": {
      /* Arvutis ei ole kuhugi helistada — number läheb lõikelauale, et
         saaks telefoni sisse toksida. Kui lõikelaud ei ole lubatud,
         valime teksti ära, siis saab Ctrl+C-ga võtta. */
      const t=el.dataset.v;
      const vali=()=>{
        const r=document.createRange(); r.selectNodeContents(el);
        const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        toast("Vajuta Ctrl+C, et number kopeerida.");
      };
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(t).then(()=>toast("Kopeeritud: "+t),vali);
      else vali();
      break;}
    case "abi": dlgAbi();break;
    case "seaded": dlgSeaded();break;
    case "valja":
      fetch("/api/valja",{method:"POST"}).then(()=>location.href="/");
      break;
    case "size": seaded.suurus=el.dataset.v;saveSeaded();applySeaded();dlgSeaded();break;
    case "teema": seaded.teema=el.dataset.v;saveSeaded();applySeaded();dlgSeaded();break;

    case "ava":
      chat={type:el.dataset.type,id};snap={};
      markSeen(el.dataset.type==="kiri"?"dm:"+dmKey(meId(),id):"thread:"+id);
      save();render();break;
    case "kirjuta":
      view="vestlus";chat={type:"kiri",id};snap={};
      markSeen("dm:"+dmKey(meId(),id));save();render();break;
    case "send": sendMsg();break;
    case "q": opened.has(id)?opened.delete(id):opened.add(id);render();break;
    case "q-send":{
      const e=S.events.find(x=>x.id===id);if(!e)break;
      const t=document.getElementById("q_"+id);
      const v=t?t.value.trim():"";
      if(!v){toast("Kirjuta kõigepealt oma küsimus.");break;}
      e.comments=e.comments||[];
      e.comments.push({id:uid(),by:meId(),at:new Date().toISOString(),text:v});
      save();render();toast("Küsimus lisatud. Kõik liikmed näevad seda.");break;
    }
    case "rsvp":{
      const e=S.events.find(x=>x.id===id);if(!e)break;
      e.rsvp=e.rsvp||{};
      /* Vastust ei saa teise klõpsuga tühistada — muuta saab ainult teise nupuga.
         Muidu kustutab kogemata tehtud teine klõps vastuse nii, et keegi ei märka. */
      e.rsvp[meId()]=el.dataset.v;
      save();render();break;
    }
    case "ack":{
      const o=(el.dataset.kind==="ev"?S.events:S.info).find(x=>x.id===id);if(!o)break;
      o.acks=o.acks||{};
      if(o.acks[meId()])delete o.acks[meId()];
      else{o.acks[meId()]=new Date().toISOString();toast("Kinnitatud. Teised näevad nüüd, et sa oled lugenud.");}

    }

      const l=$("#hrows");
      if(l){
        const d=document.createElement("div"); d.className="r";
        d.innerHTML='<input type="text" class="nm" aria-label="Nimetus">'
          +'<input type="text" class="hd" aria-label="Hind" placeholder="hind">'
          +'<button type="button" data-act="row-rm" aria-label="Kustuta rida">'
          +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">'+P.x+'</svg></button>';
        l.appendChild(d); d.querySelector("input").focus();
      }
      break;}
    case "kiir": {
      const nim=$("#f_nim"), hind=$("#f_hind");
      const h=el.dataset.h;   /* „0,00“ on olemasolev hind, mitte puuduv */
      if(nim)nim.value=el.dataset.nim;
      if(hind&&h!==undefined){hind.value=h;const kg=$("#f_kogus");if(kg)kg.focus();}
      else if(hind){hind.value="";hind.focus();}  /* eelmise nupu hind ei tohi jääda */
      break;}
    case "toode": dlgToode(myygiRead().find(x=>x.id===id));break;
    case "aruanne": dlgAruanne();break;
    case "aru-print": aruPrint(); break;
    case "aru-per": aruVahemik(el.dataset.v); dlgAruanne(); break;
    case "myyja": avaMyyja(id);break;
    case "myyja-paev":
      myyjaPaev=(myyjaPaev===el.dataset.k)?null:el.dataset.k;
      dlgMyyja();break;
    case "myyja-kuu":
      myyjaKuu=new Date(myyjaKuu.getFullYear(),myyjaKuu.getMonth()+Number(el.dataset.v),1);
      myyjaPaev=null;dlgMyyja();break;
    case "myyk-paev": dlgPaev(el.dataset.k);break;
    case "myyk-kuu":{
      const v=Number(el.dataset.v), nd=new Date();
      myykKuu=v===0?new Date(nd.getFullYear(),nd.getMonth(),1)
                   :new Date(myykKuu.getFullYear(),myykKuu.getMonth()+v,1);
      render();break;
    }
    case "myyk-kustuta":{
      const t=myygiRead().find(x=>x.id===id);if(!t)break;
      const m=myygid(t).slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
      const kirje=m[Number(el.dataset.i)];
      const j=t.myygid.indexOf(kirje);
      if(j<0)break;
      t.myygid.splice(j,1);
      if(!t.myygid.length){
        const arr=S.myyk.read, k=arr.indexOf(t);
        arr.splice(k,1);
        save();closeDlg();render();
        toast('„'+t.nimetus+'“ oli viimane müügikord — toode eemaldatud.',
          ()=>{t.myygid=[kirje];arvutaKogus(t);arr.splice(k,0,t);save();render();toast("Tagasi toodud.");});
      }else{
        arvutaKogus(t);save();render();dlgToode(t);
        toast("Müügikord kustutatud. Kokku nüüd "+t.kogus+" tk.",
          ()=>{t.myygid.splice(j,0,kirje);arvutaKogus(t);save();render();dlgToode(t);toast("Tagasi toodud.");});
      }
      break;
    }
    case "edit-myyk": dlgMyyk(myygiRead().find(x=>x.id===id));break;
    case "del-myyk":{
      const arr=S.myyk.read,i=arr.findIndex(x=>x.id===id);
      if(i<0)break;
      const item=arr[i];arr.splice(i,1);save();render();
      toast('„'+item.nimetus+'“ on kustutatud.',()=>{arr.splice(i,0,item);save();render();toast("Tagasi toodud.");});
      break;
    }
    case "pick": pickFiles();break;
    case "dl":{
      const f=S.files.find(x=>x.id===id);if(!f||!f.data)break;
      if(window.claude&&window.claude.downloads){
        fetch(f.data).then(r=>r.blob()).then(b=>window.claude.downloads.save({filename:f.name,data:b}))
          .then(()=>toast("Fail salvestatud."))
          .catch(err=>{
            const c=err&&err.code;
            if(c==="declined")toast("Salvestamine jäi katki.");
            else if(c==="rejected_extension"||c==="extension_not_enabled")toast("Seda failitüüpi ei saa siit salvestada.");
            else toast("Faili ei saanud salvestada.");});
      }else toast("Failide salvestamine ei ole siin võimalik.");
      break;
    }
    case "close": closeDlg();break;
    case "row-add":{
      const b=document.getElementById("rows");
      if(b){b.insertAdjacentHTML("beforeend",rowHTML("",""));b.lastElementChild.querySelector("input").focus();}
      break;
    }
    case "row-rm": el.closest(".r").remove();break;
    case "pick-me": S.me=id;save();closeDlg();render();toast("Sina oled nüüd "+nameOf(id)+".");break;
    case "export": exportJSON();break;
    case "import": importJSON();break;
    case "reset":{
      const old=S;S=seed();S.me="m1";opened.clear();chat=null;closeDlg();save();render();
      toast("Näidissisu on tagasi.",()=>{S=old;save();render();toast("Sinu andmed on tagasi.");});
      break;
    }
  }
});

/* Lainetus vajutuse kohalt — Apple'i puutetagasiside.
   Liikumisvaikuse eelistuse korral jääb see täiesti ära. */
const vaikneLiikumine=window.matchMedia("(prefers-reduced-motion: reduce)");
document.addEventListener("pointerdown",e=>{
  if(vaikneLiikumine.matches)return;
  const b=e.target.closest('.btn, .answer button, .nav button, .qbtn, .confirm');
  if(!b)return;
  const r=b.getBoundingClientRect();
  if(!r.width)return;
  const el=document.createElement("span");
  el.className="laine";
  const d=Math.max(r.width,r.height)*1.9;
  el.style.width=el.style.height=d+"px";
  el.style.left=(e.clientX-r.left)+"px";
  el.style.top=(e.clientY-r.top)+"px";
  b.appendChild(el);
  setTimeout(()=>el.remove(),600);
},true);

/* Osa vahetus vahetab ka selle, mida seal müüakse. */
/* Kuupäevaväli kalendris: vali suvaline päev. */
document.addEventListener("change",e=>{
  if(e.target.id!=="kal-kuup")return;
  const v=e.target.value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;
  const d=new Date(v+"T12:00:00");
  kalPaev=(v===dkey(new Date()))?null:v;
  calMonth=new Date(d.getFullYear(),d.getMonth(),1);
  render();
});

document.addEventListener("change",e=>{
  if(e.target.id!=="f_osa")return;
  const k=document.getElementById("kiirvalik");
  if(k)k.innerHTML=kiirHtml(e.target.value);
});

/* Kui kirjutatud nimetus on varem olnud, pakub rakendus selle hinna —
   aga ainult siis, kui hinnalahter on veel tühi, et mitte üle kirjutada. */
document.addEventListener("input",e=>{
  if(e.target.id!=="f_nim")return;
  const osa=document.getElementById("f_osa"), hind=document.getElementById("f_hind");
  if(!osa||!hind||hind.value.trim())return;
  const nimi=e.target.value.trim().toLowerCase();
  if(!nimi)return;
  const leid=myygiRead()
    .filter(x=>x.osa===osa.value&&x.nimetus.trim().toLowerCase()===nimi)
    .sort((a,b)=>new Date(b.at)-new Date(a.at))[0];
  if(leid)hind.value=leid.hind.toFixed(2).replace(".",",");
});

$("#dlg-form").addEventListener("submit",e=>{e.preventDefault();if(!onOk||onOk()!==false)closeDlg();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#dlg").classList.contains("open"))closeDlg();});

/* ═══ käivitus ═══ */
(function(){
  try{const s=JSON.parse(localStorage.getItem(SET));if(s&&s.teema)seaded=Object.assign(seaded,s);}catch(e){}
  /* Vanad teemad on asendatud kahega — tundmatu valik langeb heledale tagasi. */
  if(!TEEMAD.some(t=>t.id===seaded.teema))seaded.teema="hele";
  if(seaded.suurus==="väga suur")seaded.suurus="suurem";
  if(!ZOOM[seaded.suurus])seaded.suurus="tavaline";
  saveSeaded();
  document.documentElement.lang="et";
  applySeaded();
  document.title=NIMI;
  kaivita();
})();

/* Seis tuleb serverist. Kes ma olen, otsustab sisselogimine — ekraanil
   seda valida ei saa, sest siis näeks igaüks teise kassat. */
async function kaivita(){
  try{
    const m=await (await fetch("/api/mina")).json();
    if(!m||!m.mina){location.href="/";return;}
    const r=await fetch("/api/seis");
    if(r.status===401){location.href="/";return;}
    S=await r.json();
    ((S.myyk&&S.myyk.read)||[]).forEach(x=>{
      if(!Array.isArray(x.myygid))x.myygid=[{at:x.at,kogus:x.kogus||0,kes:x.kes}];
    });
    S.seen=S.seen||{};
    render();
  }catch(e){
    document.getElementById("wrap").innerHTML=
      '<div class="tabel" style="padding:26px">Server ei vastanud. '
      +'Proovi lehte uuesti laadida.</div>';
  }
}

      +'</button></div>').join("")
    +'</div><button type="button" class="linkbtn" data-act="hrow-add">+ Lisa nimetus</button></div>'

/* ═══ Müügiaruanne ═══
   Raamatupidaja tahab kahte asja: ühte tabelit, kus iga müük on eraldi real,
   ja kokkuvõtteid, mille järgi kanded kontodele jagada. Fail on CSV, sest
   seda avab iga programm — semikoolon eraldajaks ja koma kümnendkohaks,
   sest Eesti Exceli seadistus ootab neid. BOM ees, muidu kaovad täpitähed. */
let aruA=null, aruB=null;

function aruVahemik(mis){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  const kuu=(a,b)=>{aruA=dkey(new Date(y,a,1));aruB=dkey(new Date(y,a+1,0));};
  if(mis==="kuu")kuu(m);
  else if(mis==="eelmine")kuu(m-1);
  else if(mis==="aasta"){aruA=dkey(new Date(y,0,1));aruB=dkey(new Date(y,11,31));}
  else{
    const k=myygiSyndmused().map(x=>dkey(new Date(x.at))).sort();
    aruA=k.length?k[0]:dkey(n); aruB=dkey(n);
  }
}

function aruRead(){
  return myygiSyndmused()
    .filter(x=>{const k=dkey(new Date(x.at));
      return (!aruA||k>=aruA)&&(!aruB||k<=aruB);})
    .sort((a,b)=>new Date(a.at)-new Date(b.at));
}

function aruKokku(read){
  const osa={}, myyja={};
  read.forEach(x=>{
    const o=osa[x.osa]||(osa[x.osa]={tk:0,eur:0}); o.tk+=x.kogus; o.eur+=x.eur;
    const m=myyja[x.kes]||(myyja[x.kes]={n:0,tk:0,eur:0});
    m.n++; m.tk+=x.kogus; m.eur+=x.eur;
  });
  return {
    tk:read.reduce((a,b)=>a+b.kogus,0),
    eur:read.reduce((a,b)=>a+b.eur,0),
    osa:Object.keys(osa).map(k=>({k,...osa[k]})).sort((a,b)=>b.eur-a.eur),
    myyja:Object.keys(myyja).map(k=>({k,...myyja[k]})).sort((a,b)=>b.eur-a.eur)
  };
}

const lyhiPaev=iso=>{const d=new Date(iso);
  return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear();};
const lyhiKey=k=>{const o=k.split("-");return o[2]+"."+o[1]+"."+o[0];};

function dlgAruanne(){
  if(!aruA||!aruB)aruVahemik("kuu");
  const read=aruRead(), K=aruKokku(read);
  const rida=(nimi,parem)=>'<div class="mline2"><span class="nm2">'+nimi+'</span>'
    +'<span class="tk">'+parem+'</span></div>';

  let h='<div class="field"><label>Ajavahemik</label>'
    +'<div class="pernupud">'
    +  '<button type="button" class="btn ghost small" data-act="aru-per" data-v="kuu">See kuu</button>'
    +  '<button type="button" class="btn ghost small" data-act="aru-per" data-v="eelmine">Eelmine kuu</button>'
    +  '<button type="button" class="btn ghost small" data-act="aru-per" data-v="aasta">See aasta</button>'
    +  '<button type="button" class="btn ghost small" data-act="aru-per" data-v="koik">Kogu aeg</button>'
    +'</div>'
    +'<div class="two">'
    +  '<div class="field"><label for="f_a">Alates</label><input type="date" id="f_a" value="'+aruA+'"></div>'
    +  '<div class="field"><label for="f_b">Kuni</label><input type="date" id="f_b" value="'+aruB+'"></div>'
    +'</div>'
    +'<span class="hint">Vajuta väljal, et avada kalender.</span></div>'

    +'<div class="statriba">'
    +  '<span><b>'+read.length+'</b> müügikorda</span>'
    +  '<span><b>'+K.tk+'</b> tükki</span>'
    +  '<span><b>'+esc(raha(K.eur))+'</b></span>'
    +'</div>';

  if(!read.length){
    h+='<p class="meta">Sellesse ajavahemikku ei jää ühtegi müüki. Vali teine vahemik.</p>';
  }else{
    h+='<div class="field"><label>Osade kaupa</label><div class="mlist">'
      + K.osa.map(o=>rida(esc(osaNimi(o.k)),o.tk+" tk · "+esc(raha(o.eur)))).join("")
      + rida("<b>Kokku</b>","<b>"+K.tk+" tk · "+esc(raha(K.eur))+"</b>")
      +'</div></div>'
      +'<div class="field"><label>Müüjate kaupa</label><div class="mlist">'
      + K.myyja.map(m=>'<div class="mline2">'
          +'<span class="nm2">'+esc(nameOf(m.k))
          +  '<span class="osa2">'+mitu(m.n,"müügikord","müügikorda")+'</span></span>'
          +'<span class="tk">'+m.tk+' tk · '+esc(raha(m.eur))+'</span></div>').join("")
      +'</div></div>'
      +'<div class="tools"><button type="button" class="btn ghost" data-act="aru-print">'
      +'Trüki või salvesta PDF-ina</button></div>'
      +'<span class="hint">Salvestatud failis on lisaks iga müük eraldi real: '
      +'kuupäev, kellaaeg, osa, nimetus, kogus, ühiku hind, summa ja müüja. '
      +'Trükiaknas saab „Sihtkohaks“ valida „Salvesta PDF-ina“.</span>';
  }

  dlg("Müügiaruanne", h, "Salvesta arvutisse", ()=>{
    if(!aruRead().length){toast("Sellesse ajavahemikku ei jää ühtegi müüki.");return false;}
    aruSalvesta(); return true;
  });

  requestAnimationFrame(()=>{
    ["f_a","f_b"].forEach(id=>{
      const e=$("#"+id);
      if(e)e.addEventListener("change",()=>{
        const a=$("#f_a"), b=$("#f_b");
        if(a&&b&&a.value&&b.value){
          /* Tagurpidi vahemik on alati näpuviga — keerame ise õigetpidi. */
          aruA=a.value<=b.value?a.value:b.value;
          aruB=a.value<=b.value?b.value:a.value;
          dlgAruanne();
        }
      });
    });
  });
}

/* Trükipilt on omaette leht: ekraanikujundus ei kannata paberile üle. */
function aruPrint(){
  const read=aruRead(), K=aruKokku(read), g=S.group||{};

      read.map(x=>'<tr><td>'+lyhiPaev(x.at)+'</td><td>'+fmtTime(x.at)+'</td>'
        +'<td>'+esc(osaNimi(x.osa))+'</td><td>'+esc(x.nimetus)+'</td>'
        +'<td class="n">'+x.kogus+'</td><td class="n">'+esc(raha(x.hind))+'</td>'
        +'<td class="n">'+esc(raha(x.eur))+'</td><td>'+esc(nameOf(x.kes))+'</td></tr>').join("")
      +'<tr class="kokku"><td colspan="4">Kokku</td><td class="n">'+K.tk+'</td><td></td>'
      +'<td class="n">'+esc(raha(K.eur))+'</td><td></td></tr>')
    +'<h2>Osade kaupa</h2>'
    +tbl(["Osa","Kogus","Summa"],[1,2],
      K.osa.map(o=>'<tr><td>'+esc(osaNimi(o.k))+'</td><td class="n">'+o.tk+'</td>'

    +'<h2>Müüjate kaupa</h2>'
    +tbl(["Müüja","Müügikordi","Kogus","Summa"],[1,2,3],
      K.myyja.map(m=>'<tr><td>'+esc(nameOf(m.k))+'</td><td class="n">'+m.n+'</td>'
        +'<td class="n">'+m.tk+'</td><td class="n">'+esc(raha(m.eur))+'</td></tr>').join(""));
  window.print();
}

const csvVali=v=>{const t=String(v);
  return /[";\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
const csvRida=a=>a.map(csvVali).join(";");
const csvArv=v=>v.toFixed(2).replace(".",",");

function aruCSV(){
  const read=aruRead(), K=aruKokku(read), L=[];
  const g=S.group||{};
  L.push([(g.ametlik||NIMI)+" — müügiaruanne"]);
  if(g.regkood)L.push(["Registrikood",g.regkood]);
  if(g.aadress)L.push(["Aadress",g.aadress]);
  if(g.telefon)L.push(["Telefon",g.telefon]);
  L.push(["Ajavahemik",lyhiKey(aruA)+" – "+lyhiKey(aruB)]);
  L.push(["Koostatud",lyhiPaev(new Date().toISOString())+" "+fmtTime(new Date().toISOString())]);
  L.push(["Koostas",nameOf(meId())]);
  /* Ilma selle reata küsib raamatupidaja alati järele, kas hinnad on käibemaksuga. */
  L.push(["Käibemaks","ei kohaldu — ei ole käibemaksukohustuslane"]);
  L.push(["Hinnad","lõpphinnad, käibemaksuta"]);
  L.push([]);
  L.push(["Kuupäev","Kellaaeg","Osa","Nimetus","Kogus","Ühiku hind","Summa","Müüja"]);
  read.forEach(x=>L.push([lyhiPaev(x.at),fmtTime(x.at),osaNimi(x.osa),x.nimetus,
                          x.kogus,csvArv(x.hind),csvArv(x.eur),nameOf(x.kes)]));
  L.push([]);
  L.push(["KOKKU","","","",K.tk,"",csvArv(K.eur),""]);
  L.push([]);
  L.push(["Osade kaupa"]);
  L.push(["Osa","Kogus","Summa"]);
  K.osa.forEach(o=>L.push([osaNimi(o.k),o.tk,csvArv(o.eur)]));
  L.push([]);
  L.push(["Müüjate kaupa"]);
  L.push(["Müüja","Müügikordi","Kogus","Summa"]);
  K.myyja.forEach(m=>L.push([nameOf(m.k),m.n,m.tk,csvArv(m.eur)]));
  /* CRLF ja BOM: ilma nendeta ajab Excel read ja täpitähed sassi. */
  return "\ufeff"+L.map(csvRida).join("\r\n")+"\r\n";
}

/* Aruande salvestamine failina.

   Vana kood kutsus siin funktsiooni showRaw, mida ei ole kunagi olemas
   olnud — tavalises brauseris viskas nupp vea, aken sulgus ja midagi ei
   salvestunud. Raamatupidaja väljavõte jäi lihtsalt saamata, ilma et
   keegi oleks aru saanud, miks.

   Nüüd teeb salvestamise brauser ise (Blob + allalaadimislink). Kui ka
   see ei õnnestu, ei jää inimene tühjade kätega: tekst tuleb ekraanile,
   kust saab ta kopeerida. */
async function aruSalvesta(){
  const data=aruCSV();
  const fn="Kodulinna_Maja_myygiaruanne_"+aruA+"_"+aruB+".csv";
  try{
    /* BOM on Eesti Exceli jaoks: ilma selleta lähevad täpitähed katki. */
    const blob=new Blob(["﻿"+data],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=fn;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("Aruanne salvestatud kausta „Allalaaditud failid“.");
  }catch(err){
    aruEkraanile(data,fn);
  }
}

/* Varutee: kui brauser faili salvestada ei lase, anname teksti ette. */

/* Ühe müüja statistika: kokkuvõte, mida ta müüs ja tema oma kalender.
   Kuupäeva peale klõpsates avaneb selle päeva statistika sealsamas. */
let myyjaId=null, myyjaKuu=null, myyjaPaev=null;

function avaMyyja(kes){
  const oma=myygiSyndmused().filter(x=>x.kes===kes);
  if(!oma.length){toast(nameOf(kes)+" ei ole veel midagi müünud.");return;}
  myyjaId=kes; myyjaPaev=null;
  const v=new Date(oma[0].at);
  myyjaKuu=new Date(v.getFullYear(),v.getMonth(),1);
  dlgMyyja();
}

function dlgMyyja(){
  const kes=myyjaId;
  const x=myyjaStat().find(y=>y.kes===kes);
  if(!x){closeDlg();return;}
  const oma=myygiSyndmused().filter(y=>y.kes===kes);

  /* Ainult selle müüja päevad. */
  const paevad={};
  oma.forEach(y=>{
    const k=dkey(new Date(y.at));
    const p=paevad[k]||(paevad[k]={tk:0,eur:0});
    p.tk+=y.kogus; p.eur+=y.eur;
  });

  const ky=myyjaKuu.getFullYear(), km=myyjaKuu.getMonth();
  const alg=new Date(ky,km,1-dowIdx(new Date(ky,km,1)));
  const tana=dkey(new Date());
  /* Ainult need nädalad, kuhu kuu tegelikult ulatub — muidu jääb aken tühjaks. */
  const nadalaid=Math.ceil((dowIdx(new Date(ky,km,1))+new Date(ky,km+1,0).getDate())/7);
  let kuuTk=0,kuuEur=0,ruudud="";
  for(let i=0;i<nadalaid*7;i++){
    const d=new Date(alg); d.setDate(alg.getDate()+i);
    const k=dkey(d), out=d.getMonth()!==km, p=paevad[k];
    if(!out&&p){kuuTk+=p.tk;kuuEur+=p.eur;}
    ruudud+=(p?'<button type="button" class="mcell'+(out?" out":"")+(k===tana?" today":"")
              +(k===myyjaPaev?" valitud":"")+'" data-act="myyja-paev" data-k="'+k+'">'
              :'<div class="mcell'+(out?" out":"")+(k===tana?" today":"")+'">')
      +'<span class="d">'+d.getDate()+'</span>'
      +(p?'<span class="sum">'+esc(raha(p.eur))+'</span><span class="tkk">'+p.tk+' tk</span>':"")
      +(p?'</button>':'</div>');
  }

  let h='<div class="statriba">'
    + '<span><b>'+x.tk+'</b> tükki</span>'
    + '<span><b>'+esc(raha(x.eur))+'</b></span>'
    + '<span><b>'+x.kordi+'</b> müügikorda</span>'
    +'</div>'
    +'<div class="field"><div class="kalpais">'
    +  '<label style="margin:0">Millal ta müüs</label>'
    +  '<span class="kuunimi">'+MON[km].charAt(0).toUpperCase()+MON[km].slice(1)+' '+ky+'</span>'
    +  '<button type="button" class="btn ghost small" data-act="myyja-kuu" data-v="-1">‹</button>'
    +  '<button type="button" class="btn ghost small" data-act="myyja-kuu" data-v="1">›</button>'
    +  '<span class="kuusumma">'+kuuTk+' tk · '+esc(raha(kuuEur))+'</span>'
    +'</div>'
    +'<span class="hint" style="margin:0 0 8px">Vajuta kuupäeval, et näha selle päeva müüki.</span>'
    +'<div class="mcal"><div class="mdow">'+DOW_S.map(y=>'<span>'+y+'</span>').join("")
    +'</div><div class="mgrid">'+ruudud+'</div></div></div>';

  if(myyjaPaev){
    const pr=oma.filter(y=>dkey(new Date(y.at))===myyjaPaev)
                .sort((a,b)=>new Date(a.at)-new Date(b.at));
    if(pr.length){
      h+='<div class="field paevaosa"><label>'+esc(fmtPaev(pr[0].at))+' — '
        + pr.reduce((a,b)=>a+b.kogus,0)+' tk · '+esc(raha(pr.reduce((a,b)=>a+b.eur,0)))
        +'</label><div class="mlist">'
        + pr.map(y=>'<div class="mline2">'
            +'<span class="nm2">'+esc(y.nimetus)+'<span class="osa2">'+esc(osaNimi(y.osa))
            +  ' · kell '+fmtTime(y.at)+'</span></span>'
            +'<span class="tk">'+y.kogus+' tk · '+esc(raha(y.eur))+'</span></div>').join("")
        +'</div></div>';
    }
  }

  dlg("Statistika — "+nameOf(kes), h, "Sulge", ()=>true, true);
  /* Uus paneel tekib akna lõppu; ilma kerimiseta jääks mulje, et klõps ei teinud midagi. */
  if(myyjaPaev)requestAnimationFrame(()=>{
    const e=$("#dlg-bd .paevaosa");
    if(e)e.scrollIntoView({block:"nearest"});   /* kohe, ilma liikumiseta */
  });
}

let uudisNimekiri=[];

/* Tulemas: kõik tulevased üritused ja lähipäevade tegemata tööd. See ei
   ole „mis on muutunud“, vaid „mis ees ootab“ — üritus ei pea olema uus
   ega kinnitust küsima, et teda oleks vaja teada.

   Üritused võetakse kõik, tööd ainult kolm päeva ette. Korduv töö annab
   iga päev uue rea ja kataks muidu üritused enda alla — aga just
   üritused on need, mida on vaja ette teada. */
function tulemasNimekiri(){
  const nyyd=new Date();
  const yritused=[], tood=[];

  for(const e of S.events){
    const algus=new Date(e.start);
    if(algus<nyyd)continue;
    yritused.push({ aeg:algus,
      tekst:fmtLong(e.start)+" kell "+fmtTime(e.start)+" — "+e.title
        +" ("+kohaNimi(kohtOf(e))+")",
      mine:()=>{opened.add(e.id);mineVaade("kalender");} });
  }

  const nahtud=new Set();
  for(let o=0;o<3;o++){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+o);
    const k=dkey(d);
    for(const t of tooPaeval(d)){
      if(tehtud(t,k))continue;
      /* Sama nimega töö samal päeval ühes majas on üks asi, ka siis kui
         teda on kogemata kaks korda sisestatud. */
      const võti=k+"|"+kohtOf(t)+"|"+String(t.nimi).trim().toLowerCase();
      if(nahtud.has(võti))continue;
      nahtud.add(võti);
      const aeg=tooAeg(t);
      tood.push({ aeg:new Date(k+"T"+(aeg?aeg.slice(0,5):"23:59")+":00"),
        tekst:(o===0?"Täna":o===1?"Homme":fmtLong(k+"T12:00:00"))
          +" — "+t.nimi+(aeg?" kell "+aeg:"")+" ("+kohaNimi(kohtOf(t))+")",
        mine:()=>{kalPaev=k;mineVaade("kalender");} });
    }
  }

  return yritused.sort((a,b)=>a.aeg-b.aeg).slice(0,12)
    .concat(tood.sort((a,b)=>a.aeg-b.aeg).slice(0,8));
}

/* Brauseri enda kuupäevaväli avab kalendri ainult väikeselt ikoonilt. Vanem

/* Valitud päev pluss kellaaeg: täna on praegune hetk, vanem päev lõuna. */
function paevaAeg(k){
  const n=new Date();
  if(!k||k===dkey(n))return n.toISOString();
  const o=k.split("-").map(Number);
  if(o.length!==3||!o[0])return n.toISOString();
  return new Date(o[0],o[1]-1,o[2],12,0,0).toISOString();
}

/* Varukoopiat ei ole enam vaja meelde tuletada: andmed on ühises
   andmebaasis, mitte selle brauseri mälus. Riba asemel on väljalogimine. */

/* Pilt läheb samasse salvestusse kui kõik muu, seega ta peab olema väike.
   128×128 ruut ja JPEG — üks pilt jääb umbes 5 kB peale. */
function pisiPilt(file,cb){
  if(!/^image\//.test(file.type||"")){toast("See ei ole pildifail.");return;}
  const r=new FileReader();
  r.onerror=()=>toast("Faili ei õnnestunud lugeda.");
  r.onload=()=>{
    const im=new Image();
    im.onerror=()=>toast("Seda pilti ei õnnestunud avada.");
    im.onload=()=>{
      const N=128, c=document.createElement("canvas");
      c.width=c.height=N;
      const x=c.getContext("2d");
      const k=Math.min(im.width,im.height);          /* keskelt ruuduks */
      x.drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,N,N);
      try{cb(c.toDataURL("image/jpeg",0.75));}
      catch(_){toast("Pildi salvestamine ei õnnestunud.");}
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

function valiPilt(){
  const i=document.createElement("input");
  i.type="file"; i.accept="image/*";
  i.addEventListener("change",()=>{
    const f=i.files&&i.files[0]; if(!f)return;
    pisiPilt(f,d=>{
      const h=$("#f_pilt"), e=$("#piltala");
      if(h)h.value=d;
      if(e)e.innerHTML=piltAlaHtml(d,$("#f_name")?$("#f_name").value:"");
    });

  i.click();
}

function toast(msg,undo){
  const el=document.createElement("div");
  el.className="toast";
  el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button class="undo">Võta tagasi</button>':"");
  $("#toasts").appendChild(el);
  let dead=false;const kill=()=>{if(dead)return;dead=true;el.remove();};
  if(undo){el.querySelector(".undo").addEventListener("click",()=>{undo();kill();});setTimeout(kill,14000);}
  else setTimeout(kill,4200);
}
/* Kustutamine küsib enne üle ja ütleb välja, mis kaob ja kelle jaoks.

   Varem käis kõik kohe ära ja ainus tagasitee oli teade, mis kadus 14
   sekundiga. Vanem inimene ei jõua seda tabada — ja liikme puhul ei
   toonud „Võta tagasi“ niikuinii midagi tagasi: tema graafik, puhkused,
   kinnitused ja kirjavahetused olid andmebaasist läinud. */
const KUSTUTUSE_TEKST={
  events:  x=>['Kustutan ürituse „'+x.title+'“.',
    'Koos temaga kaovad selle ürituse ülesanded, küsimused ja vastused. '
    +'See kaob kõigi liikmete jaoks.'],
  info:    x=>['Kustutan infoploki „'+x.title+'“.',
    'Koos temaga kaovad selle all olevad küsimused ja märge, kes on tutvunud. '
    +'See kaob kõigi liikmete jaoks.'],
  files:   x=>['Kustutan faili „'+x.name+'“.',
    'Fail kaob kõigi liikmete jaoks ja teda ei saa enam alla laadida.'],
  members: x=>['Võtan '+x.name+' majast välja.', liikmeHoiatus(x)]
};

function liikmeHoiatus(m){
  const my=myygiSyndmused().filter(x=>x.kes===m.id);
  const eur=my.reduce((a,b)=>a+b.eur,0);
  return (my.length
      ? 'Tema '+mitu(my.length,"müük","müüki")+' ('+raha(eur)+') jäävad kassasse '
        +'alles, aga müüja nimi kaob nende pealt ära. '
      : '')
    +'Tema tööaeg, puhkused, kinnitused ja kirjavahetused kaovad päriselt. '
    +'Seda ei saa tagasi võtta.';
}

function del(kind,id){
  const arr=S[kind],i=arr.findIndex(x=>x.id===id);if(i<0)return;
  const item=arr[i];
  const tekst=KUSTUTUSE_TEKST[kind];
  if(tekst){
    const [mis,mida]=tekst(item);
    if(!confirm(mis+"\n\n"+mida))return;
  }
  arr.splice(i,1);save();render();
  toast('„'+(item.title||item.name||"Kirje")+'“ on kustutatud.',
    ()=>{arr.splice(i,0,item);save();render();toast("Tagasi toodud.");});
}

      toast("Kõik on nüüd loetud.");break;
    case "tulemas-mine":{
      const t=tulemasLoend[Number(el.dataset.i)];
      if(t&&t.mine){t.mine();closeDlg();save();render();}
      break;
    }
    case "uut-mine":{
      const x=uudisNimekiri[Number(el.dataset.i)];
      if(x){x.mine();closeDlg();save();render();}
      break;
    }
    case "add":
      if(view==="vestlus")dlgThread();
      else if(view==="kalender")dlgEvent(null);
      else if(view==="info")dlgInfo(null);
      else if(view==="kontakt")dlgPerson(null);
      else if(view==="myyk")dlgMyyk(null);
      else if(view==="tootajad")dlgGraafikPaev(null,graKoht,null,valitudPaevOn());
      else pickFiles();
      break;
    case "kopeeri": {
      /* Arvutis ei ole kuhugi helistada — number läheb lõikelauale, et
         saaks telefoni sisse toksida. Kui lõikelaud ei ole lubatud,
         valime teksti ära, siis saab Ctrl+C-ga võtta. */
      const t=el.dataset.v;
      const vali=()=>{
        const r=document.createRange(); r.selectNodeContents(el);
        const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        toast("Vajuta Ctrl+C, et number kopeerida.");
      };
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(t).then(()=>toast("Kopeeritud: "+t),vali);
      else vali();
      break;}
    case "seaded": dlgSeaded();break;

      fetch("/api/valja",{method:"POST"}).then(()=>location.href="/");
      break;
    case "size": seaded.suurus=el.dataset.v;saveSeaded();applySeaded();dlgSeaded();break;
    case "teema": seaded.teema=el.dataset.v;saveSeaded();applySeaded();dlgSeaded();break;

    /* Kolm eri asja, mis vajavad kolme eri lauset. Teema kaob kõigi
       jaoks; grupp kaob nendel, keda välja võetakse; kirjast kaovad
       ainult sinu enda sõnumid, sest teise inimese omad ei ole sinu
       kustutada. Nii ütlemegi. */

      const t=el.dataset.type;
      if(t==="teema"){
        const x=S.threads.find(y=>y.id===id);if(!x)break;
        if(!confirm("Kustutan teema „"+x.title+"“ ja kõik selle sõnumid.\n\n"
          +"See kaob kõigi liikmete jaoks ära. Seda ei saa tagasi võtta."))break;

        chat=null;save();render();toast("Teema kustutatud.");

          +"See kaob kõigi "+(g.who||[]).length+" inimese jaoks ära, mitte ainult sinu oma. "
          +"Kui tahad ainult ise välja astuda, vajuta „Muuda gruppi“ ja sealt "

    }
    case "edit-myyk": dlgMyyk(myygiRead().find(x=>x.id===id));break;
    case "del-myyk":{
      const arr=S.myyk.read,i=arr.findIndex(x=>x.id===id);
      if(i<0)break;
      const item=arr[i];
      /* Müük on raha. Enne kustutamist ütleme, kui palju kassast kaob. */
      if(!confirm('Kustutan müügi „'+item.nimetus+'“.\n\n'
        +item.kogus+' tk · '+raha(item.kogus*item.hind)
        +' kaob kassast ja aruandest ära. Seda ei saa hiljem üles leida.'))break;
      arr.splice(i,1);save();render();
      toast('„'+item.nimetus+'“ on kustutatud.',()=>{arr.splice(i,0,item);save();render();toast("Tagasi toodud.");});
      break;
    }
    case "pick": pickFiles();break;
    case "dl":{
      const f=S.files.find(x=>x.id===id);if(!f||!f.data)break;
      if(window.claude&&window.claude.downloads){
        fetch(f.data).then(r=>r.blob()).then(b=>window.claude.downloads.save({filename:f.name,data:b}))
          .then(()=>toast("Fail salvestatud."))
          .catch(err=>{
            const c=err&&err.code;
            if(c==="declined")toast("Salvestamine jäi katki.");
            else if(c==="rejected_extension"||c==="extension_not_enabled")toast("Seda failitüüpi ei saa siit salvestada.");
            else toast("Faili ei saanud salvestada.");});
      }else toast("Failide salvestamine ei ole siin võimalik.");
      break;
    }
    case "close": closeDlg();break;
    case "row-add":{
      const b=document.getElementById("rows");
      if(b){b.insertAdjacentHTML("beforeend",rowHTML("",""));b.lastElementChild.querySelector("input").focus();}
      break;
    }
    case "row-rm": el.closest(".r").remove();break;
  }
});

/* Lainetus vajutuse kohalt — Apple'i puutetagasiside.
   Liikumisvaikuse eelistuse korral jääb see täiesti ära. */
const vaikneLiikumine=window.matchMedia("(prefers-reduced-motion: reduce)");
document.addEventListener("pointerdown",e=>{
  if(vaikneLiikumine.matches)return;
  const b=e.target.closest('.btn, .answer button, .nav button, .qbtn, .confirm');
  if(!b)return;
  const r=b.getBoundingClientRect();
  if(!r.width)return;
  const el=document.createElement("span");
  el.className="laine";
  const d=Math.max(r.width,r.height)*1.9;
  el.style.width=el.style.height=d+"px";
  el.style.left=(e.clientX-r.left)+"px";
  el.style.top=(e.clientY-r.top)+"px";
  b.appendChild(el);
  setTimeout(()=>el.remove(),600);
},true);

/* Osa vahetus vahetab ka selle, mida seal müüakse. */
document.addEventListener("change",e=>{
  if(e.target.id!=="f_osa")return;
  const k=document.getElementById("kiirvalik");
  if(k)k.innerHTML=kiirHtml(e.target.value);
});

/* Kui kirjutatud nimetus on varem olnud, pakub rakendus selle hinna —
   aga ainult siis, kui hinnalahter on veel tühi, et mitte üle kirjutada. */
document.addEventListener("input",e=>{
  if(e.target.id!=="f_nim")return;
  const osa=document.getElementById("f_osa"), hind=document.getElementById("f_hind");
  if(!osa||!hind||hind.value.trim())return;
  const nimi=e.target.value.trim().toLowerCase();
  if(!nimi)return;
  const leid=myygiRead()
    .filter(x=>x.osa===osa.value&&x.nimetus.trim().toLowerCase()===nimi)
    .sort((a,b)=>new Date(b.at)-new Date(a.at))[0];
  if(leid)hind.value=leid.hind.toFixed(2).replace(".",",");
});

$("#dlg-form").addEventListener("submit",e=>{e.preventDefault();if(!onOk||onOk()!==false)closeDlg();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#dlg").classList.contains("open"))closeDlg();});

/* ═══ käivitus ═══ */
(function(){
  try{const s=JSON.parse(localStorage.getItem(SET));if(s&&s.teema)seaded=Object.assign(seaded,s);}catch(e){}
  /* Vanad teemad on asendatud kahega — tundmatu valik langeb heledale tagasi. */
  if(!TEEMAD.some(t=>t.id===seaded.teema))seaded.teema="hele";
  if(seaded.suurus==="väga suur")seaded.suurus="suurem";
  if(!ZOOM[seaded.suurus])seaded.suurus="tavaline";
  saveSeaded();
  document.documentElement.lang="et";
  applySeaded();
  document.title=NIMI;
  kaivita();
})();

/* Seis tuleb serverist. Kes ma olen, otsustab sisselogimine — ekraanil
   seda valida ei saa, sest siis näeks igaüks teise kassat. */
/* Lahtine uks peab paistma. Kui leht on avalikus proovirežiimis, käib
   üle ekraani riba — nii ei juhtu, et sinna hakatakse vaikselt päris
   nimesid ja kassat kirjutama. */
function proovirezimiRiba(){
  if(document.getElementById("proovriba"))return;
  const d=document.createElement("div");
  d.id="proovriba";
  d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:9999;"
    +"background:#b42318;color:#fff;font:600 13px/1.5 inherit;"
    +"padding:7px 16px;text-align:center;letter-spacing:.2px";
  d.textContent="PROOVIREŽIIM — see leht on lahti kõigile, kes aadressi teavad. "
    +"Ära pane siia päris nimesid, telefone ega kassat.";
  document.body.appendChild(d);
  document.body.style.paddingTop="32px";
}

async function kaivita(){
  try{
    const m=await (await fetch("/api/mina")).json();
    if(!m||!m.mina){location.href="/";return;}
    if(Array.isArray(m.ametid))AMETID=m.ametid;
    if(m.avalikProovirezim)proovirezimiRiba();
    const r=await fetch("/api/seis");
    if(r.status===401){location.href="/";return;}
    S=await r.json();
    ((S.myyk&&S.myyk.read)||[]).forEach(x=>{
      if(!Array.isArray(x.myygid))x.myygid=[{at:x.at,kogus:x.kogus||0,kes:x.kes}];
    });
    S.seen=S.seen||{};
    render();
  }catch(e){
    document.getElementById("wrap").innerHTML=
      '<div class="tabel" style="padding:26px">Server ei vastanud. '
      +'Proovi lehte uuesti laadida.</div>';
  }
}

# Majutuse seadistus Renderile (render.com).
# Tasuta pakett sobib: leht magab, kui teda tund aega ei kasutata, ja
# ärkab esimese avamisega ~30 sekundiga. Majale sobib.
#
# Kolm asja, mis tuleb Renderis endal sisestada (need on saladused ja
# neid ei tohi siia faili panna):
#   DATABASE_URL       .env failist
#   SESSIOONI_SALADUS  .env failist
#   ESIMENE_SISSELOGIJA  ainult siis, kui pead esimest kontot tegema
#
# Proovimise ajaks, kuni lehel ei ole päris andmeid, saab sisselogimise
# hoopis ära võtta. Selleks on Renderis vaja KAHTE rida:
#   KOHE_SISSE           kelle nime all lehte avatakse, nt sinu e-post
#   AVALIK_PROOVIREZIIM  jah
# Siis on leht lahti kõigile, kes aadressi teavad, ja ekraanil käib
# punane hoiatusriba. Enne kui majja tulevad päris nimed, telefonid ja
# kassa, kustuta mõlemad read Renderist ära.

services:
  - type: web
    name: kodulinna-maja
    runtime: node
    plan: free
    region: frankfurt          # Euroopa — lähemal kui Ameerika
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /tervis
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # sisesta Renderis käsitsi
      - key: SESSIOONI_SALADUS
        sync: false            # sisesta Renderis käsitsi

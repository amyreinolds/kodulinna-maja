<div class="kuma" aria-hidden="true"><i></i><i></i><i></i></div>

  <aside class="side">

<!-- Trükiaruanne. Ekraanil peidus, paberil ainus nähtav asi. -->
<div id="prindi" aria-hidden="true"></div>

<script>
"use strict";

const SET="ring.seaded";
const NIMI="Kodulinna Maja";
/* Aruanne läheb majast välja, seepärast käib sinna ka ametlik nimi ja
   registrikood. Need tulevad andmebaasist ja neid muudetakse Seadetes. */


/* Kaks maja. Kõik, mis kalendrisse läheb, kuulub ühele neist. */
const KOHAD=[{id:"km",nimi:"Kodulinna Maja"},{id:"torn",nimi:"Torn"}];
/* Üritus ei pea olema kummaski majas. „Mujal“ tähendab, et koht on
   vabalt kirjutatud — „Aegviidu rongijaam“. Töögraafikus seda valikut
   ei ole: tööl käiakse majas. */
const MUJAL={id:"mujal",nimi:"Mujal"};
const YRITUSE_KOHAD=KOHAD.concat([MUJAL]);
/* Kalendris on ka „Kõik“, et ükski üritus ei jääks kogemata peitu. */
const KAL_KOHAD=[{id:"koik",nimi:"Kõik"}].concat(YRITUSE_KOHAD);
const sobibKoht=(x,valik)=>valik==="koik"||kohtOf(x)===valik;
const kohaNimi=k=>(YRITUSE_KOHAD.find(x=>x.id===k)||KOHAD[0]).nimi;
const kohtOf=x=>(x&&x.koht==="torn")?"torn":(x&&x.koht==="mujal")?"mujal":"km";

const MON=["jaanuar","veebruar","märts","aprill","mai","juuni","juuli","august","september","oktoober","november","detsember"];
const DOW_S=["E","T","K","N","R","L","P"];
const DOW_L=["esmaspäev","teisipäev","kolmapäev","neljapäev","reede","laupäev","pühapäev"];
const SUURUSED=[
  {id:"tavaline", nimi:"tavaline",  z:1,    a:17},
  {id:"suur",     nimi:"suur",      z:1.15, a:21},
  {id:"suurem",   nimi:"väga suur", z:1.32, a:26}
];
const ZOOM=Object.fromEntries(SUURUSED.map(x=>[x.id,x.z]));
const TEEMAD=[
  {id:"hele", nimi:"Hele", selgitus:"sinine taust, valged kaardid"},
  {id:"tume", nimi:"Tume", selgitus:"soe must, oranž aktsent"}
];

const P={
  chat:'<path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-4-.9L3 21l1.9-4.6A8.4 8.4 0 013 11.5a8.4 8.4 0 019-8.4 8.4 8.4 0 019 8.4z"/>',
  event:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M16 3v4M8 3v4M3 11h18M8 15h3"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M16 3v4M8 3v4M3 11h18"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11.5v5M12 8h.01"/>',
  people:'<path d="M16 20v-1.5A3.5 3.5 0 0012.5 15h-5A3.5 3.5 0 004 18.5V20"/><circle cx="10" cy="8" r="3.4"/><path d="M20 20v-1.5a3.5 3.5 0 00-2.6-3.4"/><path d="M15.4 4.6a3.4 3.4 0 010 6.6"/>',
  file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  done:'<circle cx="12" cy="12" r="9"/><path d="M8.4 12.2l2.5 2.5 4.7-4.9"/>',
  open:'<circle cx="12" cy="12" r="9"/>',
  ask:'<path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-4-.9L3 21l1.9-4.6A8.4 8.4 0 013 11.5a8.4 8.4 0 019-8.4 8.4 8.4 0 019 8.4z"/><path d="M9.8 9.6a2.3 2.3 0 014.4.8c0 1.5-2.2 2-2.2 2M12 15.4h.01"/>',
  sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2M12 19.6v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.4 12h2M19.6 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 016.5 3H12v16.5H6.5A2.5 2.5 0 004 22z"/><path d="M20 5.5A2.5 2.5 0 0017.5 3H12v16.5h5.5A2.5 2.5 0 0120 22z"/>',
  back:'<path d="M15 19l-7-7 7-7"/>',
  tag:'<path d="M20.6 13.4L13.4 20.6a2 2 0 01-2.8 0l-7.2-7.2A2 2 0 013 12V4.8A1.8 1.8 0 014.8 3H12a2 2 0 011.4.6l7.2 7.2a2 2 0 010 2.6z"/><path d="M7.5 7.5h.01"/>',
  bell:'<path d="M18 9a6 6 0 10-12 0c0 5-2.2 6.6-2.2 6.6h16.4S18 14 18 9z"/><path d="M13.7 19.5a2 2 0 01-3.4 0"/>',
  kell:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.4 2"/>',
  kaamera:'<path d="M3 8.5A2 2 0 015 6.5h2.2l1.2-2h7.2l1.2 2H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3.6"/>'
};
function ico(n){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>';}

const VIEWS=[
  {id:"vestlus",  label:"Vestlus",   icon:"chat",   add:"Uus teema",
   help:"Kolm asja: teemat näevad kõik liikmed, gruppi ainult need, kelle sa ise valid, ja kirja näete kahekesi."},
  {id:"kalender", label:"Üritused",  icon:"event",  add:"Uus üritus",
   help:"Kõik üritused ja tööd kuu kaupa. Vajuta kuupäeval, et näha selle päeva oma. Üritused on kalendri all: vajuta „Osalen“ või „Ei osale“ ja küsi julgelt."},
  {id:"info",     label:"Üldinfo",   icon:"info",   add:"Uus infoplokk",
   help:"Tähtis info kõigile liikmetele. Kui plokk küsib kinnitust, loe läbi ja vajuta „Olen tutvunud“."},
  {id:"failid",   label:"Failid",    icon:"file",   add:"Lisa fail",
   help:"Dokumendid, mida teistel vaja läheb. Iga liige saab faile lisada ja kustutada."},
  {id:"myyk",     label:"Müük",      icon:"tag",    add:"Lisa müük",
   help:"Vajuta toote nimel, et näha selle enda statistikat. Müüja nimel vajutades avaneb tema kalender — vajuta kuupäeval ja näed, mida ta sel päeval müüs.",
   help2:"Siin on sinu enda müük. Kogu maja kokkuvõtet näevad administraatorid."},
  {id:"tootajad", label:"Töö graafik", icon:"kell", add:"Lisa graafikusse",
   help:"Kes millal majas on, kes on puhkusel ja mis tööd on sel päeval teha. "
       +"Vajuta lahtril või üleval „Lisa graafikusse“ — sealt käib nii tööaeg "
       +"kui puhkus. Üritused on Ürituste all, need on eri asi."},
  {id:"kontakt",  label:"Kontaktid", icon:"people", add:"Uus liige",
   help:"Vajuta numbril, et see kopeerida. Vajuta nimel, et näha tema müüki."}
];

/* ═══ abifunktsioonid ═══ */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dowIdx=d=>(d.getDay()+6)%7;
const first=n=>String(n||"").split(" ")[0];

function fmtLong(iso){const d=new Date(iso);return DOW_L[dowIdx(d)]+", "+d.getDate()+". "+MON[d.getMonth()];}
function fmtTime(iso){const d=new Date(iso);return pad(d.getHours())+":"+pad(d.getMinutes());}
function fmtStamp(iso){
  const d=new Date(iso),days=Math.round((new Date(dkey(new Date()))-new Date(dkey(d)))/86400000);
  if(days===0)return "täna kell "+fmtTime(iso);
  if(days===1)return "eile kell "+fmtTime(iso);
  if(days>1&&days<7)return DOW_L[dowIdx(d)]+" kell "+fmtTime(iso);
  return d.getDate()+". "+MON[d.getMonth()]+" kell "+fmtTime(iso);
}
/* Müügiajaloos peab seisma kuupäev, mitte „täna“ — arvestus vajab täpsust. */
function fmtPaev(iso){
  const d=new Date(iso);
  return DOW_L[dowIdx(d)]+", "+d.getDate()+". "+MON[d.getMonth()]+" "+d.getFullYear();
}
function fmtKuup(iso){
  const d=new Date(iso);
  return d.getDate()+". "+MON[d.getMonth()]+" "+d.getFullYear()+" kell "+fmtTime(iso);
}
function relDay(iso){
  const n=Math.round((new Date(dkey(new Date(iso)))-new Date(dkey(new Date())))/86400000);
  if(n===0)return "täna";if(n===1)return "homme";if(n===-1)return "eile";
  if(n>1&&n<21)return n+" päeva pärast";
  if(n<-1)return Math.abs(n)+" päeva tagasi";
  return "";
}
function fmtSize(b){if(b==null)return "";if(b<1024)return b+" B";if(b<1048576)return Math.round(b/1024)+" KB";return (b/1048576).toFixed(1)+" MB";}
const ext=n=>{const m=String(n).match(/\.([a-z0-9]{1,5})$/i);return m?m[1].toUpperCase():"FAIL";};
function mdLite(t){
  let o="",ul=false;
  for(const raw of String(t||"").split("\n")){
    const l=raw.trim();
    if(l.startsWith("- ")){if(!ul){o+="<ul>";ul=true;}o+="<li>"+inl(l.slice(2))+"</li>";}
    else{if(ul){o+="</ul>";ul=false;}if(l)o+="<p>"+inl(l)+"</p>";}
  }
  if(ul)o+="</ul>";
  return o||"<p></p>";
  function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");}
}
const names=ids=>ids.map(nameOf).join(", ");
const dmKey=(a,b)=>[a,b].sort().join("|");

/* ═══ olek ═══ */
let S=null, view="vestlus", chat=null, calMonth=null, onOk=null, lastView=null;
let seaded={teema:"hele", suurus:"tavaline"};
const opened=new Set();

/* ── Mis on uus?
   S.seen[minu id][võti] = millal ma seda kohta viimati vaatasin.
   „snap“ hoiab selle vana väärtuse alles seni, kuni ma sellel lehel olen —
   muidu kaoksid UUS-sildid samal hetkel, kui ma need avan. */
let snap={};
/* „__baas“ on lähtejoon: millest alates üldse midagi uueks lugeda.
   Nii ei pea iga teema ja kirjavahetuse jaoks eraldi kirjet tegema —
   see, millel oma kirjet ei ole, langeb lähtejoonele tagasi. */
const baas=()=>({__baas:new Date().toISOString()});
function seenMap(){ S.seen=S.seen||{}; S.seen[S.me]=S.seen[S.me]||baas(); return S.seen[S.me]; }
/* NB: hetktõmmis peab hoidma ka tagasilangust lähtejoonele. Kui salvestada
   lihtsalt m[k] ja see on olemata, ei saa hiljem eristada „tõmmist pole“
   ja „tõmmis on olematu“ — ja lugemata piir jääb joonistamata. */
function since(k){
  if(k in snap)return snap[k];
  const m=seenMap();
  return m[k]!==undefined?m[k]:m.__baas;
}
/* Märgib kogu senise sisu loetuks. Kinnitust ootavad asjad EI kao —
   need ei ole „loetud/lugemata“ küsimus, vaid tegemata töö. */
function margiKoikLoetuks(){
  S.seen[S.me]=baas();
  snap={};
}
function markSeen(k){
  const m=seenMap();
  if(!(k in snap))snap[k]=(m[k]!==undefined?m[k]:m.__baas);
  m[k]=new Date().toISOString();
}
function uus(iso,k,by){
  if(by===S.me)return false;
  const s=since(k);
  if(!s)return true;
  return new Date(iso)>new Date(s);
}
/* uued sõnumid ühes teemas või kirjavahetuses */
const uusThread=t=>t.messages.filter(m=>uus(m.at,"thread:"+t.id,m.by)).length;
const grupid=()=>Array.isArray(S.groups)?S.groups:[];
const uusGrupp=g=>g.messages.filter(m=>uus(m.at,"grupp:"+g.id,m.by)).length;
function uusDm(other){
  const d=S.dms[dmKey(S.me,other)];
  return d?d.messages.filter(m=>uus(m.at,"dm:"+dmKey(S.me,other),m.by)).length:0;
}
const uusEv=e=>uus(e.at||e.start,"view:kalender",e.by);
const uusKomm=e=>(e.comments||[]).filter(c=>uus(c.at,"view:kalender",c.by)).length;
const uusInfo=i=>uus(i.at,"view:info",i.by);
const uusInfoKomm=i=>(i.comments||[]).filter(c=>uus(c.at,"view:info",c.by)).length;
const uusFail=f=>uus(f.at,"view:failid",f.by);
const uusMyyk=r=>uus(r.at,"view:myyk",r.kes);

/* Eesti keeles läheb üks ainsusesse: „1 uus kiri“, aga „2 uut kirja“. */
const mitu=(n,ains,mitm)=>n+" "+(n===1?ains:mitm);

/* Kõik, mis sind ootab — üks nimekiri, tavalises keeles. */
function uudised(){
  const out=[];
  S.threads.forEach(t=>{const n=uusThread(t);if(n)out.push({
    n, tekst:mitu(n,"uus sõnum","uut sõnumit")+" teemas „"+t.title+"“",
    mine:()=>{view="vestlus";chat={type:"teema",id:t.id};snap={};markSeen("thread:"+t.id);}});});
  grupid().forEach(g=>{const n=uusGrupp(g);if(n)out.push({
    n, tekst:mitu(n,"uus sõnum","uut sõnumit")+" grupis „"+g.title+"“",
    mine:()=>{view="vestlus";chat={type:"grupp",id:g.id};snap={};markSeen("grupp:"+g.id);}});});
  S.members.filter(m=>m.id!==S.me).forEach(m=>{const n=uusDm(m.id);if(n)out.push({
    n, tekst:mitu(n,"uus kiri","uut kirja")+" — "+m.name,
    mine:()=>{view="vestlus";chat={type:"kiri",id:m.id};snap={};markSeen("dm:"+dmKey(S.me,m.id));}});});
  S.events.forEach(e=>{
    if(uusEv(e))out.push({n:1,tekst:"Uus üritus: „"+e.title+"“",mine:()=>mineVaade("kalender")});
    const k=uusKomm(e);
    if(k)out.push({n:k,tekst:mitu(k,"uus küsimus","uut küsimust")+" ürituse „"+e.title+"“ all",
      mine:()=>{opened.add(e.id);mineVaade("kalender");}});
  });
  S.info.forEach(i=>{
    if(uusInfo(i))out.push({n:1,tekst:"Üldinfo muutus: „"+i.title+"“",mine:()=>mineVaade("info")});
    const k=uusInfoKomm(i);
    if(k)out.push({n:k,tekst:mitu(k,"uus küsimus","uut küsimust")+" info „"+i.title+"“ all",
      mine:()=>{avatudKys.add(i.id);mineVaade("info");}});
  });
  S.files.filter(uusFail).forEach(f=>out.push({n:1,tekst:"Uus fail: "+f.name,mine:()=>mineVaade("failid")}));
  myygiRead().filter(uusMyyk).forEach(r=>out.push({
    n:1,tekst:"Uus müügirida: "+r.nimetus,mine:()=>{myykOsa=r.osa;mineVaade("myyk");}}));
  S.events.filter(e=>e.req&&new Date(e.start)>=new Date()&&!(e.acks||{})[S.me])
    .forEach(e=>out.push({n:1,kinnitus:true,tekst:"Ootab sinu kinnitust: üritus „"+e.title+"“",mine:()=>mineVaade("kalender")}));
  S.info.filter(i=>i.req&&!(i.acks||{})[S.me])
    .forEach(i=>out.push({n:1,kinnitus:true,tekst:"Ootab sinu kinnitust: „"+i.title+"“",mine:()=>mineVaade("info")}));
  /* Tänased tööd, mis on kinnitamata — need ootavad kedagi, kes täna tööl on. */
  {
    const nd=new Date(), k=dkey(nd);
    tood().filter(t=>t.kinnita&&tooSelPaeval(t,nd)&&!tehtud(t,k)).forEach(t=>{
      /* Kellel see töö täna on: määratud tegija või graafikujärgsed.
         Kui graafikus pole kedagi, näevad seda kõik — muidu kaoks ta ära. */
      const read=t.kes?[t.kes]:toolPaeval(kohtOf(t),nd).map(m=>m.id);
      const minu=!read.length||read.indexOf(meId())>=0;
      out.push({n:1,kinnitus:true,
        tekst:(minu?"Sinu teha täna: ":"Täna tegemata: ")+"„"+t.nimi+"“ ("+kohaNimi(kohtOf(t))+")",
        mine:()=>{kalKoht="koik";mineVaade("kalender");}});
    });
  }
  return out;
}
const uudiseidKokku=()=>uudised().reduce((s,x)=>s+x.n,0);
function mineVaade(v){ view=v; snap={}; markSeen("view:"+v); }

/* Brauseri enda kellaväli käitub eri brauserites erinevalt ja ei arvesta
   alati sammu ega piire. Oma nimekiri annab kindla tulemuse kõikjal:
   06:00–23:45, veerandtunni kaupa. Viimane on 23:45, sest järgmine
   veerand ongi juba südaöö. */
const KELL_ALGUS=6, KELL_LOPP=23;
const KELLAAJAD=(()=>{
  const out=[];
  for(let h=KELL_ALGUS;h<=KELL_LOPP;h++)
    for(const m of ["00","15","30","45"])
      out.push(String(h).padStart(2,"0")+":"+m);
  return out;
})();
/* Vana või mujalt tulnud aeg, mis nimekirja ei mahu, lisatakse eraldi —
   nii ei kustu keegi teise sisestus lihtsalt ära. */
/* Tühi valik ütleb sõnadega, mida ta tähendab. Kriips üksi ei ütle
   midagi ja inimene ei julge teda valida. */
function kellSelect(id,val,silt,tyhi){
  const v=String(val||"").slice(0,5);
  return '<select id="'+id+'" class="kell"'+(silt?' aria-label="'+esc(silt)+'"':"")+'>'
    +'<option value="">'+esc(tyhi||"—")+'</option>'
    +(v&&KELLAAJAD.indexOf(v)<0?'<option value="'+esc(v)+'" selected>'+esc(v)+'</option>':"")
    +KELLAAJAD.map(t=>'<option value="'+t+'"'+(t===v?" selected":"")+'>'+t+'</option>').join("")
    +'</select>';
}

/* Päev nihkega tänasest, kindla kellaajaga. Uue ürituse aken pakub
   vaikimisi nädala pärast kell 18. */
function dayAt(o,h,m){const d=new Date();d.setHours(h,m||0,0,0);d.setDate(d.getDate()+o);return d.toISOString();}

/* Salvestus käib serverisse. Kaks asja on siin tähtsad:
   1) korraga käib üks salvestus — kui vahepeal tuleb uus muudatus,
      läheb see järgmisse ringi, muidu jõuavad kaks päringut segamini;
   2) server annab vastuseks värske seisu ja me võtame selle kasutusele.
      Nii saavad ekraanil tehtud read serveri päris numbrid ja järgmine
      salvestus ei tee neist duplikaate. */
let salvestusKaib=false, salvestusOotel=false;
/* Uus teema või grupp saab lõpliku numbri alles andmebaasis. Ekraanil
   tehtud ajutine number kaob salvestamisel ära ja äsja avatud vestlus
   jääks tühja koha peale — seepärast otsime ta pealkirja järgi üles ja
   avame uuesti. */
let ootavAvamine=null;
function leiaOotav(){
  if(!ootavAvamine)return;
  const {type,title}=ootavAvamine;
  const x=(type==="grupp"?(S.groups||[]):(S.threads||[])).find(y=>y.title===title);
  if(x){
    chat={type,id:x.id};snap={};
    markSeen((type==="grupp"?"grupp:":"thread:")+x.id);
  }
  ootavAvamine=null;
}

/* Roheline tuli külgriba all ütles alati „Kõik salvestatud“ — ka siis,
   kui salvestamine oli just ebaõnnestunud. See oli staatiline tekst,
   mida ükski rida koodi ei muutnud. Kõige ohtlikum sort viga: ekraan
   kinnitas rahulikult, et töö on hoiul, ja järgmine lehe avamine näitas,
   et ei olnud. Veateade kadus nelja sekundiga, tuli jäi rohelisena.

   Nüüd näitab tuli päris olekut ja viga jääb ekraanile püsima, kuni
   salvestamine õnnestub. */
function olek(seis){
  const el=$("#olek");if(!el)return;
  const t={
    ok:   ["Kõik salvestatud",""],
    kaib: ["Salvestan…","kaib"],
    viga: ["SALVESTAMATA — kontrolli ühendust","viga"]
  }[seis]||["Kõik salvestatud",""];
  el.className="olek"+(t[1]?" "+t[1]:"");
  el.querySelector("span").textContent=t[0];
}

async function save(){
  if(salvestusKaib){salvestusOotel=true;return;}
  salvestusKaib=true;
  olek("kaib");
  try{
    const r=await fetch("/api/seis",{method:"PUT",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(S)});
    if(r.status===401){location.href="/";return;}
    const uus=await r.json();
    /* Kui salvestamise ajal jõuti midagi veel muuta, siis serveri vastus
       on juba vana: ta ei tea sellest muudatusest. Vana seisu peale
       võtmine kustutaks selle ära — kirjutatud sõnum või kustutatud
       teema hüppaks tagasi. Sel juhul jätame oma seisu alles ja järgmine
       salvestus viib ta ära. */
    if(uus&&Array.isArray(uus.members)){
      if(!salvestusOotel){S=uus;leiaOotav();render();}
      olek("ok");
    }
    else if(uus&&uus.viga){toast(uus.viga);olek("viga");}
    else olek("viga");
  }catch(e){
    toast("Ei saanud salvestada. Kontrolli ühendust.");
    olek("viga");
  }
  finally{
    salvestusKaib=false;
    if(salvestusOotel){salvestusOotel=false;save();}
  }
}

const meId=()=>S.me;
const byId=i=>S.members.find(m=>m.id===i)||null;
const nameOf=i=>(byId(i)||{name:"keegi"}).name;
function split(e){
  const y=[],n=[],s=[];
  for(const m of S.members){
    const r=e.rsvp?e.rsvp[m.id]:null;
    if(r==="yes")y.push(m.id);else if(r==="no")n.push(m.id);else s.push(m.id);
  }
  return {y,n,s};
}
/* Eestlane kirjutab hinna komaga: „12,50“. Punkt peab ka toimima. */
/* „12,50“ ja „12.50“ on mõlemad õiged. Vigane või negatiivne annab 0 —
   aga siis peab küsija seda TEADMA, mitte avastama kuu pärast, et rida
   läks kassasse hinnaga 0,00 €. Selleks on eraldi kontroll allpool. */
const arv=v=>{const x=parseFloat(String(v).replace(",","."));
  return isFinite(x)&&x>=0?Math.round(x*100)/100:0;};
/* Kas see väli on üldse arv? Tühi väli tähendab tasuta (0), mis on
   lubatud; „abc“ ja „-5“ ei ole. */
const onArv=v=>{const s=String(v||"").trim();
  if(!s)return true;
  const x=parseFloat(s.replace(",","."));
  return isFinite(x)&&x>=0;};
const raha=v=>v.toFixed(2).replace(".",",")+" €";
const osaNimi=oid=>{const o=(S.myyk.osad||[]).find(x=>x.id===oid);return o?o.nimi:"—";};
const myygiRead=()=>S.myyk&&Array.isArray(S.myyk.read)?S.myyk.read:[];
const summa=r=>r.reduce((x,y)=>x+y.kogus*y.hind,0);
/* Toote kogus tuleb tema müügikordadest — nii säilib ajalugu. */
function arvutaKogus(r){
  if(!Array.isArray(r.myygid))r.myygid=[{at:r.at,kogus:r.kogus||0,kes:r.kes}];
  r.kogus=r.myygid.reduce((a,b)=>a+b.kogus,0);
  return r;
}
const myygid=r=>Array.isArray(r.myygid)?r.myygid:[];
/* Kogu maja müüki näeb administraator. Ülejäänud näevad oma müüki —
   nemad vastutavad oma kassa eest, mitte teiste omade eest.
   NB: ilma sisselogimiseta on see kokkulepe, mitte lukk. */
/* Kes näeb kogu maja kassat, otsustab server ameti järgi ja ütleb selle
   seisus välja. Ekraan küsis seda varem vanast „administraator“ tõeväärtus-
   väljast — seetõttu ei näinud raamatupidaja ega ülemus aruannet, kuigi
   server saatis neile kõik read. Kaks eri tõde ühe asja kohta. */
const naebKogumyyki=()=>!!S.naebKassat;

/* Iga müügikord eraldi sündmusena: millal, mida, kui palju, kes. */
function myygiSyndmused(){
  const out=[];
  myygiRead().forEach(r=>myygid(r).forEach(m=>out.push({
    at:m.at, kes:m.kes, kogus:m.kogus, hind:r.hind,
    eur:m.kogus*r.hind, nimetus:r.nimetus, osa:r.osa
  })));
  return out.sort((a,b)=>new Date(b.at)-new Date(a.at));
}
/* Päevade kaupa, uuemad ees. */

/* Kes kui palju mida müüs — kokku loetakse iga toote iga müügikord. */
function myyjaStat(){
  const kokku={};
  myygiRead().forEach(r=>{
    myygid(r).forEach(m=>{
      const k=kokku[m.kes]||(kokku[m.kes]={kes:m.kes,kordi:0,tk:0,eur:0,tooted:{}});
      k.kordi++; k.tk+=m.kogus; k.eur+=m.kogus*r.hind;
      const t=k.tooted[r.id]||(k.tooted[r.id]={nimetus:r.nimetus,osa:r.osa,tk:0,eur:0});
      t.tk+=m.kogus; t.eur+=m.kogus*r.hind;
    });
  });
  return Object.values(kokku).sort((a,b)=>b.eur-a.eur);
}
const ackIds=o=>S.members.filter(m=>(o.acks||{})[m.id]).map(m=>m.id);
const noAckIds=o=>S.members.filter(m=>!(o.acks||{})[m.id]).map(m=>m.id);
function dmOf(other){
  const k=dmKey(meId(),other);
  if(!S.dms[k])S.dms[k]={messages:[]};
  return S.dms[k];
}

/* Ürituste loend kalendri all. Kalendris valitud maja kehtib ka siin —
   „Kõik“ näitab mõlemat. */
function yritusteLoend(){
  const nyyd=new Date();
  const read=S.events.filter(e=>sobibKoht(e,kalKoht));
  const tulemas=read.filter(e=>new Date(e.start)>=nyyd)
    .sort((a,b)=>new Date(a.start)-new Date(b.start));
  const olnud=read.filter(e=>new Date(e.start)<nyyd)
    .sort((a,b)=>new Date(b.start)-new Date(a.start)).slice(0,10);
  if(!read.length)
    return '<div class="card"><div class="empty"><b>Ühtegi üritust ei ole.</b>'
      +'Vajuta üleval paremal „Uus üritus“.</div></div>';
  let h="";
  if(tulemas.length)h+='<p class="h3">TULEMAS</p>'+tulemas.map(evCard).join("");
  if(olnud.length)h+='<p class="h3" style="margin-top:14px">TOIMUNUD</p>'
    +olnud.map(evCard).join("");
  return h;
}

/* ═══ Kalender ═══ */
function vCal(w){
  if(!calMonth){const n=new Date();calMonth=new Date(n.getFullYear(),n.getMonth(),1);}
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const start=new Date(y,m,1-dowIdx(new Date(y,m,1)));
  const tk=dkey(new Date()),map={};
  const valitudPaev=kalPaev||tk;
  for(const e of S.events){
    if(!sobibKoht(e,kalKoht))continue;
    const k=dkey(new Date(e.start));(map[k]=map[k]||[]).push(e);
  }
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=dkey(d),out=d.getMonth()!==m;
    const list=(map[k]||[]).sort((a,b)=>new Date(a.start)-new Date(b.start));
    const tl=out?[]:tooPaeval(d).filter(t=>sobibKoht(t,kalKoht));
    cells+='<div class="cell'+(out?" out":"")+(k===tk?" today":"")
      +(k===valitudPaev?" valitud":"")+'">'
      +'<button class="n" data-act="kal-paev" data-k="'+k+'" '
      +'aria-label="Vaata seda päeva">'+d.getDate()+'</button>'
      +list.map(e=>'<button class="pill" data-act="goto-ev" data-id="'+e.id+'">'+fmtTime(e.start)+' '+esc(e.title)+'</button>').join("")
      /* Mullis on see, mida päevaplaanist vaadatakse: kes ja mis kell.
         Töö nimi on ühe klõpsu kaugusel ja jääb kohtspikrisse. */
      +tl.map(t=>{
          const teht=tehtud(t,k), ootab=vajabKinnitust(t,k);
          const aeg=tooAeg(t);
          return '<button class="pill too2'+(teht?" tehtud":(ootab?" ootab":""))+'"'
            +' data-act="too-paev" data-id="'+t.id+'" data-k="'+k+'"'
            +' title="'+esc(t.nimi)+(t.kes?" — "+esc(nameOf(t.kes)):"")
            +  (teht?" · tehtud: "+esc(nameOf(teht.kes)):(ootab?" · ootab kinnitust":""))+'">'
            /* Kinnitatava töö puhul on tähtis, MIS on tegemata või tehtud —
               seega jääb mulli töö nimi. Tegija on kohtspikris ja aknas. */
            +'<b>'+(t.kinnita?'<i class="mark">'+(teht?"✓":"○")+'</i>':"")
            +  esc(t.kinnita?t.nimi:(t.kes?eesnimi(nameOf(t.kes)):t.nimi))+'</b>'
            +(aeg?'<span>'+esc(aeg)+'</span>':"")+'</button>';
        }).join("")
      +'</div>';
  }
  w.innerHTML='<div class="osad">'
    +KAL_KOHAD.map(k=>'<button data-act="kal-koht" data-v="'+k.id+'" aria-pressed="'+(kalKoht===k.id)+'">'
      +esc(k.nimi)+'<span class="n">'
      +(S.events.filter(e=>sobibKoht(e,k.id)).length+tood().filter(t=>sobibKoht(t,k.id)).length)
      +'</span></button>').join("")
    +'</div>'
    +'<div class="calbar"><h3>'+MON[m].charAt(0).toUpperCase()+MON[m].slice(1)+' '+y+'</h3>'
    +'<button class="btn ghost small" data-act="cal" data-v="-1">Eelmine kuu</button>'
    +'<button class="btn ghost small" data-act="cal" data-v="0">Täna</button>'
    +'<button class="btn ghost small" data-act="cal" data-v="1">Järgmine kuu</button>'
    +'<span class="sp"></span>'
    +'<button class="btn ghost small" data-act="too-uus">+ Lisa töö</button></div>'
    +'<div class="cal"><div class="dow">'+DOW_S.map(d=>'<span>'+d+'</span>').join("")+'</div><div class="g">'+cells+'</div></div>'
    /* Üritused olid enne eraldi kategoorias, aga see oli sama asi kaks
       korda: kalender näitas neid ruudustikus ja nimekiri loeteluna.
       Nüüd on nad ühe katuse all — kalender üleval, üritused all.
       Päevaplokki siin ei ole: ruudus on kirjas juba see, mis sel päeval
       toimub, ja iga kirje avaneb klõpsuga. */
    +yritusteLoend();
}

/* Ühe päeva plokk kalendri all: mis sel päeval toimub ja kes on majas.
   Varem oli see eraldi Töö graafiku all ja näitas ainult tänast. Nüüd on
   kõik ühe kalendri all: vajuta kuupäeval ja näed selle päeva kohta kõike. */
function paevaPlokk(k){
  const d=new Date(k+"T12:00:00");
  const i=dowIdx(d);
  const onTana=k===dkey(new Date());
  const millal=onTana?"täna":"sel päeval";

  /* Töö graafiku päev järgib graafiku maja valikut, mitte kalendri oma. */
  const tl=tooPaeval(d).filter(t=>sobibKoht(t,graKoht));

  const majasHtml=KOHAD.filter(x=>kalKoht==="koik"||x.id===kalKoht).map(x=>{
    const read=S.members.filter(m=>paevalTööl(m.id,i,x.id)&&!araPaeval(m.id,k));
    if(!read.length)return "";
    return '<div class="majarida"><span class="kohasilt">'+esc(x.nimi)+'</span>'
      + read.map(m=>'<span class="isik">'+avaHtml(m)+esc(m.name)
          +'<span class="kell2">'+esc(vahetusi((graafik(x.id)[m.id]||[])[i]).join(" · "))
          +'</span></span>').join("")
      +'</div>';
  }).join("");
  const ara=puhkused().filter(x=>x.algus<=k&&x.lopp>=k);

  /* Üritused ja töö graafik on kaks eri asja ja neid ei panda ühte
     ritta. Töö graafiku päev vastab küsimusele „kes on majas ja mis
     tööd on teha“; üritused on Ürituste all, oma kalendriga. */
  const tooRida =
    '<div class="tanariba">'
    + '<div><span class="sild">Majas</span>'
    +  (majasHtml||'<span class="tyhi">Graafikus ei ole '+millal+' kedagi.</span>')+'</div>'
    + '<div><span class="sild">Ära</span>'
    +  (ara.length?ara.map(x=>'<span class="isik">'+avaHtml(byId(x.kes)||{name:"?"})
         +esc(nameOf(x.kes))+'<span class="kes3">'+esc(liigiNimi(x.liik))+'</span></span>').join("")
       :'<span class="tyhi">Keegi ei ole '+millal+' ära.</span>')+'</div>'
    +'</div>';

  const toodeRida =
    '<div class="tanariba" style="margin-top:16px">'
    + '<div><span class="sild">Tööd</span>'
    +  (tl.length?tl.map(t=>{
         const teht=tehtud(t,k), ootab=vajabKinnitust(t,k), aeg=tooAeg(t);
         return '<button class="pill too2'+(teht?" tehtud":(ootab?" ootab":""))+'"'
           +' data-act="too-paev" data-id="'+t.id+'" data-k="'+k+'">'
           +'<b>'+(t.kinnita?'<i class="mark">'+(teht?"✓":"○")+'</i>':"")+esc(t.nimi)+'</b>'
           +(aeg?'<span>'+esc(aeg)+'</span>':"")+'</button>';
       }).join("")
      :'<span class="tyhi">Sel päeval ei ole töid.</span>')+'</div>'
    +'<div></div></div>';

  return '<div class="card"><div class="kalpais">'
    +'<p class="h3">'+(onTana?"TÄNA":"PÄEV")+' — '+esc(DOW_P[i])+'</p>'
    +'<span class="kuunimi">'+d.getDate()+'. '+MON[d.getMonth()]+' '+d.getFullYear()+'</span>'
    +'</div>'
    +tooRida+toodeRida+'</div>';
}

/* ═══ Vestlus ═══ */

/* Otsing käib läbi kõik vestlused, mida sa näed — teemad, sinu grupid
   ja sinu kirjad. Mida sa muidu ei näe, seda ei leia ka otsinguga: seis
   ise ei sisalda võõraid kirju. */
let vestluseOts="";

function koikVestlused(){
  const out=[];
  S.threads.forEach(t=>out.push({type:"teema",id:t.id,nimi:t.title,box:t}));
  grupid().forEach(g=>out.push({type:"grupp",id:g.id,nimi:g.title,box:g}));
  S.members.filter(m=>m.id!==meId()).forEach(m=>{
    const d=S.dms[dmKey(meId(),m.id)];
    if(d&&d.messages&&d.messages.length)
      out.push({type:"kiri",id:m.id,nimi:m.name,box:d});
  });
  return out;
}

function otsinguTulemused(){
  const o=vestluseOts.toLowerCase();
  const nimed=[],read=[];
  for(const v of koikVestlused()){
    if(v.nimi.toLowerCase().includes(o))
      nimed.push('<button data-act="ava" data-type="'+v.type+'" data-id="'+v.id+'">'
        +'<span class="t">'+esc(v.nimi)+'</span>'
        +'<span class="m">'+esc(LIIGI_NIMI[v.type])+'</span></button>');
    for(const m of (v.box.messages||[])){
      if(!m.text.toLowerCase().includes(o))continue;
      read.push({at:m.at,html:
        '<button data-act="ava" data-type="'+v.type+'" data-id="'+v.id+'">'
        +'<span class="t">'+esc(v.nimi)+'</span>'
        +'<span class="m">'+esc(first(nameOf(m.by)))+": "+tostaEsile(m.text,vestluseOts)
        +' · '+esc(fmtStamp(m.at))+'</span></button>'});
    }
  }
  read.sort((a,b)=>new Date(b.at)-new Date(a.at));
  if(!nimed.length&&!read.length)
    return '<div class="otsityhi">Ei leidnud midagi.<span>Otsitakse vestluste nimedest '
      +'ja sõnumite tekstist.</span></div>';
  return (nimed.length?'<div class="grp">VESTLUSED</div>'+nimed.join(""):"")
    +(read.length?'<div class="grp"'+(nimed.length?' style="margin-top:8px"':"")+'>'
      +'SÕNUMID<small>'+mitu(read.length,"leid","leidu")+'</small></div>'
      +read.slice(0,40).map(x=>x.html).join(""):"");
}

const LIIGI_NIMI={teema:"Teema — näevad kõik",grupp:"Grupp",kiri:"Kiri"};

/* Näitame leitud sõna ümbrust, mitte kogu sõnumit — pikk jutt ei mahu
   nimekirja ja otsitud koht jääks nägemata. */
function tostaEsile(tekst,ots){
  const i=tekst.toLowerCase().indexOf(ots.toLowerCase());
  if(i<0)return esc(tekst.slice(0,60));
  const a=Math.max(0,i-24), b=Math.min(tekst.length,i+ots.length+34);
  return (a?"…":"")+esc(tekst.slice(a,i))
    +'<mark>'+esc(tekst.slice(i,i+ots.length))+'</mark>'
    +esc(tekst.slice(i+ots.length,b))+(b<tekst.length?"…":"");
}

function vChat(w){
  if(!chat){
    chat=S.threads[0]?{type:"teema",id:S.threads[0].id}:null;
    if(chat)markSeen("thread:"+chat.id);
  }
  if(chat&&chat.type==="teema"&&!S.threads.some(t=>t.id===chat.id))chat=S.threads[0]?{type:"teema",id:S.threads[0].id}:null;
  if(chat&&chat.type==="kiri"&&!byId(chat.id))chat=null;
  /* Kui keegi võttis sind grupist välja, ei tohi lahtine aken jääda
     tühja kohta näitama. */
  if(chat&&chat.type==="grupp"&&!grupid().some(g=>g.id===chat.id))chat=null;

  const teemad=S.threads.slice().sort((a,b)=>lastAt(b)-lastAt(a)).map(x=>{
    const l=x.messages[x.messages.length-1];
    const on=chat&&chat.type==="teema"&&chat.id===x.id;
    const n=uusThread(x);
    return '<button data-act="ava" data-type="teema" data-id="'+x.id+'" aria-current="'+on+'">'
      +'<span class="t">'+esc(x.title)+(n?'<span class="uus">'+(n===1?"1 UUS":n+" UUT")+'</span>':"")+'</span>'
      +'<span class="m">'+mitu(x.messages.length,"sõnum","sõnumit")+(l?' · '+esc(fmtStamp(l.at)):"")+'</span></button>';
  }).join("");

  const kirjad=S.members.filter(m=>m.id!==meId()).map(m=>{
    const d=S.dms[dmKey(meId(),m.id)];
    const l=d&&d.messages.length?d.messages[d.messages.length-1]:null;
    const on=chat&&chat.type==="kiri"&&chat.id===m.id;
    const n=uusDm(m.id);
    return '<button data-act="ava" data-type="kiri" data-id="'+m.id+'" aria-current="'+on+'">'
      +'<span class="t">'+esc(m.name)+(n?'<span class="uus">'+(n===1?"1 UUS":n+" UUT")+'</span>':"")+'</span>'
      +'<span class="m">'+(l?esc(first(nameOf(l.by)))+": "+esc(l.text.slice(0,42))+(l.text.length>42?"…":""):"kirjuta esimesena")+'</span></button>';
  }).join("");

  /* Grupp on teema ja kirja vahepeal: valid ise, kes teda näevad.
     Seepärast seisab ta ka nimekirjas nende kahe vahel. */
  const gr=grupid().slice().sort((a,b)=>lastAt(b)-lastAt(a)).map(x=>{
    const l=x.messages[x.messages.length-1];
    const on=chat&&chat.type==="grupp"&&chat.id===x.id;
    const n=uusGrupp(x);
    return '<button data-act="ava" data-type="grupp" data-id="'+x.id+'" aria-current="'+on+'">'
      +'<span class="t">'+esc(x.title)+(n?'<span class="uus">'+(n===1?"1 UUS":n+" UUT")+'</span>':"")+'</span>'
      +'<span class="m">'+mitu((x.who||[]).length,"inimene","inimest")
      +(l?' · '+esc(first(nameOf(l.by)))+": "+esc(l.text.slice(0,32))+(l.text.length>32?"…":""):" · kirjuta esimesena")
      +'</span></button>';
  }).join("");

  const otsikast='<div class="otsikast">'
    +'<input type="search" id="vestlusOts" placeholder="Otsi vestlustest…"'
    +' aria-label="Otsi vestlustest" value="'+esc(vestluseOts)+'">'
    +(vestluseOts?'<button data-act="ots-tyhi" aria-label="Tühjenda otsing">✕</button>':"")
    +'</div>';

  const list=otsikast+(vestluseOts
    ? otsinguTulemused()
    : '<div class="grp">TEEMAD<small>Näevad kõik liikmed</small></div>'+teemad
      +'<div class="grp" style="margin-top:8px">GRUPID<small>Näevad ainult valitud inimesed</small></div>'
      +gr+'<button class="uusgrupp" data-act="uus-grupp">+ Uus grupp</button>'
      +'<div class="grp" style="margin-top:8px">KIRJAD<small>Näete ainult teie kahekesi</small></div>'+kirjad);

  let convo='<div class="convo"><div class="msgs"><div class="empty"><b>Vali vasakult teema või inimene.</b></div></div></div>';
  if(chat){
    const isDm=chat.type==="kiri", isGr=chat.type==="grupp";
    const box=isDm?dmOf(chat.id)
      :isGr?grupid().find(g=>g.id===chat.id)
      :S.threads.find(t=>t.id===chat.id);
    const title=isDm?nameOf(chat.id):box.title;
    const note=isDm?"Kiri kahe vahel — teised liikmed seda ei näe"
      :isGr?"Grupp — näevad "+((box.who||[]).map(x=>first(nameOf(x))).join(", ")||"ainult sina")
      :"Teema — kõik liikmed näevad";
    convo='<div class="convo">'
      +'<div class="cvhead"><div class="cvnimi"><b>'+esc(title)+'</b>'
      +'<span>'+esc(note)+'</span></div>'
      +(isGr?'<button class="linkbtn" data-act="muuda-grupp" data-id="'+box.id+'">Muuda gruppi</button>':"")
      +'<button class="linkbtn mut" data-act="vestlus-kustuta" data-type="'+chat.type
      +'" data-id="'+chat.id+'">Kustuta</button>'
      +'</div>'
      +'<div class="msgs" id="msgs">'
      +(box.messages.length?msgideHtml(box.messages,
        isDm?"dm:"+dmKey(meId(),chat.id):isGr?"grupp:"+chat.id:"thread:"+chat.id)
        :'<div class="empty"><b>Siin ei ole veel ühtegi sõnumit.</b>Kirjuta esimene allolevasse kasti.</div>')
      +'</div><div class="composer"><div class="cbox">'
      +'<button class="emonupp" id="emo" type="button" aria-label="Lisa emotsioon"'
      +' title="Lisa emotsioon">☺</button>'
      +'<textarea id="ci" rows="2" placeholder="Kirjuta siia…" aria-label="Sinu sõnum"></textarea>'
      +'<button class="btn" id="csend" data-act="send" disabled>Saada</button></div>'
      +'<div class="emorida" id="emorida" hidden>'
      +EMOTSIOONID.map(e=>'<button type="button" data-act="emo" data-v="'+e+'"'
        +' aria-label="'+esc(e)+'">'+e+'</button>').join("")
      +'</div></div></div>';
  }
  w.innerHTML='<div class="chat" data-open="'+(chat?1:0)+'"><div class="tlist">'+list+'</div>'+convo+'</div>';
  const b=$("#msgs");if(b)b.scrollTop=b.scrollHeight;
  wireComposer();
  wireOtsing();
  function lastAt(x){const l=x.messages[x.messages.length-1];return new Date(l?l.at:x.at);}
}
/* Joon näitab, kust sinu jaoks uued sõnumid algavad. Ilma selleta peaks
   pika lõime puhul kellaaegade järgi ise ära arvama, mida sa lugenud oled. */
function msgideHtml(list,key){
  let piir=false, h="";
  for(const m of list){
    if(!piir&&uus(m.at,key,m.by)){
      piir=true;
      h+='<div class="piir"><span>uued sõnumid</span></div>';
    }
    h+=msgHTML(m);
  }
  return h;
}
/* Märgid, mille saab sõnumi juurde panna. Rohkem ei ole vaja: pikk
   valik teeb otsustamise raskeks ja pool neist ei tähenda tööasjades
   midagi. */
const MARGID=["👍","❤️","😊","😮","🙏","✅"];

/* Kirjutamise juurde käiv valik on pikem: siin on nad osa lausest, mitte
   vastus. Kaks rida on parasjagu — pikem nimekiri nõuab kerimist ja
   kerimine väikeste piltide seas on tüütu. */
const EMOTSIOONID=["🙂","😀","😄","😉","😊","🥰","😍","😘",
  "👍","👏","🙏","💪","🎉","❤️","🌸","☀️",
  "😢","😮","😅","🤔","😴","🍰","☕","🚗"];

function msgHTML(m){
  const minu=m.by===meId();
  const re=m.re||{};
  const olemas=MARGID.filter(x=>(re[x]||[]).length);
  return '<div class="msg'+(minu?" mine":"")+'" data-mid="'+esc(m.id)+'">'
    +'<div class="hd"><b>'+esc(nameOf(m.by))+'</b><span>'+esc(fmtStamp(m.at))+'</span></div>'
    +'<div class="tx">'+esc(m.text)+'</div>'
    +'<div class="mtools">'
    +  olemas.map(x=>{
         const kes=re[x]||[], minuOma=kes.includes(meId());
         return '<button class="marge'+(minuOma?" minu":"")+'" data-act="marge"'
           +' data-mid="'+esc(m.id)+'" data-v="'+x+'"'
           +' title="'+esc(kes.map(nameOf).join(", "))+'"'
           +' aria-pressed="'+minuOma+'">'+x+'<span>'+kes.length+'</span></button>';
       }).join("")
    +  '<button class="margelisa" data-act="marge-vali" data-mid="'+esc(m.id)+'"'
    +  ' aria-label="Pane märk selle sõnumi juurde" title="Pane märk">☺</button>'
    +  (minu?'<button class="margelisa" data-act="sonum-kustuta" data-mid="'+esc(m.id)+'"'
      +' aria-label="Võta see sõnum tagasi" title="Võta tagasi">✕</button>':"")
    +'</div></div>';
}
/* Otsikast joonistatakse iga tähe järel uuesti. Ilma kursorit tagasi
   panemata hüppaks kirjutamine pärast esimest tähte välja. */
let otsFookus=false;
function wireOtsing(){
  const i=$("#vestlusOts");if(!i)return;
  i.addEventListener("input",()=>{
    vestluseOts=i.value.trim();
    otsFookus=true;
    render();
  });
  if(otsFookus){
    i.focus();
    i.setSelectionRange(i.value.length,i.value.length);
    otsFookus=false;
  }
}

/* Praegu lahti olev vestlus — teema, grupp või kiri. */
function avatudVestlus(){
  if(!chat)return null;
  return chat.type==="kiri"?dmOf(chat.id)
    :chat.type==="grupp"?grupid().find(g=>g.id===chat.id)
    :S.threads.find(t=>t.id===chat.id);
}
function sonumById(id){
  const b=avatudVestlus();
  return b?b.messages.find(m=>m.id===id):null;
}

function wireComposer(){
  const ta=$("#ci"),b=$("#csend");if(!ta)return;
  const sync=()=>{b.disabled=!ta.value.trim();ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,150)+"px";};
  ta.addEventListener("input",sync);
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}});
  const emo=$("#emo"),rida=$("#emorida");
  if(emo&&rida)emo.addEventListener("click",()=>{
    rida.hidden=!rida.hidden;
    emo.setAttribute("aria-pressed",String(!rida.hidden));
    if(!rida.hidden)rida.scrollTop=0;
  });
  sync();
}
function sendMsg(){
  const ta=$("#ci");if(!ta||!chat)return;
  const text=ta.value.trim();if(!text)return;
  const box=avatudVestlus();
  if(!box)return;
  box.messages.push({id:uid(),by:meId(),at:new Date().toISOString(),text});
  save();render();
  const n=$("#ci");if(n)n.focus();
}

/* ═══ Üldinfo ═══ */
function vInfo(w){
  if(!S.info.length){
    w.innerHTML='<div class="card"><div class="empty"><b>Üldinfot ei ole kirja pandud.</b>Kodukord, ohutusjuhend, liikmemaks.</div></div>';return;
  }
  const need=S.info.filter(i=>i.req&&!(i.acks||{})[meId()]);
  let h="";
  if(need.length)h+='<div class="notice">'+ico("info")+'<span><b>'+need.length+' plokk'+(need.length>1?"i":"")+' ootab sinu kinnitust.</b> Loe läbi ja vajuta „Olen tutvunud“.</span></div>';
  w.innerHTML=h+S.info.map(infoCard).join("");
}
/* Küsimused ühe kirje all. Ürituse oma on ajalooliselt vanem ja seisab
   omaette; siit käib üldinfo. Nupp ütleb ise, mida ta teeb — „Küsi
   midagi selle info kohta“ on selgem kui tühi kõnemulli ikoon. */
const avatudKys=new Set();
function kysimustePlokk(i){
  const cs=i.comments||[],on=avatudKys.has(i.id),uusi=uusInfoKomm(i);
  let h='<button class="qbtn" data-act="iq" data-id="'+i.id+'">'+ico("ask")
    +'<span>'+(cs.length?"Küsimused ja kommentaarid":"Küsi midagi selle info kohta")+'</span>'
    +(uusi?'<span class="uus" style="margin:0 0 0 auto">'+(uusi===1?'1 UUS':uusi+' UUT')+'</span>':"")
    +'<span class="n"'+(uusi?' style="margin-left:10px"':"")+'>'
    +(cs.length?cs.length+(on?" — peida":""):(on?"peida":"kirjuta"))+'</span></button>';
  if(!on)return h;
  return h+'<div class="qlist">'
    +(cs.length?cs.map(c=>
      '<div class="q"><div class="hd">'+(uus(c.at,"view:info",c.by)?'<span class="uus">UUS</span>':"")
      +'<b>'+esc(nameOf(c.by))+'</b><span>'+esc(fmtStamp(c.at))+'</span></div>'
      +'<div class="tx">'+esc(c.text)+'</div></div>').join("")
      :'<p class="meta">Keegi pole veel midagi küsinud. Küsi julgelt — teised näevad ka vastust.</p>')
    +'<div class="qform"><textarea id="iq_'+i.id+'" placeholder="Kirjuta oma küsimus või kommentaar…" aria-label="Küsimus selle info kohta"></textarea>'
    +'<div class="tools"><button class="btn small" data-act="iq-send" data-id="'+i.id+'">Saada küsimus</button>'
    +'</div></div></div>';

function infoCard(i){

/* ═══ Müük ═══ */
/* Osade nupud on alati ekraanil ja üks on alati avatud — nii ei pea
   midagi valima, et sisu näha, aga teisele vajutades vahetub tabel. */
let myykOsa=null, myykKuu=null, hinnaOsa=null, nadalaNihe=0, kalKoht="koik", graKoht="km";
/* Vaadatav päev. Üks ja seesama nii Kalendris kui Töö graafikus: kui
   valid päeva ühes kohas, näitab teine sama päeva. Tühi tähendab tänast. */
let kalPaev=null;
const valitudPaevOn=()=>kalPaev||dkey(new Date());
/* Kelle graafikut vaadatakse. Tühi tähendab kõiki. */
let graIsik=null;
/* Töö graafiku suure kalendri kuu. */

/* Kustutatud osa read ei tohi kaduda — nad koonduvad „Ilma osata“ alla. */
function myygiSeis(){
  const osad=S.myyk.osad||[], koik=myygiRead();
  const orvud=koik.filter(r=>!osad.some(o=>o.id===r.osa));
  /* Esimene nupp on üldine kokkuvõte, ülejäänud on konkreetsed osad. */
  const nupud=[{id:"__kokku",nimi:"Kokkuvõte",kokku:true}]
    .concat(osad)
    .concat(orvud.length?[{id:"__orvud",nimi:"Ilma osata",orb:true}]:[]);
  if(!nupud.some(o=>o.id===myykOsa))myykOsa="__kokku";
  const valitud=nupud.find(o=>o.id===myykOsa)||null;
  const read=(!valitud||valitud.kokku)?[]:(valitud.orb?orvud:koik.filter(r=>r.osa===valitud.id));
  return {osad,koik,orvud,nupud,valitud,read};
}

/* Oma müük: mida mina olen müünud, millal ja mis summas. Ei osade
   tabelit, ei müüjaid, ei maja kokkuvõtet — need ei ole minu asi. */
function vMinuMyyk(w){
  const mina=meId();
  const read=myygiSyndmused().filter(x=>x.kes===mina)
    .sort((a,b)=>new Date(b.at)-new Date(a.at));
  const tk=read.reduce((a,b)=>a+b.kogus,0), eur=read.reduce((a,b)=>a+b.eur,0);

  let h='<div class="card"><p class="h3">MINU MÜÜK KOKKU</p>'
    +'<div class="statriba">'
    +  '<span><b>'+read.length+'</b> '+(read.length===1?"müügikord":"müügikorda")+'</span>'
    +  '<span><b>'+tk+'</b> '+(tk===1?"tükk":"tükki")+'</span>'
    +  '<span><b>'+esc(raha(eur))+'</b></span>'
    +'</div></div>';

  if(!read.length){
    h+='<div class="card"><div class="empty"><b>Sa ei ole veel midagi müünud.</b>'
      +'Vajuta üleval paremal „Lisa müük“.</div></div>';
    w.innerHTML=h; return;
  }

  /* Päevade kaupa: nii näeb kassapäeva kohe kokku. */
  const paevad={};
  read.forEach(x=>{const k=dkey(new Date(x.at));(paevad[k]=paevad[k]||[]).push(x);});
  const jrk=Object.keys(paevad).sort().reverse();

  h+='<div class="card"><p class="h3">PÄEVADE KAUPA</p>'
    + jrk.map(k=>{
        const r=paevad[k];
        const ptk=r.reduce((a,b)=>a+b.kogus,0), peur=r.reduce((a,b)=>a+b.eur,0);
        return '<div class="paevariba"><span class="pk">'+esc(fmtPaev(k+"T12:00:00"))+'</span>'
          +'<span class="ps">'+ptk+' tk · '+esc(raha(peur))+'</span></div>'
          +'<div class="mlist">'
          + r.sort((a,b)=>new Date(a.at)-new Date(b.at)).map(x=>'<div class="mline2">'
              +'<span class="nm2">'+esc(x.nimetus)
              +  '<span class="osa2">'+esc(osaNimi(x.osa))+' · kell '+fmtTime(x.at)+'</span></span>'
              +'<span class="tk">'+x.kogus+' tk · '+esc(raha(x.eur))+'</span></div>').join("")
          +'</div>';
      }).join("")
    +'</div>';

  w.innerHTML=h;
}

function vMyyk(w){
  if(!naebKogumyyki())return vMinuMyyk(w);
  const {osad,koik,orvud,nupud,valitud}=myygiSeis();

  let h='<div class="osad">'
    +nupud.map(o=>{
        const r=o.kokku?koik:(o.orb?orvud:koik.filter(x=>x.osa===o.id));

          +((o.orb)?' class="orb"':o.kokku?' class="yld"':'')+'>'

    +'</div>';

  if(valitud&&valitud.kokku){
    /* Üldine pilt kahes veerus: osad kõrvuti müüjatega, et mahuks ühele ekraanile. */

    h+='<div class="kaks"><div class="pool"><p class="h3">OSAD</p><div class="tabel">'

          +'<span class="arv">'+orvud.reduce((a,b)=>a+b.kogus,0)+'</span>'

      +'</div>'
      +'</div>';

    const my=myyjaStat();
    if(my.length){
      h+='<div class="pool"><p class="h3">MÜÜJAD</p>'
        +'<div class="tabel">'
        +'<div class="trida pais kat"><span>Müüja</span>'

        +my.map(x=>'<button class="trida kat" data-act="myyja" data-id="'+x.kes+'">'
            +'<span class="nim">'+esc(nameOf(x.kes))+'</span>'
            +'<span class="arv">'+x.tk+'</span>'
            +'<span class="arv">'+esc(raha(x.eur))+'</span><span class="nool">›</span></button>').join("")
        +'<div class="trida kokku kat"><span class="nim">Kõik müüjad</span>'
        +'<span class="arv">'+my.reduce((a,b)=>a+b.tk,0)+'</span>'
        +'<span class="arv">'+esc(raha(my.reduce((a,b)=>a+b.eur,0)))+'</span><span></span></div>'
        +'</div>'
        +'</div>';
    }
    h+='</div>';

    /* Kalender: iga päev üks ruut oma summaga. Lühem kui nimekiri ja
       päeva üksikasjad on ühe klõpsu kaugusel. */
    const paevaKaart={};
    myygiSyndmused().forEach(x=>{
      const k=dkey(new Date(x.at));

      p.tk+=x.kogus; p.eur+=x.eur;

      +  '<button class="btn ghost small" data-act="myyk-kuu" data-v="0">Täna</button>'
      +  '<button class="btn ghost small" data-act="myyk-kuu" data-v="1">›</button>'
      +  '<span class="kuusumma">'+kuuTk+' tk · '+esc(raha(kuuEur))+'</span>'
      +'</div>'
      +'<div class="mcal"><div class="mdow">'
      +  DOW_S.map(x=>'<span>'+x+'</span>').join("")
      +'</div><div class="mgrid">'+ruudud+'</div></div></div>'
      +'<p class="meta">Vajuta osa, müüja või kalendripäeva peal, et näha üksikasju.</p>'
      +'<div class="pool arukast">'
      +  '<div class="kalpais"><p class="h3">ARUANNE</p>'
      +    '<button class="btn ghost small" data-act="aruanne">Ava aruanne</button></div>'
      +  '<p class="meta" style="margin:0">Vali ajavahemik ja salvesta väljavõte arvutisse. '
      +  'Fail avaneb Excelis otse — selle saab raamatupidajale edasi saata.</p>'
      +'</div>';
  }else if(!valitud){
    h+='<div class="tabel"><div class="empty"><b>Ühtegi osa ei ole.</b>'
      +'Vajuta all „Muuda osi“ ja lisa esimene.</div></div>';
  }else{
    /* Nimetuse järgi: 50 raamatu seast leiab nii silmaga üles. */
    const read=(valitud.orb?orvud:koik.filter(r=>r.osa===valitud.id))
                 .slice().sort((a,b)=>a.nimetus.localeCompare(b.nimetus,"et"));
    h+='<div class="tabel">'

      +'<span>Kes müüs</span><span></span></div>';
    if(!read.length){
      h+='<div class="empty"><b>Selles osas ei ole veel ühtegi rida.</b>'
        +'Vajuta üleval paremal „Lisa müük“.</div>';
    }else{
      h+=read.map(r=>
        '<div class="trida">'
        +'<button class="nim toode" data-act="toode" data-id="'+r.id+'">'
        +  (uusMyyk(r)?'<span class="uus">UUS</span>':"")+esc(r.nimetus)+'</button>'
        +'<span class="arv">'+r.kogus+'</span>'
        +'<span class="arv">'+esc(raha(r.hind))+'</span>'
        +'<span class="arv rida-summa">'+esc(raha(r.kogus*r.hind))+'</span>'
        +'<span class="kes">'+esc(nameOf(r.kes))+'</span>'
        +'<span class="teod">'
        +  '<button class="linkbtn mut" data-act="edit-myyk" data-id="'+r.id+'">Muuda</button>'

        +'</span></div>').join("")
        +'<div class="trida kokku">'
        +'<span class="nim">Kokku — '+esc(valitud.nimi)+'</span>'
        +'<span class="arv">'+read.reduce((a,b)=>a+b.kogus,0)+'</span>'
        +'<span></span>'
        +'<span class="arv">'+esc(raha(summa(read)))+'</span>'
        +'<span></span><span></span></div>';
    }
    h+='</div>';
    if(valitud.orb){
      h+='<p class="meta">Nende ridade osa on kustutatud. Vajuta real „Muuda“ ja vali uus osa.</p>';
    }

  h+='<div class="tools" style="margin-top:2px">'

function vFiles(w){
  let h='<div class="files">';
  if(!S.files.length)h+='<div class="empty"><b>Faile ei ole.</b>Vajuta üleval paremal „Lisa fail“.</div>';
  else h+=S.files.slice().sort((a,b)=>new Date(b.at)-new Date(a.at)).map(f=>
    '<div class="file"><span class="kind">'+esc(ext(f.name).slice(0,4))+'</span>'
    +'<span class="n"><b>'+(uusFail(f)?'<span class="uus">UUS</span>':"")+esc(f.name)+'</b><span>'+(f.note?esc(f.note)+" · ":"")+esc(fmtSize(f.size))
    +' · lisas '+esc(first(nameOf(f.by)))+' '+esc(fmtStamp(f.at))+'</span></span>'
    +(f.data?'<button class="btn ghost small" data-act="dl" data-id="'+f.id+'">Laadi alla</button>':"")
    +'<button class="linkbtn mut" data-act="del" data-kind="files" data-id="'+f.id+'">Kustuta</button></div>').join("");
  h+='</div><button class="btn ghost" data-act="pick" style="align-self:flex-start">Vali failid arvutist</button>';
  w.innerHTML=h;
}
function pickFiles(){
  const i=document.createElement("input");i.type="file";i.multiple=true;
  i.addEventListener("change",()=>addFiles(i.files));i.click();
}
function addFiles(list){
  const fs=Array.from(list||{});if(!fs.length)return;
  let left=fs.length;
  fs.forEach(f=>{
    const rec={id:uid(),name:f.name,size:f.size,by:meId(),at:new Date().toISOString(),note:"",data:null};
    S.files.push(rec);
    if(f.size<=400*1024){const r=new FileReader();r.onload=()=>{rec.data=r.result;done();};r.onerror=done;r.readAsDataURL(f);}
    else done();
    function done(){if(--left===0){save();render();toast(fs.length+" fail"+(fs.length>1?"i":"")+" lisatud.");}}
  });
}

/* ═══ dialoog ═══ */
function dlg(title,body,ok,fn,hideCancel){
  $("#dlg-title").textContent=title;
  $("#dlg-bd").innerHTML=body;
  /* Kellavalik pakuks vaikimisi iga minutit. Kümme minutit korraga teeb
     nimekirja lühikeseks: 10, 20, 30 ... */

  $("#dlg-ok").textContent=ok||"Salvesta";
  $(".dlg-ft [data-act=close]").style.display=hideCancel?"none":"";
  onOk=fn;
  $("#scrim").classList.add("open");$("#dlg").classList.add("open");
  setTimeout(()=>{const f=$("#dlg-bd").querySelector("input,textarea");if(f)f.focus();},120);
}
function closeDlg(){$("#scrim").classList.remove("open");$("#dlg").classList.remove("open");onOk=null;}
const fv=n=>{const e=document.getElementById(n);return e?e.value.trim():"";};
const fc=n=>{const e=document.getElementById(n);return e?e.checked:false;};
function fld(id,l,v,t,h){return '<div class="field"><label for="'+id+'">'+esc(l)+'</label><input type="'+(t||"text")+'" id="'+id+'" value="'+esc(v||"")+'">'+(h?'<span class="hint">'+esc(h)+'</span>':"")+'</div>';}
function tar(id,l,v,h){return '<div class="field"><label for="'+id+'">'+esc(l)+'</label><textarea id="'+id+'">'+esc(v||"")+'</textarea>'+(h?'<span class="hint">'+esc(h)+'</span>':"")+'</div>';}
function reqBox(on){return '<label class="check"><input type="checkbox" id="f_req"'+(on?" checked":"")+'><span><b>Küsi igalt liikmelt kinnitust</b><span>Iga liige peab vajutama „Olen tutvunud“. Näed nimeliselt, kes on lugenud ja kes mitte.</span></span></label>';}
const isoOf=(d,t)=>{const[y,mo,da]=(d||"").split("-").map(Number);const[h,mi]=(t||"00:00").split(":").map(Number);return y?new Date(y,mo-1,da,h||0,mi||0).toISOString():null;};
const parts=iso=>{if(!iso)return{d:"",t:""};const x=new Date(iso);return{d:x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()),t:pad(x.getHours())+":"+pad(x.getMinutes())};};

    +'<div class="two"><div class="field"><label for="f_date">Kuupäev</label><input type="date" id="f_date" value="'+(a.d||def.d)+'"></div>'
    +'<div class="two"><div class="field"><label for="f_t1">Algab</label>'
    +kellSelect("f_t1",a.t||"18:00","Algab")+'</div>'
    +'<div class="field"><label for="f_t2">Lõpeb</label>'
    +kellSelect("f_t2",b.t||"","Lõpeb")+'</div></div></div>'
    +fld("f_place","Koht",e?e.place:"","text","Kus täpselt kokku saadakse")
    +tar("f_desc","Kirjeldus",e?e.desc:"","Mida on vaja teada enne kohale tulekut")

/* Ametite nimekiri tuleb serverilt (/api/mina), et ekraan ja server ei
   räägiks eri asjadest. */
let AMETID=[];
const ametiNimi=id=>{const a=AMETID.find(x=>x.id===id);return a?a.nimi:(id||"liige");};

/* Ameti muutmine käib eraldi otspunktist: seal on kontroll, et ainult
   administraator tohib, ja kaitse, et maja ei jääks ilma administraatorita. */
function muudaAmet(m,amet){
  fetch("/api/liikmed",{method:"PATCH",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:m.id,nimi:m.name,roll:m.role,amet})})
    .then(r=>r.json()).then(v=>{
      if(v.viga){toast(v.viga);return;}
      m.amet=amet;
      save();render();
      toast(esc(m.name)+" amet on nüüd „"+ametiNimi(amet)+"“.");
    })
    .catch(()=>toast("Ameti muutmine ei õnnestunud. Kontrolli ühendust."));
}

/* ═══ Töötajad ═══
   Kolm asja ühes kohas: kes millal majas on (graafik), mis tööd igal nädalal
   korduvad (tööd) ja kes on ära (puhkused). Korduv töö on nädalapäevade
   loend, mitte kuupäevade loend — nii ei pea seda kunagi uuendama. */
/* Kummalgi majal on oma graafik. Vana salvestus oli ühetasandiline —
   see läheb tervikuna Kodulinna Maja alla. */
function graafikud(){
  const t=S.too||(S.too={graafik:{},tood:[],puhkused:[]});
  let g=t.graafik||{};
  if(!g.km&&!g.torn){g={km:g,torn:{}};t.graafik=g;}
  g.km=g.km||{}; g.torn=g.torn||{};
  return g;
}
const graafik=k=>graafikud()[k==="torn"?"torn":"km"];

/* Ühel päeval kaks vahetust, kummalgi algus ja lõpp. Vanemad kujud —
   „10:00–18:00“ tekstina või {h,o} — loetakse sisse ilma andmeid kaotamata. */
const parsAeg=t=>{
  const m=String(t||"").match(/(\d{1,2}[:.]\d{2})\s*[–\-—]\s*(\d{1,2}[:.]\d{2})/);
  if(m)return [m[1].replace(".",":"),m[2].replace(".",":")];
  const x=String(t||"").trim();
  return x?[x.replace(".",":"),""]:["",""];
};
function vahetus(v){
  if(!v)return {ha:"",hl:"",oa:"",ol:""};
  if(typeof v==="string"){const p=parsAeg(v);return {ha:p[0],hl:p[1],oa:"",ol:""};}
  if(v.ha!==undefined||v.oa!==undefined)
    return {ha:v.ha||"",hl:v.hl||"",oa:v.oa||"",ol:v.ol||""};
  const h=parsAeg(v.h),o=parsAeg(v.o);
  return {ha:h[0],hl:h[1],oa:o[0],ol:o[1]};
}
const aegTekst=(a,l)=>a?(l?a+"–"+l:a):"";
/* Päevas on üks tööaeg. Vanad kahe vahetusega kirjed loetakse kokku:
   varaseim algus ja hiliseim lõpp. */
const vahetusYks=v=>{
  const x=vahetus(v);
  const algused=[x.ha,x.oa].filter(Boolean).sort();
  const lopud=[x.hl,x.ol].filter(Boolean).sort();
  return {a:algused[0]||"", l:lopud[lopud.length-1]||""};
};
const vahetusi=v=>{const x=vahetusYks(v);const t=aegTekst(x.a,x.l);return t?[t]:[];};
const paevalTööl=(mid,i,koht)=>vahetusi((graafik(koht)[mid]||[])[i]).length>0;
/* Enda kohta käivat infot muudab igaüks ise. Teiste oma — tööaeg,
   puudumised, kontaktandmed — muudavad ülemus ja administraator. */
const tohinTeise=mid=>S.haldabTeisi===true||mid===meId();
const kuskiTööl=(mid,i)=>KOHAD.some(k=>paevalTööl(mid,i,k.id));
const tood=()=>(S.too&&S.too.tood)||[];
const puhkused=()=>(S.too&&S.too.puhkused)||[];
const DOW_P=["esmaspäev","teisipäev","kolmapäev","neljapäev","reede","laupäev","pühapäev"];
/* „Igal teisipäeval“, aga „igal reedel“ — reede ei käändu nagu teised.
   Ilma selleta seisis ekraanil „igal reedeal“. */
const DOW_AL=["esmaspäeval","teisipäeval","kolmapäeval","neljapäeval",
              "reedel","laupäeval","pühapäeval"];
const LIIGID=[{id:"puhkus",nimi:"Puhkus"},{id:"haigus",nimi:"Haigusleht"},{id:"vaba",nimi:"Vaba päev"}];
const liigiNimi=x=>(LIIGID.find(l=>l.id===x)||{nimi:"Ära"}).nimi;

/* Kas see inimene on sel kuupäeval ära? */
const araPaeval=(kes,k)=>puhkused().find(p=>p.kes===kes&&p.algus<=k&&p.lopp>=k);
/* Selle nädalapäeva korduvad tööd. */
/* Töö on kas korduv (nädalapäevade loend) või ühekordne (üks kuupäev).
   Korduvat ei pea kunagi uuendama, ühekordne kaob ise minevikku. */
/* Vanas salvestuses oli üks kellaaeg. See on nüüd algus. Kellaaeg võib
   puududa: mõni töö tuleb lihtsalt päeva jooksul ära teha. */
const tooAlgus=t=>t.algus||t.kellaaeg||"";
/* Korduvat tööd tehakse iga kord uuesti, seega kinnitus käib kuupäeva
   kohta. Võti on päev, väärtus on tegija ja aeg. */
const tehtud=(t,k)=>(t.tehtud||{})[k]||null;
const vajabKinnitust=(t,k)=>!!t.kinnita&&!tehtud(t,k);
/* Kes on sel päeval selles majas graafikus. Puudujad jäävad välja —
   haiguslehel olev inimene ei ole see, kes lilled ära kastab. */
function toolPaeval(koht,d){
  const k=dkey(d), i=dowIdx(d);
  return S.members.filter(m=>paevalTööl(m.id,i,koht)&&!araPaeval(m.id,k));
}

/* Kas see töö langeb sellele päevale? „ara“ on nimekiri üksikutest
   päevadest, mis on korduvast tööst välja jäetud — nii saab ühe korra
   ära kustutada, ilma et kogu kordumine kaoks. */
const araJaetud=(t,k)=>!!(t.ara||{})[k];
const tooSelPaeval=(t,d)=>{
  const k=dkey(d);
  if(araJaetud(t,k))return false;
  /* Korduv töö algab sellest päevast, mil ta kirja pandi. Ilma selleta
     ilmus täna tehtud töö ka igasse möödunud kolmapäeva „tegemata“
     tööna ja ootas kinnitust asjade eest, mida keegi teinud ei ole. */
  if(t.algab&&k<t.algab)return false;
  return t.kuup?t.kuup===k:(t.paevad||[]).indexOf(dowIdx(d))>=0;
};
const tooAeg=t=>aegTekst(tooAlgus(t),t.lopp||"");
const eesnimi=x=>String(x||"").trim().split(/\s+/)[0]||"";

const tooPaeval=d=>tood().filter(t=>tooSelPaeval(t,d))
  /* Kellaajata töö on „päeva jooksul“ ja käib ajaga tööde ette. */
  .sort((a,b)=>(tooAlgus(a)||"00:00").localeCompare(tooAlgus(b)||"00:00"));

/* Nädala esmaspäev. */
/* Nädal järgib valitud päeva: kui vaatad laupäeva, on laual selle
   laupäeva nädal, mitte käesolev. */
function nadalaAlgus(nihe){
  if(kalPaev){
    const v=new Date(kalPaev+"T12:00:00"); v.setHours(0,0,0,0);
    v.setDate(v.getDate()-dowIdx(v)+(nihe||0)*7);
    return v;
  }
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-dowIdx(d)+(nihe||0)*7);
  return d;
}

/* Pilt on ruut; kui seda pole või ta ei avane, jäävad alla initsiaalid. */
const initsiaalid=nimi=>nimi.trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();
function avaHtml(m,suur){
  return '<span class="ava'+(suur?" suur":"")+'">'
    +'<span class="init">'+esc(initsiaalid(m.name||"?"))+'</span>'
    +(m.pilt?'<img src="'+esc(m.pilt)+'" alt="">':"")+'</span>';
}

function vToo(w){
  const alg=nadalaAlgus(nadalaNihe);
  const tana=dkey(new Date());
  const paevad=[];
  for(let i=0;i<7;i++){const d=new Date(alg);d.setDate(alg.getDate()+i);paevad.push(d);}
  const tIdx=dowIdx(new Date());

  /* Kõige üleval on see päev, mida parasjagu vaadatakse: kes on majas,
     kes on ära, mis sel päeval toimub. Sama plokk on ka Kalendris ja
     mõlemad näitavad sama valitud päeva. */
  let h=paevaPlokk(valitudPaevOn());

  /* Üks tabel korraga, maja valik peal — sama muster mis Kalendris. */
  const g2=graafik(graKoht);
  h+='<div class="osad">'
    + KOHAD.map(k=>{
        const mitu2=S.members.filter(m=>(graafik(k.id)[m.id]||[])
          .some(v=>vahetusi(v).length)).length;
        return '<button data-act="gra-koht" data-v="'+k.id+'" aria-pressed="'+(graKoht===k.id)+'">'
          +esc(k.nimi)+'<span class="n">'+mitu2+'</span></button>';
      }).join("")
    +'</div>'
    +'<div class="card"><div class="kalpais"><p class="h3">'
    +(graIsik?esc((byId(graIsik)||{name:"?"}).name):"NÄDAL")+'</p>'
    +'<span class="kuunimi">'+paevad[0].getDate()+'. '+MON[paevad[0].getMonth()]
    +  ' – '+paevad[6].getDate()+'. '+MON[paevad[6].getMonth()]+'</span>'
    +'<button class="btn ghost small" data-act="nadal" data-v="-1">‹</button>'
    +'<button class="btn ghost small" data-act="nadal" data-v="0">Täna</button>'
    +'<button class="btn ghost small" data-act="nadal" data-v="1">›</button>'
    +(graIsik?'<span class="sp"></span>'
      +(tohinTeise(graIsik)
        ? '<button class="btn ghost small" data-act="graafik" data-id="'+graIsik+'"'
          +' data-koht="'+graKoht+'">Muuda kogu nädalat</button>' : "")
      +'<button class="btn ghost small" data-act="gra-koik">Kõik inimesed</button>':"")
    +'</div>'
    +'<div class="gtabel"><div class="grida gpais"><span>Inimene</span>'
    /* Kuupäev on nupp: klõps toob selle päeva info üles. */
    + paevad.map((d,i)=>{
        const k=dkey(d);
        return '<button class="paevpais'+(k===tana?" tana":"")
          +(k===valitudPaevOn()?" valitud":"")+'" data-act="kal-paev" data-k="'+k+'"'
          +' aria-pressed="'+(k===valitudPaevOn())+'">'+DOW_S[i]
          +'<i>'+d.getDate()+'.'+(d.getMonth()+1)+'</i></button>';
      }).join("")
    +'</div>'
    + (graIsik?S.members.filter(m=>m.id===graIsik):S.members).map(m=>{
        const r=g2[m.id]||[];
        const tohin=tohinTeise(m.id);
        /* Nimi avab selle inimese enda graafiku — seda saavad vaadata
           kõik. Muutmine käib lahtritest ja nupust „Muuda kogu nädalat“
           ning seal kehtib õigus edasi. */
        return '<div class="grida">'
          +'<button class="gnimi" data-act="gra-isik" data-id="'+m.id+'"'
          +' aria-label="'+esc(m.name+" — ainult tema graafik")+'">'
          +'<span class="isik">'+avaHtml(m)+esc(m.name)+'</span></button>'
          + paevad.map((d,i)=>{
              const k=dkey(d), ara=araPaeval(m.id,k);
              const silt=esc(m.name+", "+DOW_P[i]+" "+d.getDate()+"."+(d.getMonth()+1)+" — ");
              if(ara){
                /* Ka puudumise lahter avab sama akna — üks koht, kust
                   inimese päeva vaadata ja muuta. */
                const t=esc(liigiNimi(ara.liik));
                return tohin
                  ? '<button class="lahter ara" data-act="graafik-paev"'
                    +' data-id="'+m.id+'" data-koht="'+graKoht+'" data-i="'+i+'"'
                    +' data-kuup="'+k+'" aria-label="'+silt+t+'">'+t+'</button>'
                  : '<span class="lahter ara lukus">'+t+'</span>';
              }
              const v=vahetusi(r[i]);
              const sisu=v.length?v.map(x=>'<i>'+esc(x)+'</i>').join(""):"–";
              return tohin
                ? '<button class="lahter'+(v.length?"":" tyhi2")+'" data-act="graafik-paev"'
                  +' data-id="'+m.id+'" data-koht="'+graKoht+'" data-i="'+i+'" data-kuup="'+k+'"'
                  +' aria-label="'+silt+(v.length?esc(v.join(" ")):"tööaega ei ole")+'">'
                  +sisu+'</button>'
                : '<span class="lahter lukus'+(v.length?"":" tyhi2")+'">'+sisu+'</span>';
            }).join("")
          +'</div>';
      }).join("")
    +'</div>'
    +'<p class="meta">Vajuta ühel lahtril, et selle päeva tööaega muuta — või nimel, '
    +'et näha korraga tervet nädalat. Maja: „'+esc(kohaNimi(graKoht))+'“.'
    +(S.haldabTeisi?'':' Muuta saad oma ridu; teiste tööaega muudavad '
      +'ülemus ja administraator.')+'</p></div>';

  /* Ühe inimese vaates näitame ka teise maja rea — „kogu graafik“
     tähendab kõike, mitte ainult parajasti valitud maja. */
  if(graIsik){
    const teine=KOHAD.find(k=>k.id!==graKoht);
    const m=byId(graIsik);
    if(teine&&m){
      const r2=graafik(teine.id)[graIsik]||[];
      const onMidagi=r2.some(v=>vahetusi(v).length);
      h+='<div class="card"><p class="h3">'+esc(teine.nimi)+'</p>'
        +(onMidagi
          ? '<div class="gtabel"><div class="grida gpais"><span>Inimene</span>'
            + paevad.map((d,i)=>'<span'+(dkey(d)===tana?' class="tana"':'')+'>'+DOW_S[i]
                +'<i>'+d.getDate()+'.'+(d.getMonth()+1)+'</i></span>').join("")
            +'</div><div class="grida">'
            +'<span class="gnimi lukus"><span class="isik">'+avaHtml(m)+esc(m.name)+'</span></span>'
            + paevad.map((d,i)=>{
                const v=vahetusi(r2[i]);
                const k=dkey(d);
                return tohinTeise(graIsik)
                  ? '<button class="lahter'+(v.length?"":" tyhi2")+'" data-act="graafik-paev"'
                    +' data-id="'+graIsik+'" data-koht="'+teine.id+'" data-i="'+i+'"'
                    +' data-kuup="'+k+'">'
                    +(v.length?v.map(x=>'<i>'+esc(x)+'</i>').join(""):"–")+'</button>'
                  : '<span class="lahter lukus'+(v.length?"":" tyhi2")+'">'
                    +(v.length?v.map(x=>'<i>'+esc(x)+'</i>').join(""):"–")+'</span>';
              }).join("")
            +'</div></div>'
          : '<p class="tyhi">Selles majas ei ole tema graafikus midagi.</p>')
        +'</div>';
    }
  }

  /* Puudumiste eraldi nimekirja ei ole: nädalatabeli lahtris on juba
     kirjas „Puhkus“ või „Haigusleht“ ja klõps sellel avab sama akna,
     kust ta maha võtta saab. Päise all seisab, mitu puudumist tulemas
     on, nii et miski ei jää märkamata. */

  w.innerHTML=h;
}

/* Kalendrist avatuna on tähtis tegevus „tegin ära“, mitte muutmine. */
function dlgTooPaev(id,k){
  const t=tood().find(x=>x.id===id); if(!t)return;
  const teht=tehtud(t,k);
  const kell=tooAeg(t);
  dlg(t.nimi,
    '<div class="paevpais">'+esc(fmtPaev(k+"T12:00:00"))+'</div>'
    +'<p class="hint" style="margin:0"><b>'+esc(kohaNimi(kohtOf(t)))+'</b>'
    +  (kell?' · '+esc(kell):' · päeva jooksul')+'</p>'
    +(t.markus?'<p class="hint" style="margin:0">'+esc(t.markus)+'</p>':"")
    +(()=>{
        if(t.kes)return '<div class="teebriba"><span class="sild">Teeb</span>'
          +'<span class="isik">'+avaHtml(byId(t.kes)||{name:"?"})+esc(nameOf(t.kes))+'</span></div>';
        const d=new Date(k+"T12:00:00"), read=toolPaeval(kohtOf(t),d);
        return '<div class="teebriba"><span class="sild">Sel päeval on tööl</span>'
          +(read.length
            ? read.map(m=>'<span class="isik">'+avaHtml(m)+esc(m.name)
                +'<span class="kell2">'+esc(vahetusi((graafik(kohtOf(t))[m.id]||[])[dowIdx(d)]).join(" "))
                +'</span></span>').join("")
            : '<span class="tyhi">Graafikus ei ole sel päeval kedagi.</span>')
          +'</div>';
      })()
    +(t.kinnita
      ? '<div class="olekriba'+(teht?" on":"")+'">'
        +(teht?'<b>Tehtud</b><span>'+esc(nameOf(teht.kes))+' · '+esc(fmtKuup(teht.at))+'</span>'
              :'<b>Veel tegemata</b><span>Kui oled ära teinud, vajuta all „Tegin ära“.</span>')
        +'</div>'
      : '<p class="hint" style="margin:0">See töö ei vaja kinnitust.</p>')
    +'<div class="tools">'
    +  '<button type="button" class="btn ghost" data-act="too-muuda" data-id="'+t.id+'">Muuda tööd</button>'
    +  '<span class="sp"></span>'
    +  (t.kuup?"":'<button type="button" class="btn danger" data-act="too-ara" '
        +'data-id="'+t.id+'" data-k="'+k+'">Kustuta see päev</button>')
    +  '<button type="button" class="btn danger" data-act="too-kustuta" data-id="'+t.id+'">'
    +  (t.kuup?"Kustuta":"Kustuta kõik korrad")+'</button>'
    +'</div>',
    t.kinnita?(teht?"Võta kinnitus tagasi":"Tegin ära"):"Sulge",
    ()=>{
      if(!t.kinnita)return true;
      t.tehtud=t.tehtud||{};
      if(teht){delete t.tehtud[k];toast("Kinnitus võetud tagasi.");}
      else{t.tehtud[k]={kes:meId(),at:new Date().toISOString()};toast("Tubli — märgitud tehtuks.");}
      save();render();return true;
    }, !t.kinnita);
}

    +'<div class="two">'

    +  '<div class="field"><label for="f_tkes">Kes teeb</label><select id="f_tkes">'

    +(t?((()=>{const ara=Object.keys(t.ara||{});
          return ara.length?'<p class="hint" style="margin:0">'
            +mitu(ara.length,"kord on","korda on")+' eraldi ära jäetud. '
            +'<button type="button" class="linkbtn" data-act="too-taasta" data-id="'+t.id+'">'
            +'Too kõik tagasi</button></p>':"";})()
        +'<div class="tools"><button type="button" class="btn danger" data-act="too-kustuta" '
        +'data-id="'+t.id+'">Kustuta kõik korrad</button></div>'):""),
    t?"Salvesta":"Lisa töö",()=>{
      const nimi=fv("f_tnimi"); if(!nimi){toast("Töö nimi on täitmata.");return false;}
      const kordub=$('.lnupp[data-v="kordub"]').getAttribute("aria-pressed")==="true";
      const pv=Array.from(document.querySelectorAll('.pnupp[aria-pressed="true"]'))
                    .map(x=>Number(x.dataset.i));
      const kp=fv("f_tkuup");
      if(kordub&&!pv.length){toast("Vali vähemalt üks päev.");return false;}
      if(!kordub&&!kp){toast("Kuupäev on täitmata.");return false;}
      const kell=fv("f_tkell"), lopp=fv("f_tlopp");
      if(kell&&lopp&&lopp<=kell){toast("Lõpp peab olema algusest hiljem.");return false;}
      const d={nimi,algus:kell,lopp:kell?lopp:"",kellaaeg:kell,
               kinnita:fc("f_tkinn"),koht:fv("f_koht"),
               paevad:kordub?pv:[], kuup:kordub?"":kp,
               kes:document.getElementById("f_tkes").value,markus:fv("f_tmark")};
      if(t)Object.assign(t,d); else S.too.tood.push(Object.assign({id:uid()},d));
      save();render();toast("Salvestatud.");return true;
    });
}

/* Üks lahter, kõik variandid. Inimese päev on kas tööpäev ühes majas
   või ta ei ole tööl — puhkus, haigusleht, vaba päev või muu. Enne olid
   need kahes eri kohas ja tööaja lahtrist ei saanud puhkust kirja panna.

   Puudumine käib kuupäevade, mitte nädalapäeva järgi: puhkus on kindlate
   päevade vahemik, tööaeg kordub igal nädalal. Seepärast küsime puudumise
   puhul ka lõppkuupäeva. */
/* Nimed vastavad küsimusele „Mis sel päeval on?“ — seepärast „Töö“,
   mitte „Tööl“. „Mis sel päeval on: Tööl“ ei ole eesti keel. */
const PAEVA_LIIGID = [
  { id: "too",     nimi: "Töö" },
  { id: "puhkus",  nimi: "Puhkus" },
  { id: "haigus",  nimi: "Haigusleht" },
  { id: "vaba",    nimi: "Vaba päev" },
  { id: "muu",     nimi: "Muu" }
];

function dlgGraafikPaev(mid,koht,i,kuup){
  /* Ilma inimeseta avatakse aken ülevalt „Lisa“ nupust: siis küsime ka,
     kelle ja mis päeva kohta kirje käib. Lahtrist avades on need juba
     teada ja neid ei küsita üle. */
  const vaba=!mid;
  if(vaba){
    mid=meId();
    kuup=kuup||dkey(new Date());
    i=dowIdx(new Date(kuup+"T12:00:00"));
  }
  const m=byId(mid); if(!m)return;
  const olemasAra=araPaeval(mid,kuup);
  /* „Muu“ hoiame andmebaasi „vaba“ all, aga märkusega — nii ei pea
     andmebaasi iga uue põhjuse jaoks muutma. */
  const algneLiik=olemasAra
    ? (olemasAra.liik==="vaba"&&/^Muu/.test(olemasAra.markus||"")?"muu":olemasAra.liik)
    : "too";
  const v=vahetusYks((graafik(koht)[mid]||[])[i]);

  dlg(vaba?"Lisa graafikusse":"Päev — "+m.name,
    (vaba
      ? '<div class="two">'
        +'<div class="field"><label for="f_kes2">Kes</label><select id="f_kes2">'
        + S.members.filter(x=>tohinTeise(x.id))
            .map(x=>'<option value="'+x.id+'"'+(x.id===mid?" selected":"")+'>'
              +esc(x.name)+'</option>').join("")
        +'</select></div>'
        +'<div class="field"><label for="f_kuup2">Päev</label>'
        +'<input type="date" id="f_kuup2" value="'+esc(kuup)+'"></div></div>'
        +(S.haldabTeisi?"":'<span class="hint">Teiste kohta saavad kirja panna '
          +'ülemus ja administraator.</span>')
      : '<div class="paevpais">'+esc(fmtPaev(kuup+"T12:00:00"))+'</div>')
    +'<div class="field"><label>Mis sel päeval on</label><div class="pvalik">'
    + PAEVA_LIIGID.map(l=>'<button type="button" class="lnupp" data-act="paev-liik"'
        +' data-v="'+l.id+'" aria-pressed="'+(l.id===algneLiik?"true":"false")+'">'
        +esc(l.nimi)+'</button>').join("")
    +'</div><input type="hidden" id="f_liik" value="'+esc(algneLiik)+'"></div>'

    /* Tööl: kummas majas ja mis kellast. Kehtib igal sellel nädalapäeval. */
    +'<div id="ala_too">'
    +  '<div class="field"><label>Kummas majas</label><div class="pvalik">'
    +  KOHAD.map(x=>'<button type="button" class="lnupp" data-act="paev-koht"'
        +' data-v="'+x.id+'" aria-pressed="'+(x.id===koht?"true":"false")+'">'
        +esc(x.nimi)+'</button>').join("")
    +  '</div><input type="hidden" id="f_koht" value="'+esc(koht)+'"></div>'
    +  '<div class="two">'
    +    '<div class="field"><label for="f_pa">Tööpäev algab</label>'
    +    kellSelect("f_pa",v.a,"Tööpäev algab","ei ole tööl")+'</div>'
    +    '<div class="field"><label for="f_pl">Lõpeb</label>'
    +    kellSelect("f_pl",v.l,"Tööpäev lõpeb","lahtine")+'</div>'
    +  '</div>'
    +  '<span class="hint">See tööaeg kordub igal '+esc(DOW_AL[i])+'. '
    +  'Kui valid alguseks „ei ole tööl“, võetakse tööaeg graafikust ära.</span>'
    +'</div>'

    /* Puudumine: kuupäevade vahemik ja märkus. */
    +'<div id="ala_ara" hidden>'
    +  '<div class="two">'
    +    '<div class="field"><label for="f_aalg">Alates</label>'
    +    '<input type="date" id="f_aalg" value="'+esc(olemasAra?olemasAra.algus:kuup)+'"></div>'
    +    '<div class="field"><label for="f_alopp">Kuni</label>'
    +    '<input type="date" id="f_alopp" value="'+esc(olemasAra?olemasAra.lopp:kuup)+'"></div>'
    +  '</div>'
    +  '<span class="hint">Ühe päeva puhul jäta mõlemad samaks.</span>'
    /* Kellaaeg on „muu“ päeva juures: koolitus või arsti juures ei võta
       tervet päeva. Ilma kellaajata tähendab tervet päeva. */
    +  '<div id="ala_kell"'+(algneLiik==="muu"?"":" hidden")+'>'
    +    '<div class="two">'
    +      '<div class="field"><label for="f_akell1">Kellast</label>'
    +      kellSelect("f_akell1",olemasAra?olemasAra.kellast:"","Kellast")+'</div>'
    +      '<div class="field"><label for="f_akell2">Kellani</label>'
    +      kellSelect("f_akell2",olemasAra?olemasAra.kellani:"","Kellani")+'</div>'
    +    '</div>'
    +    '<span class="hint">Jäta tühjaks, kui see võtab terve päeva.</span>'
    +  '</div>'
    +  fld("f_amark","Märkus",olemasAra?String(olemasAra.markus||"").replace(/^Muu: ?/,""):"",
        "text","Ei ole kohustuslik")
    +'</div>'
    +(olemasAra?'<div class="tools"><button type="button" class="btn danger"'
      +' data-act="paev-ara-kustuta" data-id="'+olemasAra.id+'">Võta puudumine maha</button></div>':""),
    "Salvesta",()=>{
      const liik=fv("f_liik");
      if(vaba){
        mid=fv("f_kes2")||mid;
        const uusKuup=fv("f_kuup2");
        if(!uusKuup){toast("Vali päev.");return false;}
        kuup=uusKuup;
        i=dowIdx(new Date(kuup+"T12:00:00"));
      }

      if(liik==="too"){
        /* Kui inimene oli sel päeval ära, siis tööle märkimine tähendab,
           et puudumine käib maha — muidu jääks kaks vastuolulist kirjet. */
        const ara2=araPaeval(mid,kuup);
        if(ara2)kustutaPuudumine(ara2.id);
        const uusKoht=fv("f_koht")||koht;
        const a=fv("f_pa"), l=a?fv("f_pl"):"";
        if(a&&l&&l<=a){toast("Lõpp peab olema algusest hiljem.");return false;}
        /* Maja vahetamisel võtame vana maja lahtri tühjaks. */
        for(const x of KOHAD){
          const g=graafik(x.id);
          const r=(g[mid]||[]).slice();
          while(r.length<7)r.push({});
          if(x.id===uusKoht)r[i]={ha:a,hl:l};
          else if(vahetusi(r[i]).length)r[i]={};
          g[mid]=r;
        }
        save();render();
        toast(a?"Tööaeg salvestatud — "+kohaNimi(uusKoht):"Tööaeg kustutatud.");
        return true;
      }

      const alg=fv("f_aalg"), lopp=fv("f_alopp");
      if(!alg||!lopp){toast("Kuupäevad on täitmata.");return false;}
      if(lopp<alg){toast("Lõpp ei saa olla enne algust.");return false;}
      const markus=fv("f_amark").trim();
      /* Kellaaeg käib ainult „muu“ juurde; lõpp ilma alguseta ei tähenda
         midagi. */
      const kellast=liik==="muu"?fv("f_akell1"):"";
      const kellani=kellast?fv("f_akell2"):"";
      if(kellast&&kellani&&kellani<=kellast){
        toast("Lõpp peab olema algusest hiljem.");return false;}
      const p=puhkused();
      const vana2=araPaeval(mid,kuup);
      const kirje={
        id: vana2?vana2.id:uid(),
        kes: mid, algus: alg, lopp: lopp,
        liik: liik==="muu"?"vaba":liik,
        markus: liik==="muu"?("Muu"+(markus?": "+markus:"")):markus,
        kellast: kellast, kellani: kellani
      };
      kirje.kes=mid;
      const vana=p.findIndex(x=>x.id===kirje.id);
      if(vana>=0)p[vana]=kirje; else p.push(kirje);
      /* Puudumise päeval ei ole ta ka tööl — tööaeg jääb graafikusse
         alles, aga ekraan näitab neil päevadel puudumist. */
      save();render();
      toast(PAEVA_LIIGID.find(x=>x.id===liik).nimi+" salvestatud.");
      return true;
    });

  /* Alguses näitame õiget poolt. */
  naitaPaevaAla(algneLiik);
}

function naitaPaevaAla(liik){
  const too=document.getElementById("ala_too");
  const ara=document.getElementById("ala_ara");
  const kell=document.getElementById("ala_kell");
  if(!too||!ara)return;
  too.hidden=(liik!=="too");
  ara.hidden=(liik==="too");
  if(kell)kell.hidden=(liik!=="muu");
}

function kustutaPuudumine(id){
  const p=puhkused();
  const i=p.findIndex(x=>x.id===id);
  if(i>=0)p.splice(i,1);
}

function dlgGraafik(mid,koht){
  const m=byId(mid); if(!m)return;
  const g=graafik(koht);
  const r=(g[mid]||[]).slice();
  dlg("Tööaeg — "+m.name+" · "+kohaNimi(koht),
    '<p class="hint" style="margin:0">Vali algus ja lõpp. Jäta tühjaks, kui sel päeval '
    +'tööd ei ole. Vajuta väljal, et kellavalik avada.</p>'
    +'<div class="glist"><div class="grida2 gpais2"><span></span>'
    +'<span>Algab</span><span>Lõpeb</span></div>'
    + DOW_P.map((d,i)=>{const v=vahetusYks(r[i]);
        const inp=(id,val,silt)=>kellSelect(id+i,val,d+" "+silt);
        return '<div class="grida2"><label>'+esc(d)+'</label>'
          +inp("f_ha",v.a,"algab")+inp("f_hl",v.l,"lõpeb")
          +'</div>';}).join("")
    +'</div>',
    "Salvesta",()=>{
      const uued=[];
      for(let i=0;i<7;i++){
        const x={ha:fv("f_ha"+i),hl:fv("f_hl"+i)};
        if(!x.ha)x.hl="";   /* lõpp ilma alguseta ei tähenda midagi */
        if(x.ha&&x.hl&&x.hl<=x.ha){
          toast(DOW_P[i].charAt(0).toUpperCase()+DOW_P[i].slice(1)
            +": lõpp peab olema algusest hiljem.");
          return false;
        }
        uued.push(x);
      }
      g[mid]=uued;
      save();render();toast("Tööaeg salvestatud.");return true;
    });
}

/* ═══ Hinnakiri ═══
   Nimekiri sellest, mida selles osas üldse müüakse. Kaks allikat: käsitsi
   pandud liigid ja kõik, mida on juba päriselt müüdud. Nii ei pea keegi
   midagi eraldi seadistama — nimekiri kasvab kasutamisest. */
const hinnaKiri=()=>Array.isArray(S.myyk.hinnad)?S.myyk.hinnad:(S.myyk.hinnad=[]);

function kiirValik(osaId){
  const m=new Map();
  hinnaKiri().filter(x=>x.osa===osaId).forEach(x=>
    m.set(x.nimetus.trim().toLowerCase(),
          {nimetus:x.nimetus,hind:(typeof x.hind==="number")?x.hind:null}));
  /* Päris müügid käivad üle: seal on hind kindlasti õige. */
  myygiRead().filter(x=>x.osa===osaId)
    .slice().sort((a,b)=>new Date(a.at)-new Date(b.at))
    .forEach(x=>m.set(x.nimetus.trim().toLowerCase(),{nimetus:x.nimetus,hind:x.hind}));
  return [...m.values()].sort((a,b)=>a.nimetus.localeCompare(b.nimetus,"et"));
}

/* Iga müük õpetab hinnakirja: uus nimetus lisandub, tuttava hind uueneb. */
function opiHind(osa,nimetus,hind){
  const k=hinnaKiri();
  const olemas=k.find(x=>x.osa===osa&&x.nimetus.trim().toLowerCase()===nimetus.trim().toLowerCase());
  if(olemas){olemas.nimetus=nimetus; olemas.hind=hind;}
  else k.push({id:uid(),osa,nimetus,hind});
}

function kiirHtml(osaId){
  const v=kiirValik(osaId);
  if(!v.length)return '<span class="hint">Selles osas ei ole veel ühtegi nimetust. Kirjuta esimene ise.</span>';
  return '<div class="kiirvalik">'
    +v.map(x=>{
      const m=(typeof x.hind==="number");
      return '<button type="button" data-act="kiir" data-nim="'+esc(x.nimetus)+'"'
        +(m?' data-h="'+x.hind.toFixed(2).replace(".",",")+'"':"")+'>'
        +esc(x.nimetus)
        +(!m   ?'<span class="h uus2">hind puudub</span>'
         :x.hind===0?'<span class="h tasuta">tasuta</span>'
         :          '<span class="h">'+esc(raha(x.hind))+'</span>')
        +'</button>';}).join("")
    +'</div>';
}

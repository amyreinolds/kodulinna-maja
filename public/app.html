<script>
"use strict";

const KEY="ring.v1", SET="ring.seaded";
const NIMI="Kodulinna Maja";
/* Aruanne läheb majast välja, seepärast käib sinna ka ametlik nimi ja
   registrikood. Neid saab Seadetes muuta. */
const AMETLIK="MTÜ Tallinna Noorte Klubi Kodulinn";
const REGKOOD="80080125";
/* Maja avalik info elab Seadetes, mitte tavalise infoploki sees — nii on
   ta üks kord kirjas ja igal pool sama. */
const VAIKE_LAHTI="Kodulinna Maja: E–R 10.00–18.00, L 10.00–15.00, P suletud\n"
  +"Torn: E–R 10.00–18.00, L–P 11.00–17.00\n"
  +"Riigipühadel suletud";   /* fikseeritud rakenduse nimi */

/* Müügi vaikeosad. Versioon tõuseb, kui see nimekiri muutub — nii saavad
   ka need, kellel on juba sisu salvestatud, uue nimekirja kätte. Ridu ei
   kustutata kunagi: kadunud osa read koonduvad „Ilma osata“ alla. */
const MYYK_V=5;
const VAIKE_OSAD=[
  {id:"o1",nimi:"Raamatud"},
  {id:"o2",nimi:"Postkaardid"},
  {id:"o3",nimi:"Piletid Üritused"},
  {id:"o6",nimi:"Piletid KM"},
  {id:"o7",nimi:"Piletid Torn"},
  {id:"o4",nimi:"Uma Mekk"},
  {id:"o5",nimi:"Täika"}
];
const vaikeOsad=()=>VAIKE_OSAD.map(o=>({id:o.id,nimi:o.nimi}));

/* Piletiliigid, mis Eesti majas alati korduvad.
   hind null = veel määramata; hind 0 = päriselt tasuta. Need kaks ei ole
   sama asi: tasuta pilet tuleb ikka ära lugeda, ta lihtsalt ei too raha. */
/* Kaks maja. Kõik, mis kalendrisse läheb, kuulub ühele neist. */
const KOHAD=[{id:"km",nimi:"Kodulinna Maja"},{id:"torn",nimi:"Torn"}];
/* Kalendris on ka „Kõik“, et ükski üritus ei jääks kogemata peitu. */
const KAL_KOHAD=[{id:"koik",nimi:"Kõik"}].concat(KOHAD);
const sobibKoht=(x,valik)=>valik==="koik"||kohtOf(x)===valik;
const kohaNimi=k=>(KOHAD.find(x=>x.id===k)||KOHAD[0]).nimi;
const kohtOf=x=>(x&&x.koht==="torn")?"torn":"km";

const PILETIOSAD=["o3","o6","o7"];
const PILETILIIGID=["Täispilet","Sooduspilet","Pensionär","Õpilane","Perepilet"];
const TASUTA=["Tasuta pilet"];
/* Tornis käib osa külastajaid Tallinna kaardiga — pilet on neile tasuta. */
const OSA_LIIGID={o7:[{nimi:"Tallinna kaart",tasuta:true}]};
const vaikeHinnad=()=>{
  const out=[];
  PILETIOSAD.forEach(o=>{
    PILETILIIGID.forEach(nimi=>out.push({id:uid(),osa:o,nimetus:nimi,hind:null}));
    TASUTA.forEach(nimi=>out.push({id:uid(),osa:o,nimetus:nimi,hind:0}));
    (OSA_LIIGID[o]||[]).forEach(x=>
      out.push({id:uid(),osa:o,nimetus:x.nimi,hind:x.tasuta?0:null}));
  });
  return out;
};
const HINNAD_V=2;
const MON=["jaanuar","veebruar","märts","aprill","mai","juuni","juuli","august","september","oktoober","november","detsember"];
const DOW_S=["E","T","K","N","R","L","P"];
const DOW_L=["esmaspäev","teisipäev","kolmapäev","neljapäev","reede","laupäev","pühapäev"];
const SUURUSED=[
  {id:"tavaline", nimi:"tavaline",  z:1,    a:17},
  {id:"suur",     nimi:"suur",      z:1.15, a:21},
  {id:"suurem",   nimi:"väga suur", z:1.32, a:26}
];
const ZOOM=Object.fromEntries(SUURUSED.map(x=>[x.id,x.z]));
const TEEMAD=[
  {id:"hele", nimi:"Hele", selgitus:"sinine taust, valged kaardid"},
  {id:"tume", nimi:"Tume", selgitus:"soe must, oranž aktsent"}
];

const P={
  chat:'<path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-4-.9L3 21l1.9-4.6A8.4 8.4 0 013 11.5a8.4 8.4 0 019-8.4 8.4 8.4 0 019 8.4z"/>',
  event:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M16 3v4M8 3v4M3 11h18M8 15h3"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M16 3v4M8 3v4M3 11h18"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11.5v5M12 8h.01"/>',
  people:'<path d="M16 20v-1.5A3.5 3.5 0 0012.5 15h-5A3.5 3.5 0 004 18.5V20"/><circle cx="10" cy="8" r="3.4"/><path d="M20 20v-1.5a3.5 3.5 0 00-2.6-3.4"/><path d="M15.4 4.6a3.4 3.4 0 010 6.6"/>',
  file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  done:'<circle cx="12" cy="12" r="9"/><path d="M8.4 12.2l2.5 2.5 4.7-4.9"/>',
  open:'<circle cx="12" cy="12" r="9"/>',
  ask:'<path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-4-.9L3 21l1.9-4.6A8.4 8.4 0 013 11.5a8.4 8.4 0 019-8.4 8.4 8.4 0 019 8.4z"/><path d="M9.8 9.6a2.3 2.3 0 014.4.8c0 1.5-2.2 2-2.2 2M12 15.4h.01"/>',
  sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2M12 19.6v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.4 12h2M19.6 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 016.5 3H12v16.5H6.5A2.5 2.5 0 004 22z"/><path d="M20 5.5A2.5 2.5 0 0017.5 3H12v16.5h5.5A2.5 2.5 0 0120 22z"/>',
  back:'<path d="M15 19l-7-7 7-7"/>',
  tag:'<path d="M20.6 13.4L13.4 20.6a2 2 0 01-2.8 0l-7.2-7.2A2 2 0 013 12V4.8A1.8 1.8 0 014.8 3H12a2 2 0 011.4.6l7.2 7.2a2 2 0 010 2.6z"/><path d="M7.5 7.5h.01"/>',
  bell:'<path d="M18 9a6 6 0 10-12 0c0 5-2.2 6.6-2.2 6.6h16.4S18 14 18 9z"/><path d="M13.7 19.5a2 2 0 01-3.4 0"/>',
  kell:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.4 2"/>',
  kaamera:'<path d="M3 8.5A2 2 0 015 6.5h2.2l1.2-2h7.2l1.2 2H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3.6"/>'
};
function ico(n){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>';}

const VIEWS=[
  {id:"vestlus",  label:"Vestlus",   icon:"chat",   add:"Uus teema",
   help:"Ülemine osa on teemad, mida näevad kõik. Alumine osa on kirjad, mida näete ainult teie kahekesi."},
  {id:"yritused", label:"Üritused",  icon:"event",  add:"Uus üritus",
   help:"Vajuta „Osalen“ või „Ei osale“. Kui üritus küsib kinnitust, vajuta ka „Olen tutvunud“. Küsimusi saab küsida iga ürituse all."},
  {id:"kalender", label:"Kalender",  icon:"cal",    add:"Uus üritus",
   help:"Kõik üritused ja tööd kuu kaupa. Üleval saab valida ühe maja. Korduv töö on katkendjoonega ja kordub igal nädalal."},
  {id:"info",     label:"Üldinfo",   icon:"info",   add:"Uus infoplokk",
   help:"Tähtis info kõigile liikmetele. Kui plokk küsib kinnitust, loe läbi ja vajuta „Olen tutvunud“."},
  {id:"failid",   label:"Failid",    icon:"file",   add:"Lisa fail",
   help:"Dokumendid, mida teistel vaja läheb. Iga liige saab faile lisada ja kustutada."},
  {id:"myyk",     label:"Müük",      icon:"tag",    add:"Lisa müük",
   help:"Vajuta toote nimel, et näha selle enda statistikat. Müüja nimel vajutades avaneb tema kalender — vajuta kuupäeval ja näed, mida ta sel päeval müüs.",
   help2:"Siin on sinu enda müük. Kogu maja kokkuvõtet näevad administraatorid."},
  {id:"tootajad", label:"Töö graafik", icon:"kell", add:"Lisa",
   help:"Kes millal majas on ja kes on puhkusel. Puhkuse lisad alt, tööd näed Kalendris."},
  {id:"kontakt",  label:"Kontaktid", icon:"people", add:"Uus liige",
   help:"Vajuta numbril, et see kopeerida. Vajuta nimel, et näha tema müüki."}
];

/* ═══ abifunktsioonid ═══ */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dowIdx=d=>(d.getDay()+6)%7;
const first=n=>String(n||"").split(" ")[0];

function fmtLong(iso){const d=new Date(iso);return DOW_L[dowIdx(d)]+", "+d.getDate()+". "+MON[d.getMonth()];}
function fmtTime(iso){const d=new Date(iso);return pad(d.getHours())+":"+pad(d.getMinutes());}
function fmtStamp(iso){
  const d=new Date(iso),days=Math.round((new Date(dkey(new Date()))-new Date(dkey(d)))/86400000);
  if(days===0)return "täna kell "+fmtTime(iso);
  if(days===1)return "eile kell "+fmtTime(iso);
  if(days>1&&days<7)return DOW_L[dowIdx(d)]+" kell "+fmtTime(iso);
  return d.getDate()+". "+MON[d.getMonth()]+" kell "+fmtTime(iso);
}
/* Müügiajaloos peab seisma kuupäev, mitte „täna“ — arvestus vajab täpsust. */
function fmtPaev(iso){
  const d=new Date(iso);
  return DOW_L[dowIdx(d)]+", "+d.getDate()+". "+MON[d.getMonth()]+" "+d.getFullYear();
}
function fmtKuup(iso){
  const d=new Date(iso);
  return d.getDate()+". "+MON[d.getMonth()]+" "+d.getFullYear()+" kell "+fmtTime(iso);
}
function relDay(iso){
  const n=Math.round((new Date(dkey(new Date(iso)))-new Date(dkey(new Date())))/86400000);
  if(n===0)return "täna";if(n===1)return "homme";if(n===-1)return "eile";
  if(n>1&&n<21)return n+" päeva pärast";
  if(n<-1)return Math.abs(n)+" päeva tagasi";
  return "";
}
function fmtSize(b){if(b==null)return "";if(b<1024)return b+" B";if(b<1048576)return Math.round(b/1024)+" KB";return (b/1048576).toFixed(1)+" MB";}
const ext=n=>{const m=String(n).match(/\.([a-z0-9]{1,5})$/i);return m?m[1].toUpperCase():"FAIL";};
function mdLite(t){
  let o="",ul=false;
  for(const raw of String(t||"").split("\n")){
    const l=raw.trim();
    if(l.startsWith("- ")){if(!ul){o+="<ul>";ul=true;}o+="<li>"+inl(l.slice(2))+"</li>";}
    else{if(ul){o+="</ul>";ul=false;}if(l)o+="<p>"+inl(l)+"</p>";}
  }
  if(ul)o+="</ul>";
  return o||"<p></p>";
  function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");}
}
const names=ids=>ids.map(nameOf).join(", ");
const dmKey=(a,b)=>[a,b].sort().join("|");

/* ═══ olek ═══ */
let S=null, view="vestlus", chat=null, calMonth=null, onOk=null, lastView=null;
let seaded={teema:"hele", suurus:"tavaline"};
const opened=new Set();

/* ── Mis on uus?
   S.seen[minu id][võti] = millal ma seda kohta viimati vaatasin.
   „snap“ hoiab selle vana väärtuse alles seni, kuni ma sellel lehel olen —
   muidu kaoksid UUS-sildid samal hetkel, kui ma need avan. */
let snap={};
/* „__baas“ on lähtejoon: millest alates üldse midagi uueks lugeda.
   Nii ei pea iga teema ja kirjavahetuse jaoks eraldi kirjet tegema —
   see, millel oma kirjet ei ole, langeb lähtejoonele tagasi. */
const baas=()=>({__baas:new Date().toISOString()});
function seenMap(){ S.seen=S.seen||{}; S.seen[S.me]=S.seen[S.me]||baas(); return S.seen[S.me]; }
/* NB: hetktõmmis peab hoidma ka tagasilangust lähtejoonele. Kui salvestada
   lihtsalt m[k] ja see on olemata, ei saa hiljem eristada „tõmmist pole“
   ja „tõmmis on olematu“ — ja lugemata piir jääb joonistamata. */
function since(k){
  if(k in snap)return snap[k];
  const m=seenMap();
  return m[k]!==undefined?m[k]:m.__baas;
}
/* Märgib kogu senise sisu loetuks. Kinnitust ootavad asjad EI kao —
   need ei ole „loetud/lugemata“ küsimus, vaid tegemata töö. */
function margiKoikLoetuks(){
  S.seen[S.me]=baas();
  snap={};
}
function markSeen(k){
  const m=seenMap();
  if(!(k in snap))snap[k]=(m[k]!==undefined?m[k]:m.__baas);
  m[k]=new Date().toISOString();
}
function uus(iso,k,by){
  if(by===S.me)return false;
  const s=since(k);
  if(!s)return true;
  return new Date(iso)>new Date(s);
}
/* uued sõnumid ühes teemas või kirjavahetuses */
const uusThread=t=>t.messages.filter(m=>uus(m.at,"thread:"+t.id,m.by)).length;
function uusDm(other){
  const d=S.dms[dmKey(S.me,other)];
  return d?d.messages.filter(m=>uus(m.at,"dm:"+dmKey(S.me,other),m.by)).length:0;
}
const uusEv=e=>uus(e.at||e.start,"view:yritused",e.by);
const uusKomm=e=>(e.comments||[]).filter(c=>uus(c.at,"view:yritused",c.by)).length;
const uusInfo=i=>uus(i.at,"view:info",i.by);
const uusFail=f=>uus(f.at,"view:failid",f.by);
const uusMyyk=r=>uus(r.at,"view:myyk",r.kes);
const ootabKinnitust=()=>
  S.events.filter(e=>e.req&&new Date(e.start)>=new Date()&&!(e.acks||{})[S.me]).length
 +S.info.filter(i=>i.req&&!(i.acks||{})[S.me]).length;

/* Eesti keeles läheb üks ainsusesse: „1 uus kiri“, aga „2 uut kirja“. */
const mitu=(n,ains,mitm)=>n+" "+(n===1?ains:mitm);

/* Kõik, mis sind ootab — üks nimekiri, tavalises keeles. */
function uudised(){
  const out=[];
  S.threads.forEach(t=>{const n=uusThread(t);if(n)out.push({
    n, tekst:mitu(n,"uus sõnum","uut sõnumit")+" teemas „"+t.title+"“",
    mine:()=>{view="vestlus";chat={type:"teema",id:t.id};snap={};markSeen("thread:"+t.id);}});});
  S.members.filter(m=>m.id!==S.me).forEach(m=>{const n=uusDm(m.id);if(n)out.push({
    n, tekst:mitu(n,"uus kiri","uut kirja")+" — "+m.name,
    mine:()=>{view="vestlus";chat={type:"kiri",id:m.id};snap={};markSeen("dm:"+dmKey(S.me,m.id));}});});
  S.events.forEach(e=>{
    if(uusEv(e))out.push({n:1,tekst:"Uus üritus: „"+e.title+"“",mine:()=>mineVaade("yritused")});
    const k=uusKomm(e);
    if(k)out.push({n:k,tekst:mitu(k,"uus küsimus","uut küsimust")+" ürituse „"+e.title+"“ all",
      mine:()=>{opened.add(e.id);mineVaade("yritused");}});
  });
  S.info.filter(uusInfo).forEach(i=>out.push({n:1,tekst:"Üldinfo muutus: „"+i.title+"“",mine:()=>mineVaade("info")}));
  S.files.filter(uusFail).forEach(f=>out.push({n:1,tekst:"Uus fail: "+f.name,mine:()=>mineVaade("failid")}));
  myygiRead().filter(uusMyyk).forEach(r=>out.push({
    n:1,tekst:"Uus müügirida: "+r.nimetus,mine:()=>{myykOsa=r.osa;mineVaade("myyk");}}));
  S.events.filter(e=>e.req&&new Date(e.start)>=new Date()&&!(e.acks||{})[S.me])
    .forEach(e=>out.push({n:1,kinnitus:true,tekst:"Ootab sinu kinnitust: üritus „"+e.title+"“",mine:()=>mineVaade("yritused")}));
  S.info.filter(i=>i.req&&!(i.acks||{})[S.me])
    .forEach(i=>out.push({n:1,kinnitus:true,tekst:"Ootab sinu kinnitust: „"+i.title+"“",mine:()=>mineVaade("info")}));
  /* Tänased tööd, mis on kinnitamata — need ootavad kedagi, kes täna tööl on. */
  {
    const nd=new Date(), k=dkey(nd);
    tood().filter(t=>t.kinnita&&tooSelPaeval(t,nd)&&!tehtud(t,k)).forEach(t=>{
      /* Kellel see töö täna on: määratud tegija või graafikujärgsed.
         Kui graafikus pole kedagi, näevad seda kõik — muidu kaoks ta ära. */
      const read=t.kes?[t.kes]:toolPaeval(kohtOf(t),nd).map(m=>m.id);
      const minu=!read.length||read.indexOf(meId())>=0;
      out.push({n:1,kinnitus:true,
        tekst:(minu?"Sinu teha täna: ":"Täna tegemata: ")+"„"+t.nimi+"“ ("+kohaNimi(kohtOf(t))+")",
        mine:()=>{kalKoht="koik";mineVaade("kalender");}});
    });
  }
  return out;
}
const uudiseidKokku=()=>uudised().reduce((s,x)=>s+x.n,0);
function mineVaade(v){ view=v; snap={}; markSeen("view:"+v); }

/* Brauseri enda kellaväli käitub eri brauserites erinevalt ja ei arvesta
   alati sammu ega piire. Oma nimekiri annab kindla tulemuse kõikjal:
   06:00–23:45, veerandtunni kaupa. Viimane on 23:45, sest järgmine
   veerand ongi juba südaöö. */
const KELL_ALGUS=6, KELL_LOPP=23;
const KELLAAJAD=(()=>{
  const out=[];
  for(let h=KELL_ALGUS;h<=KELL_LOPP;h++)
    for(const m of ["00","15","30","45"])
      out.push(String(h).padStart(2,"0")+":"+m);
  return out;
})();
/* Vana või mujalt tulnud aeg, mis nimekirja ei mahu, lisatakse eraldi —
   nii ei kustu keegi teise sisestus lihtsalt ära. */
function kellSelect(id,val,silt){
  const v=String(val||"").slice(0,5);

    +'<option value="">—</option>'

}

function load(){
  try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.v===1&&Array.isArray(p.members)){p.dms=p.dms||{};p.myyk=p.myyk||{osad:[],read:[]};
        if(p.myyk.v!==MYYK_V){p.myyk.osad=vaikeOsad();p.myyk.v=MYYK_V;}
        /* Hinnakiri lisandus hiljem — vanas salvestuses seda ei ole. */
        if(!Array.isArray(p.myyk.hinnad))p.myyk.hinnad=vaikeHinnad();
        /* Töögraafik lisandus hiljem. */
        p.too=p.too||{graafik:{},tood:[],puhkused:[]};
        p.too.graafik=p.too.graafik||{};
        p.too.tood=p.too.tood||[];
        p.too.puhkused=p.too.puhkused||[];
        /* Näidistööd olid varem kellaajaga ja ilma kinnituseta. Vahetame
           need välja, aga ainult need — kasutaja enda tööd jäävad alles. */
        if(p.too.v!==TOO_V){
          const vaikeNimed=VAIKE_TOOD.map(x=>x.nimi.toLowerCase());
          const omad=p.too.tood.filter(t=>
            vaikeNimed.indexOf(String(t.nimi||"").trim().toLowerCase())<0);
          const liige=i=>(p.members[i]||p.members[0]||{}).id;
          p.too.tood=vaikeTood(liige).concat(omad);
          p.too.v=TOO_V;
        }
        /* Vanas hinnakirjas tähendas 0 „määramata“. Nüüd tähendab 0 „tasuta“,
           seega vaikeliigid tuleb uuesti panna. Õpitud hinnad jäävad alles. */
        if(p.myyk.hv!==HINNAD_V){
          const opitud=p.myyk.hinnad.filter(x=>x.hind>0);
          p.myyk.hinnad=vaikeHinnad()
            .filter(v=>!opitud.some(o=>o.osa===v.osa
              && o.nimetus.trim().toLowerCase()===v.nimetus.trim().toLowerCase()))
            .concat(opitud);
          p.myyk.hv=HINNAD_V;
        }
        /* Vanad read ei tea müügikordadest midagi — tee neile üks. */
        /* Nimi on fikseeritud, aga ametlik nimi, registrikood ja varukoopia
           aeg peavad salvestusest alles jaama. */
        p.group=Object.assign({ametlik:AMETLIK,regkood:REGKOOD,
          aadress:"",aadress2:"",telefon:"",epost:"",lahti:VAIKE_LAHTI},
          p.group||{},{name:NIMI});
        (p.myyk.read||[]).forEach(r=>{
          if(!Array.isArray(r.myygid))r.myygid=[{at:r.at,kogus:r.kogus||0,kes:r.kes}];
        });
        return p;}}}catch(e){}
  return seed();
}
/* Salvestus käib serverisse. Kaks asja on siin tähtsad:
   1) korraga käib üks salvestus — kui vahepeal tuleb uus muudatus,
      läheb see järgmisse ringi, muidu jõuavad kaks päringut segamini;
   2) server annab vastuseks värske seisu ja me võtame selle kasutusele.
      Nii saavad ekraanil tehtud read serveri päris numbrid ja järgmine
      salvestus ei tee neist duplikaate. */
let salvestusKaib=false, salvestusOotel=false;
async function save(){
  if(salvestusKaib){salvestusOotel=true;return;}
  salvestusKaib=true;
  try{
    const r=await fetch("/api/seis",{method:"PUT",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(S)});
    if(r.status===401){location.href="/";return;}
    const uus=await r.json();
    if(uus&&Array.isArray(uus.members)){S=uus;render();}
    else if(uus&&uus.viga)toast(uus.viga);
  }catch(e){toast("Ei saanud salvestada. Kontrolli ühendust.");}
  finally{
    salvestusKaib=false;
    if(salvestusOotel){salvestusOotel=false;save();}
  }
}

function split(e){
  const y=[],n=[],s=[];
  for(const m of S.members){
    const r=e.rsvp?e.rsvp[m.id]:null;
    if(r==="yes")y.push(m.id);else if(r==="no")n.push(m.id);else s.push(m.id);
  }
  return {y,n,s};
}

const raha=v=>v.toFixed(2).replace(".",",")+" €";
const osaNimi=oid=>{const o=(S.myyk.osad||[]).find(x=>x.id===oid);return o?o.nimi:"—";};
const myygiRead=()=>S.myyk&&Array.isArray(S.myyk.read)?S.myyk.read:[];
const summa=r=>r.reduce((x,y)=>x+y.kogus*y.hind,0);
/* Toote kogus tuleb tema müügikordadest — nii säilib ajalugu. */
function arvutaKogus(r){
  if(!Array.isArray(r.myygid))r.myygid=[{at:r.at,kogus:r.kogus||0,kes:r.kes}];
  r.kogus=r.myygid.reduce((a,b)=>a+b.kogus,0);
  return r;
}
const myygid=r=>Array.isArray(r.myygid)?r.myygid:[];
/* Kogu maja müüki näeb administraator. Ülejäänud näevad oma müüki —
   nemad vastutavad oma kassa eest, mitte teiste omade eest.
   NB: ilma sisselogimiseta on see kokkulepe, mitte lukk. */
const naebKogumyyki=()=>{const m=byId(meId());return !!(m&&m.helper);};

/* Iga müügikord eraldi sündmusena: millal, mida, kui palju, kes. */
function myygiSyndmused(){
  const out=[];
  myygiRead().forEach(r=>myygid(r).forEach(m=>out.push({
    at:m.at, kes:m.kes, kogus:m.kogus, hind:r.hind,
    eur:m.kogus*r.hind, nimetus:r.nimetus, osa:r.osa
  })));
  return out.sort((a,b)=>new Date(b.at)-new Date(a.at));
}
/* Päevade kaupa, uuemad ees. */
function myykPaevade(){
  const g={};
  myygiSyndmused().forEach(x=>{
    const k=dkey(new Date(x.at));
    (g[k]=g[k]||{k, at:x.at, read:[]}).read.push(x);
  });
  return Object.values(g).sort((a,b)=>b.k.localeCompare(a.k));
}

/* Kes kui palju mida müüs — kokku loetakse iga toote iga müügikord. */
function myyjaStat(){
  const kokku={};
  myygiRead().forEach(r=>{
    myygid(r).forEach(m=>{
      const k=kokku[m.kes]||(kokku[m.kes]={kes:m.kes,kordi:0,tk:0,eur:0,tooted:{}});
      k.kordi++; k.tk+=m.kogus; k.eur+=m.kogus*r.hind;
      const t=k.tooted[r.id]||(k.tooted[r.id]={nimetus:r.nimetus,osa:r.osa,tk:0,eur:0});
      t.tk+=m.kogus; t.eur+=m.kogus*r.hind;
    });
  });
  return Object.values(kokku).sort((a,b)=>b.eur-a.eur);
}
const ackIds=o=>S.members.filter(m=>(o.acks||{})[m.id]).map(m=>m.id);
const noAckIds=o=>S.members.filter(m=>!(o.acks||{})[m.id]).map(m=>m.id);
function dmOf(other){
  const k=dmKey(meId(),other);
  if(!S.dms[k])S.dms[k]={messages:[]};
  return S.dms[k];
}

/* ═══ raam ═══ */
function chrome(){
  $("#gname").textContent=NIMI;
  $("#mename").textContent=byId(meId())?nameOf(meId()):"vali";

  const waitEv=S.events.filter(e=>e.req&&new Date(e.start)>=new Date()&&!(e.acks||{})[meId()]).length;
  const waitIn=S.info.filter(i=>i.req&&!(i.acks||{})[meId()]).length;
  /* Märk tähendab alati ühte asja: nii mitu asja siin sind ootab. */
  const badges={
    vestlus:S.threads.reduce((n,t)=>n+uusThread(t),0)
           +S.members.filter(m=>m.id!==meId()).reduce((n,m)=>n+uusDm(m.id),0),
    yritused:S.events.filter(uusEv).length+S.events.reduce((n,e)=>n+uusKomm(e),0)+waitEv,
    kalender:0,
    info:S.info.filter(uusInfo).length+waitIn,
    kontakt:0,
    failid:S.files.filter(uusFail).length,
    myyk:myygiRead().filter(uusMyyk).length
  };
  const kokku=uudiseidKokku();

  $("#nav").innerHTML=
    '<button class="uut'+(kokku?"":" vaikne")+'" data-act="uut">'
    +ico("bell")+'<span class="lbl-long">Mis on uut</span><span class="lbl-short">Uut</span>'
    +(kokku?'<span class="badge">'+kokku+'</span>':"")
    +'</button>'
    +VIEWS.map(v=>
    '<button data-act="view" data-view="'+v.id+'" aria-current="'+(v.id===view)+'">'
    +ico(v.icon)+'<span>'+v.label+'</span>'
    +(badges[v.id]?'<span class="badge" title="nii mitu asja siin sind ootab">'+badges[v.id]+'</span>':"")
    +'</button>').join("");

  const v=VIEWS.find(x=>x.id===view);
  $("#vplaat").innerHTML=ico(v.icon);
  $("#vtitle").textContent=v.label;
  $("#addbtn").querySelector("span").textContent=v.add;
  $("#explain").innerHTML=ico("info")+'<span>'
    +esc((v.id==="myyk"&&!naebKogumyyki()&&v.help2)?v.help2:v.help)+'</span>';

  let sub="";
  if(view==="yritused"){
    const up=S.events.filter(e=>new Date(e.start)>=new Date()).length;
    sub=up?up+" tulemas":"midagi tulemas ei ole";
    if(waitEv)sub+=" · "+waitEv+" ootab kinnitust";
  }
  else if(view==="vestlus")sub=S.threads.length+" teemat";
  else if(view==="kontakt")sub=S.members.length+" liiget";
  else if(view==="failid")sub=S.files.length+" faili";
  else if(view==="myyk"&&!naebKogumyyki()){
    const x=myyjaStat().find(y=>y.kes===meId());
    sub=x?mitu(x.kordi,"müügikord","müügikorda")+" · "+mitu(x.tk,"tükk","tükki")
        +" · "+raha(x.eur):"sul ei ole veel müüki";
  }
  else if(view==="myyk"){
    const {valitud:v2,read:r2,koik:k2,osad:o2}=myygiSeis();
    sub=!v2?"0 osa"
      :v2.kokku?o2.length+" osa · "+k2.length+" rida · "+raha(summa(k2))
      :v2.nimi+" · "+r2.length+" rida · "+raha(summa(r2));
  }
  else if(view==="info")sub=waitIn?waitIn+" ootab kinnitust":S.info.length+" plokki";
  else if(view==="tootajad"){
    const t=dkey(new Date());
    const majas=S.members.filter(m=>kuskiTööl(m.id,dowIdx(new Date()))&&!araPaeval(m.id,t)).length;
    const p=puhkused().filter(x=>x.lopp>=t).length;
    sub=(majas?mitu(majas,"inimene täna majas","inimest täna majas"):"täna ei ole kedagi graafikus")
      +(p?" · "+mitu(p,"puhkus tulemas","puhkust tulemas"):"");
  }
  $("#vsub").textContent=sub;
}

function render(){
  const cv=$("#canvas");
  const keep=(lastView===view)?cv.scrollTop:0;
  document.documentElement.setAttribute("data-vaade",view);
  chrome();
  varuRiba();
  const w=$("#wrap");
  cv.style.padding=view==="vestlus"?"0":"";
  cv.style.overflow=view==="vestlus"?"hidden":"";
  w.style.maxWidth=(view==="vestlus"||view==="kalender"||view==="kontakt"||view==="myyk"||view==="tootajad")?"none":"";

  ({vestlus:vChat,yritused:vEvents,kalender:vCal,info:vInfo,kontakt:vPeople,failid:vFiles,myyk:vMyyk,tootajad:vToo})[view](w);
  cv.scrollTop=keep;
  lastView=view;
}

/* ═══ Üritused ═══ */
function vEvents(w){
  const now=new Date();
  const up=S.events.filter(e=>new Date(e.start)>=now).sort((a,b)=>new Date(a.start)-new Date(b.start));
  const past=S.events.filter(e=>new Date(e.start)<now).sort((a,b)=>new Date(b.start)-new Date(a.start));
  if(!S.events.length){
    w.innerHTML='<div class="card"><div class="empty"><b>Ühtegi üritust ei ole.</b>Vajuta üleval paremal „Uus üritus“.</div></div>';return;
  }
  let h="";
  if(up.length)h+='<p class="h3">TULEMAS</p>'+up.map(evCard).join("");
  if(past.length)h+='<p class="h3" style="margin-top:14px">TOIMUNUD</p>'+past.map(evCard).join("");
  w.innerHTML=h;
}

  const past=new Date(e.start)<new Date();

  const acked=!!(e.acks||{})[meId()];
  const sp=split(e);
  const rel=relDay(e.start);
  const free=(e.tasks||[]).filter(t=>!t.who);
  const cs=e.comments||[];
  const on=opened.has(e.id);

  const d=new Date(e.start);
  let h='<article class="card ev">'
    +'<div class="ev-pea">'
    +  '<div class="paev'+(past?" past":"")+'">'
    +    '<span class="d">'+d.getDate()+'</span>'
    +    '<span class="k">'+esc(MON[d.getMonth()])+'</span>'
    +    '<span class="n">'+esc(DOW_L[dowIdx(d)])+'</span>'
    +  '</div>'
    +  '<div style="min-width:0;flex:1">'
    +    '<h3>'+(uusEv(e)?'<span class="uus">UUS</span>':"")+esc(e.title)
    +      '<span class="kohasilt">'+esc(kohaNimi(kohtOf(e)))+'</span></h3>'
    +    '<div class="ev-when'+(past?" past":"")+'" style="margin-top:7px">kell '+fmtTime(e.start)
    +      (e.end?"–"+fmtTime(e.end):"")+(rel?' · '+esc(rel):"")+'</div>'
    +    (e.place?'<p class="ev-where">'+esc(e.place)+'</p>':"")
    +  '</div>'
    +'</div>';
  if(e.desc)h+='<p class="ev-desc">'+esc(e.desc)+'</p>';

  if(!past){
    h+='<div class="answer">'
      +'<button class="yes" data-act="rsvp" data-id="'+e.id+'" data-v="yes" aria-pressed="'+(mine==="yes")+'">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+P.check+'</svg>Osalen</button>'
      +'<button class="no" data-act="rsvp" data-id="'+e.id+'" data-v="no" aria-pressed="'+(mine==="no")+'">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">'+P.x+'</svg>Ei osale</button></div>';
  }
  if(e.req){
    h+='<button class="confirm" data-act="ack" data-kind="ev" data-id="'+e.id+'" aria-pressed="'+acked+'">'
      +'<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">'+P.check+'</svg></span>'
      +'<span>Olen selle infoga tutvunud</span>'
      +'<span class="need">'+(acked?"":"palun kinnita")+'</span></button>';
  }

  h+='<div class="riba" aria-hidden="true">'
    +  (sp.y.length?'<i class="y" style="flex:'+sp.y.length+'"></i>':"")
    +  (sp.n.length?'<i class="e" style="flex:'+sp.n.length+'"></i>':"")
    +  (sp.s.length?'<i class="v" style="flex:'+sp.s.length+'"></i>':"")
    +'</div>'
    +'<div class="who">'
    +wl("yes","Osaleb ("+sp.y.length+")",sp.y.length?names(sp.y):"veel keegi")
    +(sp.n.length?wl("no","Ei osale ("+sp.n.length+")",names(sp.n)):"")
    +(sp.s.length?wl("non","Pole vastanud ("+sp.s.length+")",names(sp.s)):"");
  if(e.req){
    const miss=noAckIds(e);
    h+=wl(miss.length?"non":"yes","Tutvunud ("+ackIds(e).length+"/"+S.members.length+")",
          miss.length?"puudu: "+names(miss):"kõik on tutvunud");
  }
  h+='</div>';

  if((e.tasks||[]).length){
    h+='<div><p class="h3" style="margin-bottom:10px">ÜLESANDED'
      +(free.length?' — '+free.length+' veel võtmata':' — kõik võetud')+'</p>'

      +'<div class="tools"><button class="btn small" data-act="q-send" data-id="'+e.id+'">Saada küsimus</button>'
      +'<span class="sp"></span>'
      +'<button class="linkbtn" data-act="add-task" data-id="'+e.id+'">Lisa ülesanne</button></div></div></div>';
  }

  h+='<div class="tools" style="margin-top:4px;padding-top:16px;border-top:1px solid var(--line-2)">'
    +'<span class="meta">Lisas '+esc(nameOf(e.by))+'</span><span class="sp"></span>'
    +'<button class="linkbtn mut" data-act="edit-ev" data-id="'+e.id+'">Muuda</button>'
    +'<button class="linkbtn mut" data-act="del" data-kind="events" data-id="'+e.id+'">Kustuta</button>'
    +'</div></article>';
  return h;

  function wl(k,l,v){return '<div class="wline"><span class="k '+k+'">'+esc(l)+'</span><span class="v'+(k==="non"?" non":"")+'">'+esc(v)+'</span></div>';}
}

function taskLine(e,t){
  const done=!!t.who,mineT=t.who===meId();
  return '<div class="task">'
    +'<svg class="mark'+(done?"":" free")+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(done?P.done:P.open)+'</svg>'
    +'<span class="t">'+esc(t.t)+'</span>'
    +(done?'<span class="n">'+esc(first(nameOf(t.who)))+'</span>'
        +(mineT?'<button class="take" data-act="task" data-ev="'+e.id+'" data-t="'+t.id+'" data-v="drop">Loobun</button>':"")
      :'<button class="take" data-act="task" data-ev="'+e.id+'" data-t="'+t.id+'" data-v="take">Võtan enda peale</button>')
    +'</div>';
}

/* ═══ Kalender ═══ */
function vCal(w){
  if(!calMonth){const n=new Date();calMonth=new Date(n.getFullYear(),n.getMonth(),1);}
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const start=new Date(y,m,1-dowIdx(new Date(y,m,1)));
  const tk=dkey(new Date()),map={};
  const valitudPaev=kalPaev||tk;
  for(const e of S.events){
    if(!sobibKoht(e,kalKoht))continue;
    const k=dkey(new Date(e.start));(map[k]=map[k]||[]).push(e);
  }
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=dkey(d),out=d.getMonth()!==m;
    const list=(map[k]||[]).sort((a,b)=>new Date(a.start)-new Date(b.start));
    const tl=out?[]:tooPaeval(d).filter(t=>sobibKoht(t,kalKoht));
    cells+='<div class="cell'+(out?" out":"")+(k===tk?" today":"")
      +(k===valitudPaev?" valitud":"")+'">'
      +'<button class="n" data-act="kal-paev" data-k="'+k+'" '
      +'aria-label="Vaata seda päeva">'+d.getDate()+'</button>'
      +list.map(e=>'<button class="pill" data-act="goto-ev" data-id="'+e.id+'">'+fmtTime(e.start)+' '+esc(e.title)+'</button>').join("")
      /* Mullis on see, mida päevaplaanist vaadatakse: kes ja mis kell.
         Töö nimi on ühe klõpsu kaugusel ja jääb kohtspikrisse. */
      +tl.map(t=>{
          const teht=tehtud(t,k), ootab=vajabKinnitust(t,k);
          const aeg=tooAeg(t);
          return '<button class="pill too2'+(teht?" tehtud":(ootab?" ootab":""))+'"'
            +' data-act="too-paev" data-id="'+t.id+'" data-k="'+k+'"'
            +' title="'+esc(t.nimi)+(t.kes?" — "+esc(nameOf(t.kes)):"")
            +  (teht?" · tehtud: "+esc(nameOf(teht.kes)):(ootab?" · ootab kinnitust":""))+'">'
            /* Kinnitatava töö puhul on tähtis, MIS on tegemata või tehtud —
               seega jääb mulli töö nimi. Tegija on kohtspikris ja aknas. */
            +'<b>'+(t.kinnita?'<i class="mark">'+(teht?"✓":"○")+'</i>':"")
            +  esc(t.kinnita?t.nimi:(t.kes?eesnimi(nameOf(t.kes)):t.nimi))+'</b>'
            +(aeg?'<span>'+esc(aeg)+'</span>':"")+'</button>';
        }).join("")
      +'</div>';
  }
  w.innerHTML='<div class="osad">'
    +KAL_KOHAD.map(k=>'<button data-act="kal-koht" data-v="'+k.id+'" aria-pressed="'+(kalKoht===k.id)+'">'
      +esc(k.nimi)+'<span class="n">'
      +(S.events.filter(e=>sobibKoht(e,k.id)).length+tood().filter(t=>sobibKoht(t,k.id)).length)
      +'</span></button>').join("")
    +'</div>'
    +'<div class="calbar"><h3>'+MON[m].charAt(0).toUpperCase()+MON[m].slice(1)+' '+y+'</h3>'
    +'<button class="btn ghost small" data-act="cal" data-v="-1">Eelmine kuu</button>'
    +'<button class="btn ghost small" data-act="cal" data-v="0">Täna</button>'
    +'<button class="btn ghost small" data-act="cal" data-v="1">Järgmine kuu</button>'
    +'<span class="sp"></span>'
    +'<button class="btn ghost small" data-act="too-uus">+ Lisa töö</button></div>'
    +'<div class="cal"><div class="dow">'+DOW_S.map(d=>'<span>'+d+'</span>').join("")+'</div><div class="g">'+cells+'</div></div>'
    +paevaPlokk(valitudPaev);
}

/* Ühe päeva plokk kalendri all: mis sel päeval toimub ja kes on majas.
   Varem oli see eraldi Töö graafiku all ja näitas ainult tänast. Nüüd on
   kõik ühe kalendri all: vajuta kuupäeval ja näed selle päeva kohta kõike. */
function paevaPlokk(k){
  const d=new Date(k+"T12:00:00");
  const i=dowIdx(d);
  const onTana=k===dkey(new Date());
  const millal=onTana?"täna":"sel päeval";

  const yritused=S.events.filter(e=>sobibKoht(e,kalKoht)&&dkey(new Date(e.start))===k)
    .sort((a,b)=>new Date(a.start)-new Date(b.start));
  const tl=tooPaeval(d).filter(t=>sobibKoht(t,kalKoht));

  const majasHtml=KOHAD.filter(x=>kalKoht==="koik"||x.id===kalKoht).map(x=>{
    const read=S.members.filter(m=>paevalTööl(m.id,i,x.id)&&!araPaeval(m.id,k));
    if(!read.length)return "";
    return '<div class="majarida"><span class="kohasilt">'+esc(x.nimi)+'</span>'
      + read.map(m=>'<span class="isik">'+avaHtml(m)+esc(m.name)
          +'<span class="kell2">'+esc(vahetusi((graafik(x.id)[m.id]||[])[i]).join(" · "))
          +'</span></span>').join("")
      +'</div>';
  }).join("");
  const ara=puhkused().filter(x=>x.algus<=k&&x.lopp>=k);

  return '<div class="card"><div class="kalpais">'
    +'<p class="h3">'+(onTana?"TÄNA":"PÄEV")+' — '+esc(DOW_P[i])+'</p>'
    +'<span class="kuunimi">'+d.getDate()+'. '+MON[d.getMonth()]+' '+d.getFullYear()+'</span>'
    +'<button class="btn ghost small" data-act="kal-nihe" data-v="-1">‹</button>'
    +'<button class="btn ghost small" data-act="kal-nihe" data-v="0">Täna</button>'
    +'<button class="btn ghost small" data-act="kal-nihe" data-v="1">›</button>'
    +'<input type="date" id="kal-kuup" class="pvalik" value="'+k+'" aria-label="Vali päev">'
    +'</div>'
    +'<div class="tanariba">'
    +  '<div><span class="sild">Majas</span>'
    +   (majasHtml||'<span class="tyhi">Graafikus ei ole '+millal+' kedagi.</span>')+'</div>'
    +  '<div><span class="sild">Ära</span>'
    +   (ara.length?ara.map(x=>'<span class="isik">'+avaHtml(byId(x.kes)||{name:"?"})
          +esc(nameOf(x.kes))+'<span class="kes3">'+esc(liigiNimi(x.liik))+'</span></span>').join("")
        :'<span class="tyhi">Keegi ei ole '+millal+' ära.</span>')+'</div>'
    +'</div>'
    +'<div class="tanariba" style="margin-top:16px">'
    +  '<div><span class="sild">Üritused</span>'
    +   (yritused.length?yritused.map(e=>'<button class="pill" data-act="goto-ev" data-id="'
          +e.id+'">'+fmtTime(e.start)+' '+esc(e.title)+'</button>').join("")
        :'<span class="tyhi">Üritusi ei ole.</span>')+'</div>'
    +  '<div><span class="sild">Tööd</span>'
    +   (tl.length?tl.map(t=>{
          const teht=tehtud(t,k), ootab=vajabKinnitust(t,k), aeg=tooAeg(t);
          return '<button class="pill too2'+(teht?" tehtud":(ootab?" ootab":""))+'"'
            +' data-act="too-paev" data-id="'+t.id+'" data-k="'+k+'">'

/* ═══ Vestlus ═══ */
function vChat(w){
  if(!chat){
    chat=S.threads[0]?{type:"teema",id:S.threads[0].id}:null;
    if(chat)markSeen("thread:"+chat.id);
  }
  if(chat&&chat.type==="teema"&&!S.threads.some(t=>t.id===chat.id))chat=S.threads[0]?{type:"teema",id:S.threads[0].id}:null;
  if(chat&&chat.type==="kiri"&&!byId(chat.id))chat=null;

  const teemad=S.threads.slice().sort((a,b)=>lastAt(b)-lastAt(a)).map(x=>{
    const l=x.messages[x.messages.length-1];
    const on=chat&&chat.type==="teema"&&chat.id===x.id;
    const n=uusThread(x);
    return '<button data-act="ava" data-type="teema" data-id="'+x.id+'" aria-current="'+on+'">'
      +'<span class="t">'+esc(x.title)+(n?'<span class="uus">'+(n===1?"1 UUS":n+" UUT")+'</span>':"")+'</span>'
      +'<span class="m">'+x.messages.length+' sõnumit'+(l?' · '+esc(fmtStamp(l.at)):"")+'</span></button>';
  }).join("");

  const kirjad=S.members.filter(m=>m.id!==meId()).map(m=>{
    const d=S.dms[dmKey(meId(),m.id)];
    const l=d&&d.messages.length?d.messages[d.messages.length-1]:null;
    const on=chat&&chat.type==="kiri"&&chat.id===m.id;
    const n=uusDm(m.id);
    return '<button data-act="ava" data-type="kiri" data-id="'+m.id+'" aria-current="'+on+'">'
      +'<span class="t">'+esc(m.name)+(n?'<span class="uus">'+(n===1?"1 UUS":n+" UUT")+'</span>':"")+'</span>'
      +'<span class="m">'+(l?esc(first(nameOf(l.by)))+": "+esc(l.text.slice(0,42))+(l.text.length>42?"…":""):"kirjuta esimesena")+'</span></button>';
  }).join("");

  const list='<div class="grp">TEEMAD<small>Näevad kõik liikmed</small></div>'+teemad
    +'<div class="grp" style="margin-top:8px">KIRJAD<small>Näete ainult teie kahekesi</small></div>'+kirjad;

  let convo='<div class="convo"><div class="msgs"><div class="empty"><b>Vali vasakult teema või inimene.</b></div></div></div>';
  if(chat){
    const isDm=chat.type==="kiri";
    const box=isDm?dmOf(chat.id):S.threads.find(t=>t.id===chat.id);
    const title=isDm?nameOf(chat.id):box.title;
    const note=isDm?"Kiri kahe vahel — teised liikmed seda ei näe":"Teema — kõik liikmed näevad";
    convo='<div class="convo">'
      +'<div class="cvhead"><b>'+esc(title)+'</b><span>'+esc(note)+'</span></div>'
      +'<div class="msgs" id="msgs">'
      +(box.messages.length?msgideHtml(box.messages,isDm?"dm:"+dmKey(meId(),chat.id):"thread:"+chat.id)
        :'<div class="empty"><b>Siin ei ole veel ühtegi sõnumit.</b>Kirjuta esimene allolevasse kasti.</div>')
      +'</div><div class="composer"><div class="cbox">'
      +'<textarea id="ci" rows="2" placeholder="Kirjuta siia…" aria-label="Sinu sõnum"></textarea>'
      +'<button class="btn" id="csend" data-act="send" disabled>Saada</button></div></div></div>';
  }
  w.innerHTML='<div class="chat" data-open="'+(chat?1:0)+'"><div class="tlist">'+list+'</div>'+convo+'</div>';
  const b=$("#msgs");if(b)b.scrollTop=b.scrollHeight;
  wireComposer();
  function lastAt(x){const l=x.messages[x.messages.length-1];return new Date(l?l.at:x.at);}
}
/* Joon näitab, kust sinu jaoks uued sõnumid algavad. Ilma selleta peaks
   pika lõime puhul kellaaegade järgi ise ära arvama, mida sa lugenud oled. */
function msgideHtml(list,key){
  let piir=false, h="";
  for(const m of list){
    if(!piir&&uus(m.at,key,m.by)){
      piir=true;
      h+='<div class="piir"><span>uued sõnumid</span></div>';
    }
    h+=msgHTML(m);
  }
  return h;
}
function msgHTML(m){
  return '<div class="msg'+(m.by===meId()?" mine":"")+'">'
    +'<div class="hd"><b>'+esc(nameOf(m.by))+'</b><span>'+esc(fmtStamp(m.at))+'</span></div>'
    +'<div class="tx">'+esc(m.text)+'</div></div>';
}
function wireComposer(){
  const ta=$("#ci"),b=$("#csend");if(!ta)return;
  const sync=()=>{b.disabled=!ta.value.trim();ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,150)+"px";};
  ta.addEventListener("input",sync);
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}});
  sync();
}
function sendMsg(){
  const ta=$("#ci");if(!ta||!chat)return;
  const text=ta.value.trim();if(!text)return;
  const box=chat.type==="kiri"?dmOf(chat.id):S.threads.find(t=>t.id===chat.id);
  if(!box)return;
  box.messages.push({id:uid(),by:meId(),at:new Date().toISOString(),text});
  save();render();
  const n=$("#ci");if(n)n.focus();
}

/* ═══ Müük ═══ */
/* Osade nupud on alati ekraanil ja üks on alati avatud — nii ei pea
   midagi valima, et sisu näha, aga teisele vajutades vahetub tabel. */
let myykOsa=null, myykKuu=null, hinnaOsa=null, nadalaNihe=0, kalKoht="koik", graKoht="km";
/* Kalendris vaadatav päev. Tühi tähendab tänast. */
let kalPaev=null;

/* Kustutatud osa read ei tohi kaduda — nad koonduvad „Ilma osata“ alla. */
function myygiSeis(){
  const osad=S.myyk.osad||[], koik=myygiRead();
  const orvud=koik.filter(r=>!osad.some(o=>o.id===r.osa));
  /* Esimene nupp on üldine kokkuvõte, ülejäänud on konkreetsed osad. */
  const nupud=[{id:"__kokku",nimi:"Kokkuvõte",kokku:true}]
    .concat(osad)
    .concat(orvud.length?[{id:"__orvud",nimi:"Ilma osata",orb:true}]:[]);
  if(!nupud.some(o=>o.id===myykOsa))myykOsa="__kokku";
  const valitud=nupud.find(o=>o.id===myykOsa)||null;
  const read=(!valitud||valitud.kokku)?[]:(valitud.orb?orvud:koik.filter(r=>r.osa===valitud.id));
  return {osad,koik,orvud,nupud,valitud,read};
}

/* Oma müük: mida mina olen müünud, millal ja mis summas. Ei osade
   tabelit, ei müüjaid, ei maja kokkuvõtet — need ei ole minu asi. */
function vMinuMyyk(w){
  const mina=meId();
  const read=myygiSyndmused().filter(x=>x.kes===mina)
    .sort((a,b)=>new Date(b.at)-new Date(a.at));
  const tk=read.reduce((a,b)=>a+b.kogus,0), eur=read.reduce((a,b)=>a+b.eur,0);

  let h='<div class="card"><p class="h3">MINU MÜÜK KOKKU</p>'
    +'<div class="statriba">'
    +  '<span><b>'+read.length+'</b> '+(read.length===1?"müügikord":"müügikorda")+'</span>'
    +  '<span><b>'+tk+'</b> '+(tk===1?"tükk":"tükki")+'</span>'
    +  '<span><b>'+esc(raha(eur))+'</b></span>'
    +'</div></div>';

  if(!read.length){
    h+='<div class="card"><div class="empty"><b>Sa ei ole veel midagi müünud.</b>'
      +'Vajuta üleval paremal „Lisa müük“.</div></div>';
    w.innerHTML=h; return;
  }

  /* Päevade kaupa: nii näeb kassapäeva kohe kokku. */
  const paevad={};
  read.forEach(x=>{const k=dkey(new Date(x.at));(paevad[k]=paevad[k]||[]).push(x);});
  const jrk=Object.keys(paevad).sort().reverse();

  h+='<div class="card"><p class="h3">PÄEVADE KAUPA</p>'
    + jrk.map(k=>{
        const r=paevad[k];
        const ptk=r.reduce((a,b)=>a+b.kogus,0), peur=r.reduce((a,b)=>a+b.eur,0);
        return '<div class="paevariba"><span class="pk">'+esc(fmtPaev(k+"T12:00:00"))+'</span>'
          +'<span class="ps">'+ptk+' tk · '+esc(raha(peur))+'</span></div>'
          +'<div class="mlist">'
          + r.sort((a,b)=>new Date(a.at)-new Date(b.at)).map(x=>'<div class="mline2">'
              +'<span class="nm2">'+esc(x.nimetus)
              +  '<span class="osa2">'+esc(osaNimi(x.osa))+' · kell '+fmtTime(x.at)+'</span></span>'
              +'<span class="tk">'+x.kogus+' tk · '+esc(raha(x.eur))+'</span></div>').join("")
          +'</div>';
      }).join("")
    +'</div>';

  w.innerHTML=h;
}

function vMyyk(w){
  if(!naebKogumyyki())return vMinuMyyk(w);
  const {osad,koik,orvud,nupud,valitud}=myygiSeis();

  let h='<div class="osad">'
    +nupud.map(o=>{
        const r=o.kokku?koik:(o.orb?orvud:koik.filter(x=>x.osa===o.id));
        return '<button data-act="osa" data-v="'+o.id+'" aria-pressed="'+(myykOsa===o.id)+'"'
          +((o.orb)?' class="orb"':o.kokku?' class="yld"':'')+'>'
          +esc(o.nimi)+'<span class="n">'+r.length+'</span></button>';
      }).join("")
    +'</div>';

  if(valitud&&valitud.kokku){
    /* Üldine pilt kahes veerus: osad kõrvuti müüjatega, et mahuks ühele ekraanile. */
    const read2=o=>koik.filter(r=>r.osa===o.id);
    h+='<div class="kaks"><div class="pool"><p class="h3">OSAD</p><div class="tabel">'
      +'<div class="trida pais kat"><span>Osa</span>'
      +'<span class="arv">Tükke</span><span class="arv">Summa</span><span></span></div>'
      +osad.map(o=>{
          const r=read2(o);
          return '<button class="trida kat" data-act="osa" data-v="'+o.id+'">'
            +'<span class="nim">'+esc(o.nimi)+'</span>'
            +'<span class="arv">'+r.reduce((a,b)=>a+b.kogus,0)+'</span>'
            +'<span class="arv">'+esc(raha(summa(r)))+'</span><span class="nool">›</span></button>';
        }).join("")
      +(orvud.length?'<button class="trida kat orb" data-act="osa" data-v="__orvud">'
          +'<span class="nim">Ilma osata</span>'
          +'<span class="arv">'+orvud.reduce((a,b)=>a+b.kogus,0)+'</span>'
          +'<span class="arv">'+esc(raha(summa(orvud)))+'</span><span class="nool">›</span></button>':"")
      +'<div class="trida kokku kat"><span class="nim">Kõik kokku</span>'
      +'<span class="arv">'+koik.reduce((a,b)=>a+b.kogus,0)+'</span>'
      +'<span class="arv">'+esc(raha(summa(koik)))+'</span><span></span></div>'
      +'</div>'
      +'</div>';

    const my=myyjaStat();
    if(my.length){
      h+='<div class="pool"><p class="h3">MÜÜJAD</p>'
        +'<div class="tabel">'
        +'<div class="trida pais kat"><span>Müüja</span>'
        +'<span class="arv">Tükke</span><span class="arv">Summa</span><span></span></div>'
        +my.map(x=>'<button class="trida kat" data-act="myyja" data-id="'+x.kes+'">'
            +'<span class="nim">'+esc(nameOf(x.kes))+'</span>'
            +'<span class="arv">'+x.tk+'</span>'
            +'<span class="arv">'+esc(raha(x.eur))+'</span><span class="nool">›</span></button>').join("")
        +'<div class="trida kokku kat"><span class="nim">Kõik müüjad</span>'
        +'<span class="arv">'+my.reduce((a,b)=>a+b.tk,0)+'</span>'
        +'<span class="arv">'+esc(raha(my.reduce((a,b)=>a+b.eur,0)))+'</span><span></span></div>'
        +'</div>'
        +'</div>';
    }
    h+='</div>';

    /* Kalender: iga päev üks ruut oma summaga. Lühem kui nimekiri ja
       päeva üksikasjad on ühe klõpsu kaugusel. */
    const paevaKaart={};
    myygiSyndmused().forEach(x=>{
      const k=dkey(new Date(x.at));
      const p=paevaKaart[k]||(paevaKaart[k]={tk:0,eur:0});
      p.tk+=x.kogus; p.eur+=x.eur;
    });
    if(!myykKuu){const nd=new Date();myykKuu=new Date(nd.getFullYear(),nd.getMonth(),1);}
    const ky=myykKuu.getFullYear(), km=myykKuu.getMonth();
    const kalgus=new Date(ky,km,1-dowIdx(new Date(ky,km,1)));
    const tk=dkey(new Date());
    let kuuTk=0,kuuEur=0;
    let ruudud="";
    for(let i=0;i<42;i++){
      const d=new Date(kalgus); d.setDate(kalgus.getDate()+i);
      const k=dkey(d), out=d.getMonth()!==km, p=paevaKaart[k];
      if(!out&&p){kuuTk+=p.tk;kuuEur+=p.eur;}
      ruudud+=(p?'<button class="mcell'+(out?" out":"")+(k===tk?" today":"")+'" data-act="myyk-paev" data-k="'+k+'">'
                :'<div class="mcell'+(out?" out":"")+(k===tk?" today":"")+'">')
        +'<span class="d">'+d.getDate()+'</span>'
        +(p?'<span class="sum">'+esc(raha(p.eur))+'</span><span class="tkk">'+p.tk+' tk</span>':"")

      +  '<span class="kuunimi">'+MON[km].charAt(0).toUpperCase()+MON[km].slice(1)+' '+ky+'</span>'
      +  '<button class="btn ghost small" data-act="myyk-kuu" data-v="-1">‹</button>'
      +  '<button class="btn ghost small" data-act="myyk-kuu" data-v="0">Täna</button>'
      +  '<button class="btn ghost small" data-act="myyk-kuu" data-v="1">›</button>'
      +  '<span class="kuusumma">'+kuuTk+' tk · '+esc(raha(kuuEur))+'</span>'
      +'</div>'
      +'<div class="mcal"><div class="mdow">'
      +  DOW_S.map(x=>'<span>'+x+'</span>').join("")
      +'</div><div class="mgrid">'+ruudud+'</div></div></div>'
      +'<p class="meta">Vajuta osa, müüja või kalendripäeva peal, et näha üksikasju.</p>'
      +'<div class="pool arukast">'
      +  '<div class="kalpais"><p class="h3">ARUANNE</p>'
      +    '<button class="btn ghost small" data-act="aruanne">Ava aruanne</button></div>'
      +  '<p class="meta" style="margin:0">Vali ajavahemik ja salvesta väljavõte arvutisse. '
      +  'Fail avaneb Excelis otse — selle saab raamatupidajale edasi saata.</p>'
      +'</div>';
  }else if(!valitud){
    h+='<div class="tabel"><div class="empty"><b>Ühtegi osa ei ole.</b>'
      +'Vajuta all „Muuda osi“ ja lisa esimene.</div></div>';
  }else{
    /* Nimetuse järgi: 50 raamatu seast leiab nii silmaga üles. */
    const read=(valitud.orb?orvud:koik.filter(r=>r.osa===valitud.id))
                 .slice().sort((a,b)=>a.nimetus.localeCompare(b.nimetus,"et"));

      +'<div class="trida pais"><span>Nimetus</span><span class="arv">Kogus</span>'
      +'<span class="arv">Hind</span><span class="arv">Summa</span>'
      +'<span>Kes müüs</span><span></span></div>';
    if(!read.length){
      h+='<div class="empty"><b>Selles osas ei ole veel ühtegi rida.</b>'
        +'Vajuta üleval paremal „Lisa müük“.</div>';
    }else{
      h+=read.map(r=>
        '<div class="trida">'
        +'<button class="nim toode" data-act="toode" data-id="'+r.id+'">'
        +  (uusMyyk(r)?'<span class="uus">UUS</span>':"")+esc(r.nimetus)+'</button>'
        +'<span class="arv">'+r.kogus+'</span>'
        +'<span class="arv">'+esc(raha(r.hind))+'</span>'
        +'<span class="arv rida-summa">'+esc(raha(r.kogus*r.hind))+'</span>'

function addFiles(list){
  const fs=Array.from(list||{});if(!fs.length)return;
  let left=fs.length;
  fs.forEach(f=>{
    const rec={id:uid(),name:f.name,size:f.size,by:meId(),at:new Date().toISOString(),note:"",data:null};
    S.files.push(rec);
    if(f.size<=400*1024){const r=new FileReader();r.onload=()=>{rec.data=r.result;done();};r.onerror=done;r.readAsDataURL(f);}

  });

/* ═══ Töötajad ═══
   Kolm asja ühes kohas: kes millal majas on (graafik), mis tööd igal nädalal
   korduvad (tööd) ja kes on ära (puhkused). Korduv töö on nädalapäevade
   loend, mitte kuupäevade loend — nii ei pea seda kunagi uuendama. */
/* Kummalgi majal on oma graafik. Vana salvestus oli ühetasandiline —
   see läheb tervikuna Kodulinna Maja alla. */
function graafikud(){
  const t=S.too||(S.too={graafik:{},tood:[],puhkused:[]});
  let g=t.graafik||{};
  if(!g.km&&!g.torn){g={km:g,torn:{}};t.graafik=g;}
  g.km=g.km||{}; g.torn=g.torn||{};
  return g;
}
const graafik=k=>graafikud()[k==="torn"?"torn":"km"];

/* Ühel päeval kaks vahetust, kummalgi algus ja lõpp. Vanemad kujud —
   „10:00–18:00“ tekstina või {h,o} — loetakse sisse ilma andmeid kaotamata. */
const parsAeg=t=>{
  const m=String(t||"").match(/(\d{1,2}[:.]\d{2})\s*[–\-—]\s*(\d{1,2}[:.]\d{2})/);
  if(m)return [m[1].replace(".",":"),m[2].replace(".",":")];
  const x=String(t||"").trim();
  return x?[x.replace(".",":"),""]:["",""];
};
function vahetus(v){
  if(!v)return {ha:"",hl:"",oa:"",ol:""};
  if(typeof v==="string"){const p=parsAeg(v);return {ha:p[0],hl:p[1],oa:"",ol:""};}
  if(v.ha!==undefined||v.oa!==undefined)
    return {ha:v.ha||"",hl:v.hl||"",oa:v.oa||"",ol:v.ol||""};
  const h=parsAeg(v.h),o=parsAeg(v.o);
  return {ha:h[0],hl:h[1],oa:o[0],ol:o[1]};
}
const aegTekst=(a,l)=>a?(l?a+"–"+l:a):"";
/* Päevas on üks tööaeg. Vanad kahe vahetusega kirjed loetakse kokku:
   varaseim algus ja hiliseim lõpp. */
const vahetusYks=v=>{
  const x=vahetus(v);
  const algused=[x.ha,x.oa].filter(Boolean).sort();
  const lopud=[x.hl,x.ol].filter(Boolean).sort();
  return {a:algused[0]||"", l:lopud[lopud.length-1]||""};
};
const vahetusi=v=>{const x=vahetusYks(v);const t=aegTekst(x.a,x.l);return t?[t]:[];};
const paevalTööl=(mid,i,koht)=>vahetusi((graafik(koht)[mid]||[])[i]).length>0;
const kuskiTööl=(mid,i)=>KOHAD.some(k=>paevalTööl(mid,i,k.id));
const tood=()=>(S.too&&S.too.tood)||[];
const puhkused=()=>(S.too&&S.too.puhkused)||[];
const DOW_P=["esmaspäev","teisipäev","kolmapäev","neljapäev","reede","laupäev","pühapäev"];
const LIIGID=[{id:"puhkus",nimi:"Puhkus"},{id:"haigus",nimi:"Haigusleht"},{id:"vaba",nimi:"Vaba päev"}];
const liigiNimi=x=>(LIIGID.find(l=>l.id===x)||{nimi:"Ära"}).nimi;

/* Kas see inimene on sel kuupäeval ära? */
const araPaeval=(kes,k)=>puhkused().find(p=>p.kes===kes&&p.algus<=k&&p.lopp>=k);
/* Selle nädalapäeva korduvad tööd. */
/* Töö on kas korduv (nädalapäevade loend) või ühekordne (üks kuupäev).
   Korduvat ei pea kunagi uuendama, ühekordne kaob ise minevikku. */
/* Vanas salvestuses oli üks kellaaeg. See on nüüd algus. Kellaaeg võib
   puududa: mõni töö tuleb lihtsalt päeva jooksul ära teha. */
const tooAlgus=t=>t.algus||t.kellaaeg||"";
/* Korduvat tööd tehakse iga kord uuesti, seega kinnitus käib kuupäeva
   kohta. Võti on päev, väärtus on tegija ja aeg. */
const tehtud=(t,k)=>(t.tehtud||{})[k]||null;
const vajabKinnitust=(t,k)=>!!t.kinnita&&!tehtud(t,k);
/* Kes on sel päeval selles majas graafikus. Puudujad jäävad välja —
   haiguslehel olev inimene ei ole see, kes lilled ära kastab. */
function toolPaeval(koht,d){
  const k=dkey(d), i=dowIdx(d);
  return S.members.filter(m=>paevalTööl(m.id,i,koht)&&!araPaeval(m.id,k));
}
const toolTekst=(koht,d)=>toolPaeval(koht,d)
  .map(m=>m.name+" "+vahetusi((graafik(koht)[m.id]||[])[dowIdx(d)]).join(" "))
  .join(" · ");

/* Kas see töö langeb sellele päevale? „ara“ on nimekiri üksikutest
   päevadest, mis on korduvast tööst välja jäetud — nii saab ühe korra
   ära kustutada, ilma et kogu kordumine kaoks. */
const araJaetud=(t,k)=>!!(t.ara||{})[k];
const tooSelPaeval=(t,d)=>{
  const k=dkey(d);
  if(araJaetud(t,k))return false;
  return t.kuup?t.kuup===k:(t.paevad||[]).indexOf(dowIdx(d))>=0;
};
const tooAeg=t=>aegTekst(tooAlgus(t),t.lopp||"");
const eesnimi=x=>String(x||"").trim().split(/\s+/)[0]||"";

const tooPaeval=d=>tood().filter(t=>tooSelPaeval(t,d))
  /* Kellaajata töö on „päeva jooksul“ ja käib ajaga tööde ette. */
  .sort((a,b)=>(tooAlgus(a)||"00:00").localeCompare(tooAlgus(b)||"00:00"));

/* Nädala esmaspäev. */
function nadalaAlgus(nihe){
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-dowIdx(d)+(nihe||0)*7);
  return d;
}

/* Pilt on ruut; kui seda pole või ta ei avane, jäävad alla initsiaalid. */
const initsiaalid=nimi=>nimi.trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();
function avaHtml(m,suur){
  return '<span class="ava'+(suur?" suur":"")+'">'
    +'<span class="init">'+esc(initsiaalid(m.name||"?"))+'</span>'
    +(m.pilt?'<img src="'+esc(m.pilt)+'" alt="">':"")+'</span>';
}

function vToo(w){
  const alg=nadalaAlgus(nadalaNihe);
  const tana=dkey(new Date());
  const paevad=[];
  for(let i=0;i<7;i++){const d=new Date(alg);d.setDate(alg.getDate()+i);paevad.push(d);}
  const tIdx=dowIdx(new Date());

  /* Kes ühel kindlal päeval majas on, seda vaadatakse Kalendrist —
     seal on üks suur kalender, kus on korraga näha üritused, tööd ja
     see, kes majas on. Siin on nädalatabel: kogu nädal korraga. */
  let h='<div class="card"><p class="abi" style="margin:0">'
    +'Kes ühel kindlal päeval majas on ja kes on ära — vaata '
    +'<button class="linkbtn" data-act="view" data-view="kalender">Kalendrist</button>. '
    +'Siin all saab graafikut muuta.</p></div>';

  /* Üks tabel korraga, maja valik peal — sama muster mis Kalendris. */
  const g2=graafik(graKoht);
  h+='<div class="osad">'
    + KOHAD.map(k=>{
        const mitu2=S.members.filter(m=>(graafik(k.id)[m.id]||[])
          .some(v=>vahetusi(v).length)).length;
        return '<button data-act="gra-koht" data-v="'+k.id+'" aria-pressed="'+(graKoht===k.id)+'">'
          +esc(k.nimi)+'<span class="n">'+mitu2+'</span></button>';
      }).join("")
    +'</div>'
    +'<div class="card"><div class="kalpais"><p class="h3">NÄDAL</p>'
    +'<span class="kuunimi">'+paevad[0].getDate()+'. '+MON[paevad[0].getMonth()]
    +  ' – '+paevad[6].getDate()+'. '+MON[paevad[6].getMonth()]+'</span>'
    +'<button class="btn ghost small" data-act="nadal" data-v="-1">‹</button>'
    +'<button class="btn ghost small" data-act="nadal" data-v="0">Käesolev</button>'
    +'<button class="btn ghost small" data-act="nadal" data-v="1">›</button></div>'
    +'<div class="gtabel"><div class="grida gpais"><span>Inimene</span>'
    + paevad.map((d,i)=>'<span'+(dkey(d)===tana?' class="tana"':'')+'>'+DOW_S[i]
        +'<i>'+d.getDate()+'.'+(d.getMonth()+1)+'</i></span>').join("")
    +'</div>'
    + S.members.map(m=>{
        const r=g2[m.id]||[];
        return '<div class="grida">'
          +'<button class="gnimi" data-act="graafik" data-id="'+m.id+'" data-koht="'+graKoht+'"'
          +' aria-label="'+esc(m.name+" — kogu nädal")+'">'
          +'<span class="isik">'+avaHtml(m)+esc(m.name)+'</span></button>'
          + paevad.map((d,i)=>{
              const k=dkey(d), ara=araPaeval(m.id,k);
              const silt=esc(m.name+", "+DOW_P[i]+" "+d.getDate()+"."+(d.getMonth()+1)+" — ");
              if(ara)return '<button class="lahter ara" data-act="puhkus-muuda" data-id="'+ara.id+'"'
                +' aria-label="'+silt+esc(liigiNimi(ara.liik))+'">'+esc(liigiNimi(ara.liik))+'</button>';
              const v=vahetusi(r[i]);
              return '<button class="lahter'+(v.length?"":" tyhi2")+'" data-act="graafik-paev"'
                +' data-id="'+m.id+'" data-koht="'+graKoht+'" data-i="'+i+'" data-kuup="'+k+'"'
                +' aria-label="'+silt+(v.length?esc(v.join(" ")):"tööaega ei ole")+'">'
                +(v.length?v.map(x=>'<i>'+esc(x)+'</i>').join(""):"–")+'</button>';
            }).join("")
          +'</div>';
      }).join("")
    +'</div>'
    +'<p class="meta">Vajuta ühel lahtril, et selle päeva tööaega muuta — või nimel, '
    +'et näha korraga tervet nädalat. Maja: „'+esc(kohaNimi(graKoht))+'“.</p></div>';

  /* Puudumised. */
  const tulevad=puhkused().filter(p=>p.lopp>=tana).sort((a,b)=>a.algus.localeCompare(b.algus));
  h+='<div class="card"><div class="kalpais">'
    +'<p class="h3">PUHKUS · HAIGUSLEHT · VABA PÄEV</p>'
    +'<span class="sp"></span>'
    +'<button class="btn ghost small" data-act="puhkus-uus">+ Lisa</button></div>'
    +(tulevad.length?'<div class="tlist2">'
      + tulevad.map(p=>'<button class="trida2 puh" data-act="puhkus-muuda" data-id="'+p.id+'">'
          +'<span class="nm3">'+esc(nameOf(p.kes))
          + (p.markus?'<span class="osa2">'+esc(p.markus)+'</span>':"")+'</span>'
          +'<span class="liik">'+esc(liigiNimi(p.liik))+'</span>'
          +'<span class="kell2">'+esc(p.algus===p.lopp?lyhiKey(p.algus)
              :lyhiKey(p.algus)+" – "+lyhiKey(p.lopp))+'</span>'
          +'<span class="nool">›</span></button>').join("")
      +'</div>'
      :'<div class="empty"><b>Keegi ei ole ära.</b>Vajuta üleval paremal „Lisa“.</div>')
    +'</div>';

  w.innerHTML=h;
}

/* Kalendrist avatuna on tähtis tegevus „tegin ära“, mitte muutmine. */
function dlgTooPaev(id,k){
  const t=tood().find(x=>x.id===id); if(!t)return;
  const teht=tehtud(t,k);
  const kell=tooAeg(t);
  dlg(t.nimi,
    '<div class="paevpais">'+esc(fmtPaev(k+"T12:00:00"))+'</div>'
    +'<p class="hint" style="margin:0"><b>'+esc(kohaNimi(kohtOf(t)))+'</b>'
    +  (kell?' · '+esc(kell):' · päeva jooksul')+'</p>'
    +(t.markus?'<p class="hint" style="margin:0">'+esc(t.markus)+'</p>':"")
    +(()=>{
        if(t.kes)return '<div class="teebriba"><span class="sild">Teeb</span>'
          +'<span class="isik">'+avaHtml(byId(t.kes)||{name:"?"})+esc(nameOf(t.kes))+'</span></div>';
        const d=new Date(k+"T12:00:00"), read=toolPaeval(kohtOf(t),d);
        return '<div class="teebriba"><span class="sild">Sel päeval on tööl</span>'
          +(read.length
            ? read.map(m=>'<span class="isik">'+avaHtml(m)+esc(m.name)
                +'<span class="kell2">'+esc(vahetusi((graafik(kohtOf(t))[m.id]||[])[dowIdx(d)]).join(" "))
                +'</span></span>').join("")
            : '<span class="tyhi">Graafikus ei ole sel päeval kedagi.</span>')
          +'</div>';
      })()
    +(t.kinnita
      ? '<div class="olekriba'+(teht?" on":"")+'">'
        +(teht?'<b>Tehtud</b><span>'+esc(nameOf(teht.kes))+' · '+esc(fmtKuup(teht.at))+'</span>'
              :'<b>Veel tegemata</b><span>Kui oled ära teinud, vajuta all „Tegin ära“.</span>')
        +'</div>'
      : '<p class="hint" style="margin:0">See töö ei vaja kinnitust.</p>')
    +'<div class="tools">'
    +  '<button type="button" class="btn ghost" data-act="too-muuda" data-id="'+t.id+'">Muuda tööd</button>'
    +  '<span class="sp"></span>'
    +  (t.kuup?"":'<button type="button" class="btn danger" data-act="too-ara" '
        +'data-id="'+t.id+'" data-k="'+k+'">Kustuta see päev</button>')
    +  '<button type="button" class="btn danger" data-act="too-kustuta" data-id="'+t.id+'">'
    +  (t.kuup?"Kustuta":"Kustuta kõik korrad")+'</button>'
    +'</div>',
    t.kinnita?(teht?"Võta kinnitus tagasi":"Tegin ära"):"Sulge",
    ()=>{
      if(!t.kinnita)return true;
      t.tehtud=t.tehtud||{};
      if(teht){delete t.tehtud[k];toast("Kinnitus võetud tagasi.");}
      else{t.tehtud[k]={kes:meId(),at:new Date().toISOString()};toast("Tubli — märgitud tehtuks.");}
      save();render();return true;
    }, !t.kinnita);
}

/* Üks päev korraga: nii ei pea seitsme rea seast õiget otsima. */
function dlgGraafikPaev(mid,koht,i,kuup){
  const m=byId(mid); if(!m)return;
  const g=graafik(koht);
  const r=(g[mid]||[]).slice();
  const v=vahetusYks(r[i]);
  dlg("Tööaeg — "+m.name,
    '<div class="paevpais">'+esc(fmtPaev(kuup+"T12:00:00"))+'</div>'
    +'<p class="hint" style="margin:0"><b>'+esc(kohaNimi(koht))+'</b> · kehtib igal '
    +esc(DOW_P[i])+'al</p>'
    +'<div class="two">'
    +  '<div class="field"><label for="f_pa">Algab</label>'
    +  kellSelect("f_pa",v.a,"Algab")+'</div>'
    +  '<div class="field"><label for="f_pl">Lõpeb</label>'
    +  kellSelect("f_pl",v.l,"Lõpeb")+'</div>'
    +'</div>',
    "Salvesta",()=>{
      const a=fv("f_pa"), l=a?fv("f_pl"):"";
      /* Tööpäev ei lõpe enne, kui ta algab. */
      if(a&&l&&l<=a){toast("Lõpp peab olema algusest hiljem.");return false;}
      while(r.length<7)r.push({});
      r[i]={ha:a,hl:l};
      g[mid]=r;
      save();render();toast(a?"Tööaeg salvestatud.":"Tööaeg kustutatud.");
      return true;
    });
}

function dlgGraafik(mid,koht){
  const m=byId(mid); if(!m)return;
  const g=graafik(koht);
  const r=(g[mid]||[]).slice();
  dlg("Tööaeg — "+m.name+" · "+kohaNimi(koht),
    '<p class="hint" style="margin:0">Vali algus ja lõpp. Jäta tühjaks, kui sel päeval '
    +'tööd ei ole. Vajuta väljal, et kellavalik avada.</p>'
    +'<div class="glist"><div class="grida2 gpais2"><span></span>'
    +'<span>Algab</span><span>Lõpeb</span></div>'
    + DOW_P.map((d,i)=>{const v=vahetusYks(r[i]);
        const inp=(id,val,silt)=>kellSelect(id+i,val,d+" "+silt);
        return '<div class="grida2"><label>'+esc(d)+'</label>'
          +inp("f_ha",v.a,"algab")+inp("f_hl",v.l,"lõpeb")
          +'</div>';}).join("")
    +'</div>',
    "Salvesta",()=>{
      const uued=[];
      for(let i=0;i<7;i++){
        const x={ha:fv("f_ha"+i),hl:fv("f_hl"+i)};
        if(!x.ha)x.hl="";   /* lõpp ilma alguseta ei tähenda midagi */
        if(x.ha&&x.hl&&x.hl<=x.ha){
          toast(DOW_P[i].charAt(0).toUpperCase()+DOW_P[i].slice(1)
            +": lõpp peab olema algusest hiljem.");
          return false;
        }
        uued.push(x);
      }
      g[mid]=uued;
      save();render();toast("Tööaeg salvestatud.");return true;
    });
}

/* ═══ Hinnakiri ═══
   Nimekiri sellest, mida selles osas üldse müüakse. Kaks allikat: käsitsi
   pandud liigid ja kõik, mida on juba päriselt müüdud. Nii ei pea keegi
   midagi eraldi seadistama — nimekiri kasvab kasutamisest. */
const hinnaKiri=()=>Array.isArray(S.myyk.hinnad)?S.myyk.hinnad:(S.myyk.hinnad=[]);

function kiirValik(osaId){
  const m=new Map();
  hinnaKiri().filter(x=>x.osa===osaId).forEach(x=>
    m.set(x.nimetus.trim().toLowerCase(),
          {nimetus:x.nimetus,hind:(typeof x.hind==="number")?x.hind:null}));
  /* Päris müügid käivad üle: seal on hind kindlasti õige. */
  myygiRead().filter(x=>x.osa===osaId)
    .slice().sort((a,b)=>new Date(a.at)-new Date(b.at))
    .forEach(x=>m.set(x.nimetus.trim().toLowerCase(),{nimetus:x.nimetus,hind:x.hind}));
  return [...m.values()].sort((a,b)=>a.nimetus.localeCompare(b.nimetus,"et"));
}

/* Iga müük õpetab hinnakirja: uus nimetus lisandub, tuttava hind uueneb. */
function opiHind(osa,nimetus,hind){
  const k=hinnaKiri();
  const olemas=k.find(x=>x.osa===osa&&x.nimetus.trim().toLowerCase()===nimetus.trim().toLowerCase());
  if(olemas){olemas.nimetus=nimetus; olemas.hind=hind;}
  else k.push({id:uid(),osa,nimetus,hind});
}

function kiirHtml(osaId){
  const v=kiirValik(osaId);
  if(!v.length)return '<span class="hint">Selles osas ei ole veel ühtegi nimetust. Kirjuta esimene ise.</span>';
  return '<div class="kiirvalik">'
    +v.map(x=>{
      const m=(typeof x.hind==="number");
      return '<button type="button" data-act="kiir" data-nim="'+esc(x.nimetus)+'"'
        +(m?' data-h="'+x.hind.toFixed(2).replace(".",",")+'"':"")+'>'
        +esc(x.nimetus)
        +(!m   ?'<span class="h uus2">hind puudub</span>'
         :x.hind===0?'<span class="h tasuta">tasuta</span>'
         :          '<span class="h">'+esc(raha(x.hind))+'</span>')
        +'</button>';}).join("")
    +'</div>';
}

/* ═══ Müügiaruanne ═══
   Raamatupidaja tahab kahte asja: ühte tabelit, kus iga müük on eraldi real,
   ja kokkuvõtteid, mille järgi kanded kontodele jagada. Fail on CSV, sest
   seda avab iga programm — semikoolon eraldajaks ja koma kümnendkohaks,
   sest Eesti Exceli seadistus ootab neid. BOM ees, muidu kaovad täpitähed. */
let aruA=null, aruB=null;

function aruVahemik(mis){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  const kuu=(a,b)=>{aruA=dkey(new Date(y,a,1));aruB=dkey(new Date(y,a+1,0));};
  if(mis==="kuu")kuu(m);
  else if(mis==="eelmine")kuu(m-1);
  else if(mis==="aasta"){aruA=dkey(new Date(y,0,1));aruB=dkey(new Date(y,11,31));}
  else{
    const k=myygiSyndmused().map(x=>dkey(new Date(x.at))).sort();
    aruA=k.length?k[0]:dkey(n); aruB=dkey(n);
  }
}

function aruRead(){
  return myygiSyndmused()
    .filter(x=>{const k=dkey(new Date(x.at));
      return (!aruA||k>=aruA)&&(!aruB||k<=aruB);})
    .sort((a,b)=>new Date(a.at)-new Date(b.at));
}

function aruKokku(read){
  const osa={}, myyja={};
  read.forEach(x=>{
    const o=osa[x.osa]||(osa[x.osa]={tk:0,eur:0}); o.tk+=x.kogus; o.eur+=x.eur;
    const m=myyja[x.kes]||(myyja[x.kes]={n:0,tk:0,eur:0});
    m.n++; m.tk+=x.kogus; m.eur+=x.eur;
  });
  return {
    tk:read.reduce((a,b)=>a+b.kogus,0),
    eur:read.reduce((a,b)=>a+b.eur,0),
    osa:Object.keys(osa).map(k=>({k,...osa[k]})).sort((a,b)=>b.eur-a.eur),
    myyja:Object.keys(myyja).map(k=>({k,...myyja[k]})).sort((a,b)=>b.eur-a.eur)
  };
}

const lyhiPaev=iso=>{const d=new Date(iso);
  return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear();};
const lyhiKey=k=>{const o=k.split("-");return o[2]+"."+o[1]+"."+o[0];};

function dlgAruanne(){
  if(!aruA||!aruB)aruVahemik("kuu");
  const read=aruRead(), K=aruKokku(read);
  const rida=(nimi,parem)=>'<div class="mline2"><span class="nm2">'+nimi+'</span>'
    +'<span class="tk">'+parem+'</span></div>';

  let h='<div class="field"><label>Ajavahemik</label>'

    +  '<button type="button" class="btn ghost small" data-act="aru-per" data-v="eelmine">Eelmine kuu</button>'
    +  '<button type="button" class="btn ghost small" data-act="aru-per" data-v="aasta">See aasta</button>'
    +  '<button type="button" class="btn ghost small" data-act="aru-per" data-v="koik">Kogu aeg</button>'
    +'</div>'
    +'<div class="two">'

    +'</div>'

    +'<div class="statriba">'

    +'</div>';

  if(!read.length){
    h+='<p class="meta">Sellesse ajavahemikku ei jää ühtegi müüki. Vali teine vahemik.</p>';
  }else{
    h+='<div class="field"><label>Osade kaupa</label><div class="mlist">'
      + K.osa.map(o=>rida(esc(osaNimi(o.k)),o.tk+" tk · "+esc(raha(o.eur)))).join("")
      + rida("<b>Kokku</b>","<b>"+K.tk+" tk · "+esc(raha(K.eur))+"</b>")
      +'</div></div>'
      +'<div class="field"><label>Müüjate kaupa</label><div class="mlist">'
      + K.myyja.map(m=>'<div class="mline2">'
          +'<span class="nm2">'+esc(nameOf(m.k))
          +  '<span class="osa2">'+mitu(m.n,"müügikord","müügikorda")+'</span></span>'
          +'<span class="tk">'+m.tk+' tk · '+esc(raha(m.eur))+'</span></div>').join("")
      +'</div></div>'
      +'<div class="tools"><button type="button" class="btn ghost" data-act="aru-print">'
      +'Trüki või salvesta PDF-ina</button></div>'
      +'<span class="hint">Salvestatud failis on lisaks iga müük eraldi real: '
      +'kuupäev, kellaaeg, osa, nimetus, kogus, ühiku hind, summa ja müüja. '
      +'Trükiaknas saab „Sihtkohaks“ valida „Salvesta PDF-ina“.</span>';
  }

  dlg("Müügiaruanne", h, "Salvesta arvutisse", ()=>{
    if(!aruRead().length){toast("Sellesse ajavahemikku ei jää ühtegi müüki.");return false;}
    aruSalvesta(); return true;
  });

  requestAnimationFrame(()=>{
    ["f_a","f_b"].forEach(id=>{
      const e=$("#"+id);
      if(e)e.addEventListener("change",()=>{
        const a=$("#f_a"), b=$("#f_b");
        if(a&&b&&a.value&&b.value){
          /* Tagurpidi vahemik on alati näpuviga — keerame ise õigetpidi. */
          aruA=a.value<=b.value?a.value:b.value;
          aruB=a.value<=b.value?b.value:a.value;
          dlgAruanne();
        }
      });
    });
  });
}

const csvVali=v=>{const t=String(v);
  return /[";\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
const csvRida=a=>a.map(csvVali).join(";");
const csvArv=v=>v.toFixed(2).replace(".",",");

function aruCSV(){
  const read=aruRead(), K=aruKokku(read), L=[];
  const g=S.group||{};
  L.push([(g.ametlik||NIMI)+" — müügiaruanne"]);
  if(g.regkood)L.push(["Registrikood",g.regkood]);
  if(g.aadress)L.push(["Aadress",g.aadress]);
  if(g.telefon)L.push(["Telefon",g.telefon]);
  L.push(["Ajavahemik",lyhiKey(aruA)+" – "+lyhiKey(aruB)]);
  L.push(["Koostatud",lyhiPaev(new Date().toISOString())+" "+fmtTime(new Date().toISOString())]);
  L.push(["Koostas",nameOf(meId())]);
  /* Ilma selle reata küsib raamatupidaja alati järele, kas hinnad on käibemaksuga. */
  L.push(["Käibemaks","ei kohaldu — ei ole käibemaksukohustuslane"]);
  L.push(["Hinnad","lõpphinnad, käibemaksuta"]);
  L.push([]);
  L.push(["Kuupäev","Kellaaeg","Osa","Nimetus","Kogus","Ühiku hind","Summa","Müüja"]);
  read.forEach(x=>L.push([lyhiPaev(x.at),fmtTime(x.at),osaNimi(x.osa),x.nimetus,
                          x.kogus,csvArv(x.hind),csvArv(x.eur),nameOf(x.kes)]));
  L.push([]);
  L.push(["KOKKU","","","",K.tk,"",csvArv(K.eur),""]);
  L.push([]);
  L.push(["Osade kaupa"]);
  L.push(["Osa","Kogus","Summa"]);
  K.osa.forEach(o=>L.push([osaNimi(o.k),o.tk,csvArv(o.eur)]));
  L.push([]);
  L.push(["Müüjate kaupa"]);
  L.push(["Müüja","Müügikordi","Kogus","Summa"]);
  K.myyja.forEach(m=>L.push([nameOf(m.k),m.n,m.tk,csvArv(m.eur)]));
  /* CRLF ja BOM: ilma nendeta ajab Excel read ja täpitähed sassi. */
  return "\ufeff"+L.map(csvRida).join("\r\n")+"\r\n";
}

async function aruSalvesta(){
  const data=aruCSV();
  const fn="Kodulinna_Maja_myygiaruanne_"+aruA+"_"+aruB+".csv";
  if(window.claude&&window.claude.downloads){
    try{await window.claude.downloads.save({filename:fn,data});
        toast("Aruanne salvestatud.");}
    catch(err){
      const c=err&&err.code;
      if(c==="declined")toast("Salvestamine jäi katki.");
      else if(c==="rate_limited")toast("Üks salvestusaken on juba lahti.");
      else showRaw(data);
    }
  }else showRaw(data);
}

/* Ühe müüja statistika: kokkuvõte, mida ta müüs ja tema oma kalender.
   Kuupäeva peale klõpsates avaneb selle päeva statistika sealsamas. */
let myyjaId=null, myyjaKuu=null, myyjaPaev=null;

function avaMyyja(kes){
  const oma=myygiSyndmused().filter(x=>x.kes===kes);
  if(!oma.length){toast(nameOf(kes)+" ei ole veel midagi müünud.");return;}
  myyjaId=kes; myyjaPaev=null;
  const v=new Date(oma[0].at);
  myyjaKuu=new Date(v.getFullYear(),v.getMonth(),1);
  dlgMyyja();
}

function dlgMyyja(){
  const kes=myyjaId;
  const x=myyjaStat().find(y=>y.kes===kes);
  if(!x){closeDlg();return;}
  const oma=myygiSyndmused().filter(y=>y.kes===kes);

  /* Ainult selle müüja päevad. */
  const paevad={};
  oma.forEach(y=>{
    const k=dkey(new Date(y.at));
    const p=paevad[k]||(paevad[k]={tk:0,eur:0});
    p.tk+=y.kogus; p.eur+=y.eur;
  });

  const ky=myyjaKuu.getFullYear(), km=myyjaKuu.getMonth();
  const alg=new Date(ky,km,1-dowIdx(new Date(ky,km,1)));
  const tana=dkey(new Date());
  /* Ainult need nädalad, kuhu kuu tegelikult ulatub — muidu jääb aken tühjaks. */
  const nadalaid=Math.ceil((dowIdx(new Date(ky,km,1))+new Date(ky,km+1,0).getDate())/7);
  let kuuTk=0,kuuEur=0,ruudud="";
  for(let i=0;i<nadalaid*7;i++){
    const d=new Date(alg); d.setDate(alg.getDate()+i);
    const k=dkey(d), out=d.getMonth()!==km, p=paevad[k];
    if(!out&&p){kuuTk+=p.tk;kuuEur+=p.eur;}
    ruudud+=(p?'<button type="button" class="mcell'+(out?" out":"")+(k===tana?" today":"")
              +(k===myyjaPaev?" valitud":"")+'" data-act="myyja-paev" data-k="'+k+'">'
              :'<div class="mcell'+(out?" out":"")+(k===tana?" today":"")+'">')
      +'<span class="d">'+d.getDate()+'</span>'
      +(p?'<span class="sum">'+esc(raha(p.eur))+'</span><span class="tkk">'+p.tk+' tk</span>':"")
      +(p?'</button>':'</div>');
  }

  let h='<div class="statriba">'
    + '<span><b>'+x.tk+'</b> tükki</span>'
    + '<span><b>'+esc(raha(x.eur))+'</b></span>'
    + '<span><b>'+x.kordi+'</b> müügikorda</span>'
    +'</div>'
    +'<div class="field"><div class="kalpais">'
    +  '<label style="margin:0">Millal ta müüs</label>'
    +  '<span class="kuunimi">'+MON[km].charAt(0).toUpperCase()+MON[km].slice(1)+' '+ky+'</span>'
    +  '<button type="button" class="btn ghost small" data-act="myyja-kuu" data-v="-1">‹</button>'
    +  '<button type="button" class="btn ghost small" data-act="myyja-kuu" data-v="1">›</button>'
    +  '<span class="kuusumma">'+kuuTk+' tk · '+esc(raha(kuuEur))+'</span>'
    +'</div>'
    +'<span class="hint" style="margin:0 0 8px">Vajuta kuupäeval, et näha selle päeva müüki.</span>'
    +'<div class="mcal"><div class="mdow">'+DOW_S.map(y=>'<span>'+y+'</span>').join("")
    +'</div><div class="mgrid">'+ruudud+'</div></div></div>';

  if(myyjaPaev){
    const pr=oma.filter(y=>dkey(new Date(y.at))===myyjaPaev)
                .sort((a,b)=>new Date(a.at)-new Date(b.at));
    if(pr.length){
      h+='<div class="field paevaosa"><label>'+esc(fmtPaev(pr[0].at))+' — '
        + pr.reduce((a,b)=>a+b.kogus,0)+' tk · '+esc(raha(pr.reduce((a,b)=>a+b.eur,0)))
        +'</label><div class="mlist">'
        + pr.map(y=>'<div class="mline2">'
            +'<span class="nm2">'+esc(y.nimetus)+'<span class="osa2">'+esc(osaNimi(y.osa))
            +  ' · kell '+fmtTime(y.at)+'</span></span>'
            +'<span class="tk">'+y.kogus+' tk · '+esc(raha(y.eur))+'</span></div>').join("")
        +'</div></div>';
    }
  }

  dlg("Statistika — "+nameOf(kes), h, "Sulge", ()=>true, true);
  /* Uus paneel tekib akna lõppu; ilma kerimiseta jääks mulje, et klõps ei teinud midagi. */
  if(myyjaPaev)requestAnimationFrame(()=>{
    const e=$("#dlg-bd .paevaosa");
    if(e)e.scrollIntoView({block:"nearest"});   /* kohe, ilma liikumiseta */
  });
}

/* Valitud päev pluss kellaaeg: täna on praegune hetk, vanem päev lõuna. */
function paevaAeg(k){
  const n=new Date();
  if(!k||k===dkey(n))return n.toISOString();
  const o=k.split("-").map(Number);
  if(o.length!==3||!o[0])return n.toISOString();
  return new Date(o[0],o[1]-1,o[2],12,0,0).toISOString();
}

/* Varukoopiat ei ole enam vaja meelde tuletada: andmed on ühises
   andmebaasis, mitte selle brauseri mälus. Riba asemel on väljalogimine. */
function varuRiba(){
  const el=$("#varu"); if(!el)return;

/* Pilt läheb samasse salvestusse kui kõik muu, seega ta peab olema väike.
   128×128 ruut ja JPEG — üks pilt jääb umbes 5 kB peale. */
function pisiPilt(file,cb){
  if(!/^image\//.test(file.type||"")){toast("See ei ole pildifail.");return;}
  const r=new FileReader();
  r.onerror=()=>toast("Faili ei õnnestunud lugeda.");
  r.onload=()=>{
    const im=new Image();
    im.onerror=()=>toast("Seda pilti ei õnnestunud avada.");
    im.onload=()=>{
      const N=128, c=document.createElement("canvas");
      c.width=c.height=N;
      const x=c.getContext("2d");
      const k=Math.min(im.width,im.height);          /* keskelt ruuduks */
      x.drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,N,N);
      try{cb(c.toDataURL("image/jpeg",0.75));}
      catch(_){toast("Pildi salvestamine ei õnnestunud.");}
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

function toast(msg,undo){
  const el=document.createElement("div");
  el.className="toast";
  el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button class="undo">Võta tagasi</button>':"");
  $("#toasts").appendChild(el);
  let dead=false;const kill=()=>{if(dead)return;dead=true;el.remove();};
  if(undo){el.querySelector(".undo").addEventListener("click",()=>{undo();kill();});setTimeout(kill,14000);}
  else setTimeout(kill,4200);
}

async function exportJSON(){
  const data=JSON.stringify(S,null,2);
  const fn=(S.group.name.replace(/[^\p{L}\p{N}]+/gu,"_")||"ring")+"_"+dkey(new Date())+".json";
  if(window.claude&&window.claude.downloads){
    try{
      await window.claude.downloads.save({filename:fn,data});
      S.group.varundatud=new Date().toISOString(); save(); varuRiba();
      toast("Koopia salvestatud.");
    }
    catch(err){
      const c=err&&err.code;
      if(c==="declined")toast("Salvestamine jäi katki.");
      else if(c==="too_large")toast("Andmeid on liiga palju. Kustuta mõni suur fail.");
      else if(c==="rate_limited")toast("Üks salvestusaken on juba lahti.");
      else showRaw(data);
    }
  }else showRaw(data);
}

  i.addEventListener("change",()=>{

        if(!p||p.v!==1||!Array.isArray(p.members))throw 0;
